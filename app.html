<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>MIRA</title>
  <link rel="icon" type="image/png" href="favicon-64.png">
  <!-- fórmulas em LaTeX nas questões e resoluções (KaTeX) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js" onload="window.formulasProntas && formulasProntas()"></script>
  <style>
  /* =====================================================================
     MIRA · sistema de design (regras completas em docs/design-system.md)
     Manual de identidade MIRA (nov/2026): roxo = marca, ação e seleção;
     turquesa e verde = acentos da mira (nunca texto sobre branco);
     verde/âmbar/vermelho escuros = situação. Arial.
     ===================================================================== */
  :root {
    --marca-900: #3B1A5C;
    --marca-700: #51237E;
    --marca-600: #6A3A9E;
    --marca-100: #EEE7F5;
    --marca-50: #F7F5FA;
    --acento-600: #63C4AF; /* turquesa: só acento visual (traços, indicadores) */
    --verde-marca: #9ACC57;
    --grad-mira: linear-gradient(90deg, #63C4AF, #9ACC57);
    --grad-menu: linear-gradient(180deg, #51237E 0%, #3B1A5C 100%);
    --grad-destaque: radial-gradient(130% 120% at 0% 0%, #6A3A9E 0%, #51237E 42%, #2E1248 100%);
    --sombra-card: 0 1px 2px rgba(81, 35, 126, .06), 0 8px 24px -10px rgba(81, 35, 126, .16);
    --sombra-botao: 0 8px 20px -8px rgba(81, 35, 126, .55);
    --n-900: #28212F;
    --n-700: #463E4F;
    --n-500: #665E6E;
    --n-400: #9A93A3;
    --n-300: #D3CDDA;
    --n-200: #E7E2ED;
    --n-100: #F1EDF5;
    --n-50: #F7F5FA;
    --ok: #15803D;     --ok-bg: #EAF7EF;
    --alerta: #B45309; --alerta-bg: #FEF6E7;
    --erro: #B91C1C;   --erro-bg: #FDECEC;

    --r-tag: 8px; --r-ctl: 12px; --r-card: 20px; --r-jan: 24px;
    --fonte: Arial, Helvetica, sans-serif;
    --estreita: var(--fonte); /* nome antigo: títulos e números grandes também em Arial */
    --sombra-jan: 0 24px 60px rgba(40, 33, 47, .22), 0 2px 6px rgba(40, 33, 47, .08);
    --sombra-flut: 0 10px 28px rgba(40, 33, 47, .16);

    /* contornos e variações das cores (mesmos valores que já estavam espalhados no CSS) */
    --marca-950: #3D1960;          /* miolo do anel da nota, no cartão de destaque */
    --marca-borda: #DDD0EB;        /* contorno do aviso roxo */
    --marca-tracejado: #CDBDE0;    /* contorno tracejado do "Seu próximo passo" */
    --verde-marca-escuro: #8BBE48; /* botão verde da marca ao passar o mouse */
    --ok-escuro: #116632;          /* botão de sucesso ao passar o mouse */
    --ok-borda: #9BD3B0;           /* contorno da alternativa certa */
    --ok-borda-clara: #BFE3CC;     /* contorno do aviso verde */
    --alerta-borda: #F4D9A6;       /* contorno do aviso âmbar */
    --erro-borda: #F3C2C2;         /* contorno do aviso vermelho */
    --erro-contorno: #E7B4B6;      /* contorno do botão de perigo */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--n-50); color: var(--n-900); font-family: var(--fonte);
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  /* nada pode empurrar a página para o lado (rolagem lateral no celular) */
  html, body { max-width: 100%; overflow-x: hidden; overflow-x: clip; overflow-wrap: break-word; }
  html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  img, video, canvas { max-width: 100%; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--marca-600); text-underline-offset: 2px; }
  a:hover { color: var(--marca-700); }
  h1, h2, h3 { margin: 0; line-height: 1.2; color: var(--n-900); }
  h1 { font-family: var(--estreita); font-size: 30px; font-weight: 700; letter-spacing: -.5px; }
  h2 { font-size: 18px; font-weight: 700; }
  h3 { font-size: 15px; font-weight: 600; }
  :focus-visible { outline: 2px solid var(--marca-600); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- casca: menu lateral roxo (logo no alto) + topo claro com busca, sino e usuário ---------- */
  .casca { display: flex; min-height: 100vh; }
  nav.menu { width: 248px; flex: none; position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 15;
    display: flex; flex-direction: column; padding: 22px 14px 18px; color: #fff; background: var(--grad-menu); }
  .menu-logo { display: block; width: 150px; height: auto; margin: 0 10px 26px; }
  nav.menu button { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: none; border: 0; padding: 10px 12px; border-radius: var(--r-ctl); cursor: pointer;
    color: rgba(255, 255, 255, .82); font-weight: 600; font-size: 14.5px; margin-bottom: 4px; transition: background .12s; }
  nav.menu .ic { width: 22px; height: 22px; color: currentColor; }
  nav.menu button:hover { background: rgba(255, 255, 255, .1); color: #fff; }
  nav.menu button.ativo { background: #fff; color: var(--marca-700); box-shadow: var(--sombra-card); }
  nav.menu button.ativo::before { content: ""; position: absolute; left: -14px; top: 10px; bottom: 10px; width: 4px;
    border-radius: 0 4px 4px 0; background: var(--acento-600); }
  .conteudo { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topo { position: sticky; top: 0; z-index: 12; height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 24px 0 32px;
    background: rgba(247, 245, 250, .88); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--n-200); }
  .topo .marca { display: none; }
  .marca .emblema { width: 34px; height: 34px; display: block; }
  /* busca */
  .busca { position: relative; flex: 1; max-width: 460px; }
  .busca-campo { display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 14px; background: #fff;
    border: 1px solid var(--n-200); border-radius: 999px; color: var(--n-500); }
  .busca-campo:focus-within { border-color: var(--marca-600); box-shadow: 0 0 0 3px var(--marca-100); }
  .busca-campo .ic { width: 18px; height: 18px; color: var(--n-500); }
  .busca-campo input { flex: 1; width: 100%; min-width: 0; border: 0 !important; outline: 0 !important; min-height: 0 !important; padding: 0 !important; background: transparent !important;
    font-size: 14.5px; box-shadow: none !important; }
  .busca-abrir { display: none; }
  .busca-res { position: absolute; left: 0; right: 0; top: calc(100% + 8px); background: #fff; border: 1px solid var(--n-200);
    border-radius: var(--r-card); box-shadow: var(--sombra-flut); padding: 8px; max-height: 70vh; overflow-y: auto; display: none; }
  .busca.aberta .busca-res { display: block; }
  .busca-res h4 { margin: 8px 10px 4px; font-size: 12px; font-weight: 700; color: var(--n-500); text-transform: uppercase; letter-spacing: .04em; }
  .busca-res button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: none; border: 0;
    padding: 9px 10px; border-radius: var(--r-ctl); cursor: pointer; font-size: 14px; color: var(--n-900); }
  .busca-res button:hover, .busca-res button.foco { background: var(--marca-50); }
  .busca-res button .ic { width: 18px; height: 18px; }
  .busca-res button small { display: block; color: var(--n-500); font-size: 12.5px; }
  .busca-res .nada { padding: 14px 10px; color: var(--n-500); font-size: 14px; }
  /* sino */
  .topo-acoes { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .sino { position: relative; }
  .sino > button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--n-200); background: #fff; display: grid; place-items: center;
    cursor: pointer; color: var(--marca-700); }
  .sino > button:hover { background: var(--marca-50); }
  .sino > button .ic { width: 20px; height: 20px; }
  .sino .bolha { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
    background: var(--erro); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; border: 2px solid #fff; }
  .sino-lista { position: absolute; right: 0; top: calc(100% + 8px); width: 340px; max-width: calc(100vw - 24px); background: #fff;
    border: 1px solid var(--n-200); border-radius: var(--r-card); box-shadow: var(--sombra-flut); padding: 8px; display: none; }
  .sino.aberto .sino-lista { display: block; }
  .sino-lista h4 { margin: 6px 10px 8px; font-size: 15px; }
  .sino-lista button { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; background: none; border: 0;
    padding: 10px; border-radius: var(--r-ctl); cursor: pointer; }
  .sino-lista button:hover { background: var(--marca-50); }
  .sino-lista .n { min-width: 30px; height: 30px; border-radius: 999px; background: var(--marca-100); color: var(--marca-700);
    font-weight: 700; font-size: 14px; display: grid; place-items: center; flex: none; padding: 0 6px; }
  .sino-lista b { display: block; font-size: 14px; }
  .sino-lista span { color: var(--n-500); font-size: 13px; }
  .sino-lista .nada { padding: 12px 10px 14px; color: var(--n-500); font-size: 14px; }
  /* usuário */
  .usuario { position: relative; }
  .usuario > button { display: flex; align-items: center; gap: 10px; background: transparent; border: 0; color: var(--n-900);
    padding: 4px 8px 4px 4px; border-radius: 999px; cursor: pointer; text-align: left; }
  .usuario > button:hover, .usuario.aberto > button { background: var(--n-100); }
  .avatar { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; flex: none; overflow: hidden;
    background: var(--marca-700); color: #fff; font-weight: 700; font-size: 14px; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar.grande { width: 72px; height: 72px; font-size: 24px; }
  .usuario .nome { font-size: 14px; font-weight: 700; line-height: 1.2; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .usuario .nome small { display: block; font-weight: 400; font-size: 12px; color: var(--n-500); }
  .usuario .seta { width: 9px; height: 9px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: rotate(45deg) translateY(-3px); opacity: .6; margin: 0 4px 0 2px; }
  .usuario-menu { position: absolute; right: 0; top: calc(100% + 8px); min-width: 210px; background: #fff; color: var(--n-900);
    border: 1px solid var(--n-200); border-radius: var(--r-card); box-shadow: var(--sombra-flut); padding: 6px; display: none; }
  .usuario.aberto .usuario-menu { display: block; }
  .usuario-menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 10px 12px;
    border-radius: var(--r-ctl); cursor: pointer; font-size: 14px; }
  .usuario-menu button:hover { background: var(--n-100); }
  .usuario-menu hr { border: 0; border-top: 1px solid var(--n-200); margin: 6px 0; }
  .usuario-menu .perigo { color: var(--erro); }

  main { width: 100%; min-width: 0; padding: 28px 32px 56px; max-width: 1160px; }
  #aviso-senha { max-width: 1160px; padding: 0 32px; }
  #aviso-senha .aviso { margin: 20px 0 -8px; }
  .cab-pag { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .cab-pag p { margin: 6px 0 0; color: var(--n-500); font-size: 14.5px; max-width: 72ch; }
  .cab-pag .acoes { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .cab-pag .sobre-tit { margin: 0 0 4px; color: var(--n-500); font-size: 14px; }

  @media (max-width: 820px) {
    .casca { display: block; }
    .topo { padding: 0 12px 0 16px; gap: 8px; }
    .topo .marca { display: flex; }
    .usuario .nome, .usuario .seta { display: none; }
    .usuario > button { padding: 2px; }
    .busca { position: static; flex: 0 0 auto; margin-left: auto; }
    .busca-campo { display: none; }
    .busca-abrir { display: grid; width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--n-200); background: #fff;
      place-items: center; color: var(--marca-700); cursor: pointer; }
    .busca-abrir .ic { width: 20px; height: 20px; }
    .busca.aberta .busca-campo { display: flex; position: absolute; left: 12px; right: 12px; top: 11px; z-index: 2; box-shadow: var(--sombra-flut); }
    .busca-res { left: 12px; right: 12px; top: 60px; }
    .topo-acoes { margin-left: 0; }
    nav.menu { position: fixed; left: 10px; right: 10px; bottom: 10px; top: auto; width: auto; height: auto; z-index: 20;
      flex-direction: row; padding: 6px; gap: 2px; border-radius: 22px; overflow-x: auto; box-shadow: 0 10px 30px rgba(40, 33, 47, .28);
      padding-bottom: calc(6px + env(safe-area-inset-bottom) / 2); scrollbar-width: none; }
    nav.menu::-webkit-scrollbar { display: none; }
    .menu-logo { display: none; }
    nav.menu button { width: auto; flex: 1 0 auto; min-width: 72px; flex-direction: column; gap: 3px; padding: 8px 8px 7px; margin: 0;
      font-size: 11.5px; text-align: center; justify-content: center; border-radius: 16px; white-space: nowrap; }
    nav.menu button span { max-width: 84px; overflow: hidden; text-overflow: ellipsis; }
    nav.menu button.ativo { background: rgba(255, 255, 255, .16); color: #fff; box-shadow: none; }
    nav.menu button.ativo::before { left: 30%; right: 30%; top: auto; bottom: 2px; width: auto; height: 3px; border-radius: 3px; }
    main { padding: 18px 16px 120px; }
    body #toast { bottom: calc(100px + env(safe-area-inset-bottom) / 2); width: calc(100% - 32px); max-width: 420px; } /* acima da barra de baixo */
    /* 16px nos campos: o iPhone não dá zoom ao tocar num campo */
    input, select, textarea, .diag .d-exp textarea, .diag .d-exp input { font-size: 16px; }
    #aviso-senha { padding: 0 16px; }
    #aviso-senha .aviso { margin: 16px 0 -4px; }
    h1 { font-size: 26px; }
    .grade { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .kpi { padding: 14px 16px; }
    .kpi .chip { width: 32px; height: 32px; margin-bottom: 8px; }
    .kpi b { font-size: 28px; }
    .anel-d { width: 128px; height: 128px; }
    .anel-d > div { width: 104px; height: 104px; }
    .anel-d b { font-size: 38px; }
  }

  /* ---------- componentes ---------- */
  .card { background: #fff; border: 1px solid var(--n-200); border-radius: var(--r-card); padding: 22px; margin-bottom: 16px; box-shadow: var(--sombra-card); }
  .card > h2, .card > h3 { margin-bottom: 12px; }
  .grade { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 16px; }
  .grade-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); align-items: start; }
  .kpi { padding: 18px 20px; background: #fff; border: 1px solid var(--n-200); border-radius: var(--r-card); box-shadow: var(--sombra-card); }
  .kpi .chip { width: 36px; height: 36px; border-radius: var(--r-ctl); background: var(--marca-100); display: grid; place-items: center; margin-bottom: 12px; }
  .kpi .chip .ic { width: 20px; height: 20px; }
  .kpi small { color: var(--n-500); font-size: 13px; }
  .kpi b { display: block; font-family: var(--estreita); font-size: 36px; font-weight: 700; line-height: 1.1; color: var(--n-900); margin-top: 4px; font-variant-numeric: tabular-nums; }

  .btn { border: 1px solid var(--n-300); background: #fff; min-height: 40px; padding: 8px 16px; border-radius: var(--r-ctl);
    cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; color: var(--n-900);
    transition: background .12s, border-color .12s; }
  .btn:hover { background: var(--n-100); }
  .btn.pri { background: var(--marca-700); border-color: var(--marca-700); color: #fff; box-shadow: var(--sombra-botao); }
  .btn.verde { background: var(--verde-marca); border-color: var(--verde-marca); color: var(--n-900); }
  .btn.verde:hover { background: var(--verde-marca-escuro); }
  .btn.pri:hover { background: var(--marca-900); border-color: var(--marca-900); }
  .foto-cartao { display: block; width: 100%; height: auto; border-radius: var(--r-ctl); border: 1px solid var(--n-200); background: #fff; }
  .previa { border: 1px dashed var(--n-300); border-radius: var(--r-ctl); padding: 12px 14px; background: var(--n-50); font-size: 14.5px; line-height: 1.55; }
  .previa-enun { white-space: pre-wrap; margin-bottom: 8px; }
  .katex { font-size: 1.08em; }
  .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
  .origem-ops { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
  .origem-op { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border: 1px solid var(--n-300); border-radius: var(--r-ctl);
    background: #fff; font-size: 14px; cursor: pointer; }
  .origem-op:has(input:checked) { border-color: var(--marca-600); background: var(--marca-50); color: var(--marca-700); font-weight: 600; }
  .origem-op input { margin: 0; accent-color: var(--marca-700); }
  .btn.perigo { color: var(--erro); border-color: var(--erro-contorno); }
  .btn.perigo:hover { background: var(--erro-bg); }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.ok:hover { background: var(--ok-escuro); }
  .btn.peq { min-height: 32px; padding: 4px 11px; font-size: 13px; }
  .btn.disc { border-color: transparent; background: transparent; color: var(--marca-600); }
  .btn.disc:hover { background: var(--marca-50); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  label.campo { display: block; margin-bottom: 16px; }
  label.campo > span { display: block; font-size: 13px; font-weight: 600; color: var(--n-700); margin-bottom: 6px; }
  input[type=text], input[type=email], input[type=password], input[type=date], select, textarea {
    width: 100%; min-height: 44px; padding: 9px 14px; border: 1px solid var(--n-300); border-radius: var(--r-ctl); background: #fff; }
  input::placeholder, textarea::placeholder { color: var(--n-400); }
  input:focus, select:focus, textarea:focus { outline: 3px solid var(--marca-100); outline-offset: 0; border-color: var(--marca-600); }
  input[type=checkbox], input[type=radio] { accent-color: var(--marca-700); }
  textarea { min-height: 72px; resize: vertical; line-height: 1.5; }
  .linha { display: flex; gap: 16px; flex-wrap: wrap; }
  .linha > * { flex: 1; min-width: min(160px, 100%); }

  /* etiquetas: neutras por padrão; .st = situação (pílula com ponto) */
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; padding: 2px 8px;
    border-radius: var(--r-tag); background: var(--n-100); color: var(--n-700); white-space: nowrap; line-height: 1.5; }
  .tag.st { border-radius: 999px; font-weight: 600; padding: 2px 10px 2px 8px; }
  .tag.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .tag.azul { background: var(--marca-100); color: var(--marca-700); }
  .tag.verde { background: var(--ok-bg); color: var(--ok); }
  .tag.verm { background: var(--erro-bg); color: var(--erro); }
  .tag.ambar { background: var(--alerta-bg); color: var(--alerta); }
  .meta { color: var(--n-500); font-size: 13.5px; }

  table.tab { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  table.tab th { text-align: left; font-size: 13px; font-weight: 600; color: var(--n-500); background: var(--n-100);
    padding: 9px 12px; border-bottom: 1px solid var(--n-200); }
  table.tab td { padding: 12px; border-bottom: 1px solid var(--n-200); vertical-align: top; }
  table.tab tr:last-child td { border-bottom: 0; }
  table.tab tr.clic { cursor: pointer; }
  table.tab tr.clic:hover td { background: var(--marca-50); }
  .card > .rolagem:first-child, .card.rolagem { padding: 0; }
  .card.rolagem > p { padding: 14px 16px 0; }
  .rolagem { overflow-x: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .mut { color: var(--n-500); }
  .peq { font-size: 13.5px; }
  .vazio { text-align: center; color: var(--n-500); padding: 36px 16px; }
  .vazio .ic-vazio { display: block; width: 64px; height: 64px; margin: 0 auto 12px; }

  /* barras */
  .barra { display: grid; grid-template-columns: 120px 1fr 56px; align-items: center; gap: 12px; margin: 8px 0; font-size: 14px; }
  .barra .trilho { height: 8px; background: var(--n-100); border-radius: 999px; overflow: hidden; }
  .barra .enche { height: 100%; border-radius: 999px; }
  .barra .v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--n-700); }

  .sit-lista { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
  .sit { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0;
    border-bottom: 1px solid var(--n-200); text-decoration: none; color: inherit; }
  .sit:hover .tag { filter: brightness(.97); }
  .sit b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--n-900); }
  @media (max-width: 520px) { .sit-lista { grid-template-columns: 1fr; } }

  /* questões */
  .q-lista { background: #fff; border: 1px solid var(--n-200); border-radius: var(--r-card); overflow: hidden; margin-bottom: 16px; }
  .q-item { cursor: pointer; position: relative; margin: 0; border: 0; border-radius: 0; padding: 14px 20px;
    border-top: 1px solid var(--n-200); background: #fff; }
  .q-item:first-child { border-top: 0; }
  .q-item:hover { background: var(--marca-50); }
  .q-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  .q-meta .dir { margin-left: auto; color: var(--n-400); font-size: 12.5px; }
  .q-trecho { color: var(--n-700); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .enun { white-space: pre-wrap; }
  .alts div { padding: 8px 12px; border-radius: var(--r-ctl); margin: 6px 0; border: 1px solid var(--n-200); }
  .alts .certa { background: var(--ok-bg); border-color: var(--ok-borda); font-weight: 600; }
  .alts .prof { box-shadow: inset 3px 0 0 var(--alerta); }
  .alt-marca { float: right; margin-left: 10px; font-size: 12px; font-weight: 600; color: var(--ok); }
  .gab-badge { display: inline-flex; align-items: baseline; gap: 8px; margin: 2px 0 14px; padding: 6px 12px; border-radius: var(--r-ctl);
    background: var(--ok-bg); color: var(--ok); font-size: 14px; border: 1px solid var(--ok-borda); }
  .gab-badge b { font-family: var(--estreita); font-size: 20px; line-height: 1; }
  .gab-badge span { font-size: 12.5px; color: var(--n-500); }
  .tag.gab { background: var(--ok-bg); color: var(--ok); font-weight: 600; }

  /* formulário da questão */
  .dica { background: var(--n-100); border-radius: var(--r-ctl); padding: 10px 12px; margin: -6px 0 16px; color: var(--n-700); }
  .figs { display: flex; flex-direction: column; gap: 8px; }
  .fig-card { display: flex; gap: 12px; align-items: center; border: 1px solid var(--n-200); border-radius: var(--r-ctl); padding: 8px; }
  .fig-card img { width: 110px; max-height: 80px; object-fit: contain; background: #fff; border-radius: 4px; flex: none; }
  .fig-ph { margin: 10px 0; padding: 18px; text-align: center; border: 1px dashed var(--n-300); border-radius: var(--r-ctl); color: var(--n-500); font-size: 13px; }
  .alt-lin { display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; border-radius: var(--r-ctl); padding: 3px; }
  .alt-gab { display: flex; align-items: center; gap: 4px; padding: 9px 4px 0; font-weight: 600; cursor: pointer; }
  .alt-ok { display: none; flex: none; align-self: center; font-size: 12px; font-weight: 600; color: var(--ok); }
  .alt-lin.gab-on { background: var(--ok-bg); box-shadow: 0 0 0 1px var(--ok-borda); }
  .alt-lin.gab-on .alt-ok { display: inline-block; }
  .alt-lin.gab-on .alt-gab { color: var(--ok); }

  /* aprovação em lote */
  .lote { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    background: #fff; border: 1px solid var(--n-200); border-radius: var(--r-card); padding: 10px 12px 10px 16px; margin-bottom: 12px;
    position: sticky; top: 64px; z-index: 5; }
  .lote label { display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--n-700); font-size: 14px; }
  .lote input, .q-sel-box input { width: 18px; height: 18px; margin: 0; }
  .q-item.com-sel { padding-left: 56px; }
  .q-sel-box { position: absolute; left: 0; top: 0; bottom: 0; width: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .q-sel-box:hover { background: var(--marca-100); }

  /* seleção de alunos (cartões) */
  .alunos-sel { max-height: 50vh; overflow: auto; border: 1px solid var(--n-200); border-radius: var(--r-ctl); }
  .aluno-sel { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--n-200); cursor: pointer; }
  .aluno-sel:last-child { border-bottom: 0; }
  .aluno-sel:hover { background: var(--n-50); }
  .aluno-sel input { width: 18px; height: 18px; margin: 0; flex: none; }
  .aluno-sel small { display: block; color: var(--n-500); font-size: 12.5px; }

  /* ações do simulado: botões leves, agrupados */
  .sim-acoes { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-top: 14px; border-top: 1px solid var(--n-200); }
  .sim-acoes .btn { background: var(--n-100); border-color: transparent; }
  .sim-acoes .btn:hover { background: var(--marca-100); color: var(--marca-700); }
  .sim-acoes select { width: auto; min-height: 32px; margin-left: auto; padding: 4px 8px; }

  /* versões */
  .sel-tag { width: auto; min-height: 0; border: 0; background: transparent; padding: 0 2px; font: inherit; font-weight: 600; color: var(--n-900); }
  .versoes { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn.versao { flex-direction: column; align-items: flex-start; gap: 0; padding: 10px 16px; min-width: 128px; }
  .btn.versao small { font-weight: 400; color: var(--n-500); font-size: 12.5px; }
  .btn.versao.on { background: var(--marca-700); border-color: var(--marca-700); color: #fff; }
  .btn.versao.on small { color: rgba(255, 255, 255, .75); }

  /* crédito (discreto) */
  .credito { font-size: 12px; color: var(--n-400); margin: 0; }

  /* relatório de curadoria */
  .diag { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 0; margin: 8px 0;
    border: 1px solid var(--n-200); border-radius: var(--r-ctl); overflow: hidden; }
  .diag > div { padding: 10px 14px; }
  .diag .d-alt { white-space: pre-wrap; }
  .diag .d-exp { background: var(--n-50); border-left: 1px solid var(--n-200); font-size: 13.5px; color: var(--n-700); }
  .diag .d-exp p { margin: 0 0 4px; }
  .diag .d-exp ul { margin: 0 0 4px; padding-left: 18px; }
  .diag .d-exp textarea, .diag .d-exp input { font-size: 13px; margin-bottom: 6px; }
  .diag.certa { border-color: var(--ok-borda); }
  .diag.certa .d-alt, .diag.certa .d-exp { background: var(--ok-bg); }
  .diag.certa .d-exp { color: var(--ok); font-weight: 600; }
  .diag.mudou .d-alt { box-shadow: inset 3px 0 0 var(--marca-600); }
  .diag .rot { display: inline-block; font-size: 12px; font-weight: 600; color: var(--marca-700); background: var(--marca-100);
    padding: 1px 8px; border-radius: var(--r-tag); margin-bottom: 6px; }
  .diag .antes { font-size: 12.5px; color: var(--n-500); margin-top: 4px; }
  @media (max-width: 640px) {
    .diag { grid-template-columns: 1fr; }
    .diag .d-exp { border-left: 0; border-top: 1px solid var(--n-200); }
  }
  details.orig { margin: 8px 0 12px; }
  details.orig summary { cursor: pointer; color: var(--marca-600); font-size: 13.5px; font-weight: 600; }
  .parecer { margin-top: 16px; border-color: var(--marca-600); box-shadow: 0 0 0 3px var(--marca-100); }
  .figura { max-width: 100%; max-height: 320px; display: block; margin: 12px 0; border: 1px solid var(--n-200); border-radius: var(--r-ctl); }

  /* cartão (aluno) */
  .gabgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(230px, 100%), 1fr)); gap: 6px 18px; }
  .gq { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: var(--r-ctl); }
  .gq.alerta { background: var(--alerta-bg); }
  .gq.ajustada .n { color: var(--marca-700); }
  .gq .aj { font-size: 12px; color: var(--marca-700); font-weight: 600; }
  .gq .n { width: 28px; text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--n-700); }
  .gq button { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--n-300); background: #fff;
    cursor: pointer; font-weight: 600; font-size: 12.5px; padding: 0; color: var(--n-700); }
  .gq button.on { background: var(--marca-700); border-color: var(--marca-700); color: #fff; }
  .gq button.x { background: var(--erro); border-color: var(--erro); color: #fff; }
  .passos { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .passos span { font-size: 13px; padding: 4px 12px; border-radius: 999px; background: var(--n-100); color: var(--n-500); }
  .passos span.on { background: var(--marca-700); color: #fff; }
  .foto-opcoes { display: flex; gap: 8px; flex-wrap: wrap; }
  .foto-opcoes .btn { cursor: pointer; }
  .foto-opcoes input, .foto-acoes input { display: none; }
  @media (max-width: 520px) { .foto-opcoes .btn { flex: 1 1 100%; justify-content: center; } }
  .foto-prev { max-width: 100%; max-height: 360px; border-radius: var(--r-ctl); border: 1px solid var(--n-200); display: block; margin: 12px 0; }

  /* relatório */
  .def { border: 1px solid var(--n-200); border-left: 3px solid var(--erro); padding: 12px 16px; background: #fff;
    border-radius: 0 var(--r-ctl) var(--r-ctl) 0; margin-bottom: 10px; }
  .def h3 { font-size: 15px; margin-bottom: 4px; }
  .plano { white-space: normal; line-height: 1.6; }
  .plano h4 { margin: 14px 0 4px; color: var(--n-900); font-size: 15px; font-weight: 600; }
  .plano ul { margin: 4px 0; padding-left: 20px; }

  /* ---------- missões (estratégias do aluno) ---------- */
  .mis-placar { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: stretch; }
  .mis-nivel { display: flex; gap: 14px; align-items: center; padding: 14px 16px; border-radius: var(--r-card); background: var(--grad-destaque); color: #fff; }
  .mis-nivel > div { flex: 1; min-width: 0; }
  .mis-nivel b { font-size: 16px; }
  .mis-selo { flex: none; width: 58px; height: 58px; border-radius: 50%; display: grid; place-content: center; text-align: center;
    background: rgba(255, 255, 255, .12); box-shadow: inset 0 0 0 3px var(--verde-marca); line-height: 1; }
  .mis-selo b { font-size: 24px; }
  .mis-selo small { font-size: 10.5px; opacity: .85; margin-top: 2px; }
  .mis-xp { height: 8px; border-radius: 99px; background: rgba(255, 255, 255, .18); margin: 8px 0 6px; overflow: hidden; }
  .mis-xp i { display: block; height: 100%; border-radius: 99px; background: var(--grad-mira); transition: width .4s ease; }
  .mis-falta { font-size: 12.5px; opacity: .9; }
  .mis-num { display: flex; flex-direction: column; justify-content: center; padding: 12px 14px; border: 1px solid var(--n-200); border-radius: var(--r-card); background: #fff; }
  .mis-num .ic { width: 20px; height: 20px; color: var(--marca-600); }
  .mis-num b { font-size: 26px; line-height: 1.1; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .mis-num span { font-size: 12.5px; color: var(--n-500); }
  .mis-conq { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
  .conq { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px 6px 8px; border-radius: 99px; font-size: 12.5px; font-weight: 600;
    border: 1px dashed var(--n-300); color: var(--n-400); background: var(--n-50); }
  .conq .ic { width: 16px; height: 16px; }
  .conq.ok { border: 1px solid transparent; background: var(--marca-100); color: var(--marca-700); }
  .conq.ok .ic { color: var(--marca-700); }
  .mis-regras { margin: 6px 0 14px; }
  .mis-grupos { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); align-items: start; }
  .mis-grupo { border: 1px solid var(--n-200); border-radius: var(--r-card); padding: 16px 16px 12px; background: #fff; }
  .mis-grupo.completa { border-color: var(--marca-100); background: var(--marca-50); }
  .mis-cab { display: flex; align-items: center; gap: 8px; }
  .mis-cab h3 { margin: 0; font-size: 17px; font-weight: 600; }
  .mis-cont { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--n-500); font-weight: 600; font-variant-numeric: tabular-nums; }
  .mis-grupo.completa .mis-cont { color: var(--marca-700); }
  .mis-cont .ic { width: 16px; height: 16px; }
  .mis-mini { height: 6px; border-radius: 99px; background: var(--n-100); margin: 10px 0; overflow: hidden; }
  .mis-mini i { display: block; height: 100%; border-radius: 99px; background: var(--grad-mira); transition: width .4s ease; }
  .mis-ctx { margin: 0 0 8px; font-size: 13.5px; color: var(--n-500); }
  .mis-lista { list-style: none; margin: 0; padding: 0; }
  .mis-lista li + li { border-top: 1px solid var(--n-100); }
  .mis { display: flex; align-items: flex-start; gap: 10px; padding: 10px 2px; cursor: pointer; font-size: 14.5px; line-height: 1.45; }
  .mis input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .mis-caixa { flex: none; width: 22px; height: 22px; margin-top: 1px; border-radius: 7px; border: 2px solid var(--n-300); background: #fff;
    display: grid; place-items: center; transition: background .15s, border-color .15s; }
  .mis-caixa::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); opacity: 0; }
  .mis input:checked + .mis-caixa { background: var(--marca-700); border-color: var(--marca-700); }
  .mis input:checked + .mis-caixa::after { opacity: 1; }
  .mis input:focus-visible + .mis-caixa { outline: 2px solid var(--marca-600); outline-offset: 2px; }
  .mis-txt { flex: 1; min-width: 0; }
  .mis.feita .mis-txt { color: var(--n-500); text-decoration: line-through; text-decoration-color: var(--n-300); }
  .mis-pts { flex: none; font-size: 12px; font-weight: 700; color: var(--marca-600); background: var(--marca-50); border-radius: 99px; padding: 2px 8px; margin-top: 1px; }
  .mis.feita .mis-pts { color: var(--n-400); background: var(--n-50); }
  .mis-fecho { margin: 8px 0 0; font-size: 13.5px; color: var(--n-700); font-weight: 600; }
  .mis-pe { margin-top: 8px; font-size: 12.5px; color: var(--n-400); }
  /* tela Missões: disciplinas recolhidas e faixas coloridas (toque = cumprida) */
  .mis-num b small { font-size: 15px; color: var(--n-500); font-weight: 600; }
  .mis-semana { display: flex; gap: 5px; margin: 6px 0 4px; }
  .mis-semana i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--n-300); }
  .mis-semana i.on { background: var(--verde-marca); border-color: var(--verde-marca); }
  .conq-estrela { font-size: 15px; line-height: 16px; width: 16px; text-align: center; }
  .mis-dica { margin: 0 0 12px; }
  .mis-discs { display: grid; gap: 10px; }
  .mis-disc { border: 1px solid var(--n-200); border-radius: var(--r-card); background: #fff; overflow: hidden; }
  .mis-disc.completa { background: var(--marca-50); border-color: var(--marca-100); }
  .mis-disc-cab { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; min-height: 64px; background: transparent; border: 0;
    font: inherit; color: inherit; text-align: left; cursor: pointer; }
  .mis-disc-cab:disabled { cursor: default; color: inherit; opacity: 1; }
  .mis-disc-cab:focus-visible { outline: 2px solid var(--marca-600); outline-offset: -2px; border-radius: var(--r-card); }
  .mis-disc-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .mis-disc-lin { display: flex; align-items: baseline; gap: 8px; }
  .mis-disc-lin b { font-size: 17px; font-weight: 600; }
  .mis-disc-lin .mis-cont { margin-left: auto; }
  .mis-disc.completa .mis-cont { color: var(--marca-700); }
  .mis-disc .mis-mini { margin: 0; display: block; }
  .mis-seta { flex: none; width: 10px; height: 10px; border: solid var(--n-500); border-width: 0 2.5px 2.5px 0; transform: rotate(-45deg); transition: transform .2s; margin-right: 4px; }
  .mis-disc-cab[aria-expanded="true"] .mis-seta { transform: rotate(45deg); }
  .mis-faixas { display: grid; gap: 10px; padding: 0 12px 12px; }
  .mis-faixa { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 12px 14px 12px 16px; border: 0;
    border-radius: 16px; font: inherit; text-align: left; cursor: pointer; transition: transform .35s ease, opacity .35s ease; }
  .mis-faixa.c0 { background: var(--marca-700); color: #fff; }
  .mis-faixa.c1 { background: var(--acento-600); color: var(--n-900); }
  .mis-faixa.c2 { background: var(--verde-marca); color: var(--n-900); }
  .mis-faixa:hover { filter: brightness(1.05); }
  .mis-faixa:active { transform: scale(.98); }
  .mis-faixa:focus-visible { outline: 3px solid var(--marca-600); outline-offset: 2px; }
  .mis-f-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: 15px; font-weight: 600; line-height: 1.35; }
  .mis-f-txt small { font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .02em; opacity: .85; }
  .mis-f-ok { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 2.5px solid currentColor; opacity: .55; display: grid; place-items: center; }
  .mis-f-ok::after { content: ""; width: 6px; height: 12px; border: solid currentColor; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); opacity: 0; }
  .mis-faixa:hover .mis-f-ok { opacity: .9; }
  .mis-f-pts { position: absolute; top: -8px; right: 10px; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: #fff; color: var(--marca-700);
    box-shadow: 0 1px 3px rgba(40, 33, 47, .15); }
  .mis-faixa.saindo { transform: translateX(24px); opacity: 0; }
  .mis-faixa.saindo .mis-f-ok { opacity: 1; background: #fff; border-color: #fff; color: var(--marca-700); }
  .mis-faixa.saindo .mis-f-ok::after { opacity: 1; }
  .mis-faixas .mis-pe { margin: 2px 4px 0; }
  .mis-hist { margin-top: 16px; }
  .mis-hist > summary { display: flex; align-items: baseline; gap: 10px; cursor: pointer; list-style: none; }
  .mis-hist > summary::-webkit-details-marker { display: none; }
  .mis-hist > summary h2 { margin: 0; }
  .mis-hist > summary h2::before { content: "▸"; display: inline-block; width: 18px; color: var(--n-400); transition: transform .15s; }
  .mis-hist[open] > summary h2::before { transform: rotate(90deg); }
  .mis-h-dia { margin: 16px 0 4px; font-size: 13px; font-weight: 700; color: var(--n-500); text-transform: uppercase; letter-spacing: .03em; }
  .mis-h-lista { list-style: none; margin: 0; padding: 0; }
  .mis-h-lista li { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--n-100); }
  .mis-h-ok { flex: none; width: 22px; height: 22px; border-radius: 7px; background: var(--marca-700); display: grid; place-items: center; }
  .mis-h-ok::after { content: ""; width: 5px; height: 10px; border: solid #fff; border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
  .mis-h-txt { flex: 1; min-width: 0; font-size: 14px; line-height: 1.4; color: var(--n-700); }
  .mis-h-txt small { display: block; font-size: 12px; font-weight: 600; color: var(--marca-600); }
  .mis-h-desf { flex: none; border: 0; background: transparent; color: var(--marca-700); font: inherit; font-size: 13px; font-weight: 700; padding: 12px 6px; cursor: pointer; }
  .mis-hoje { align-self: flex-start; font-style: normal; font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; background: #fff; color: var(--marca-700); margin-bottom: 3px; }
  .mis-como { display: inline-block; margin-left: 6px; font-size: 11.5px; font-weight: 700; padding: 0 7px; border-radius: 99px; vertical-align: 1px; background: var(--n-100); color: var(--n-700); }
  .mis-como.c-facil { background: var(--ok-bg); color: var(--ok); }
  .mis-como.c-dificil { background: var(--alerta-bg); color: var(--alerta); }
  .est-dificil { display: block; margin-top: 4px; color: var(--alerta); }
  .est-dificil b { color: var(--n-900); font-weight: 600; }
  /* Início: missão do dia e fechar o ciclo */
  .dia-faixa { cursor: default; min-height: 0; }
  .dia-faixa:hover { filter: none; }
  .dia-faixa:active { transform: none; }

  .dia-opcoes { display: grid; gap: 8px; margin-bottom: 12px; }

    font-size: 14.5px; line-height: 1.4; color: var(--n-900); cursor: pointer; min-height: 44px; }
  .dia-op:hover { border-color: var(--marca-600); background: var(--marca-50); }
  .dia-op:focus-visible { outline: 2px solid var(--marca-600); outline-offset: 2px; }
  .dia-op small { display: block; font-size: 12px; font-weight: 600; color: var(--marca-600); }
  .dia-ok { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--marca-50); margin-bottom: 10px; }
  .dia-ok .ic { width: 28px; height: 28px; color: var(--marca-700); flex: none; }
  .dia-ok b { display: block; color: var(--marca-700); }

  .ini-ver { margin-top: auto; align-self: flex-start; }
  .ciclo { margin-top: 16px; }
  .ciclo-lista { list-style: none; margin: 4px 0 0; padding: 0; }
  .ciclo-lista li { padding: 10px 0; }
  .ciclo-lista li + li { border-top: 1px solid var(--n-100); }
  .ciclo-cab { display: flex; align-items: baseline; gap: 10px; }

  .ciclo-num { margin-left: auto; font-weight: 700; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--n-700); }
  .ciclo-num.sobe { color: var(--ok); }
  .ciclo-num.cai { color: var(--alerta); }
  .ciclo-lista p { margin: 2px 0 0; font-size: 14px; color: var(--n-500); line-height: 1.45; }
  /* temas do último simulado (professor e coordenação) */
  .temas-ult > summary { display: flex; align-items: baseline; gap: 10px; cursor: pointer; list-style: none; }
  .temas-ult > summary::-webkit-details-marker { display: none; }
  .temas-ult > summary h2 { margin: 0; }
  .temas-ult > summary h2::before { content: "▸"; display: inline-block; width: 18px; color: var(--n-400); transition: transform .15s; }
  .temas-ult[open] > summary h2::before { transform: rotate(90deg); }
  .tm-dica { margin: 10px 0 14px; line-height: 1.5; }
  .temas-grade { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); }
  .tm-disc { border: 1px solid var(--n-200); border-radius: var(--r-card); padding: 14px 16px; background: #fff; }
  .tm-cab { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .tm-cab h3 { margin: 0; font-size: 17px; }
  .tm-cols { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(180px, 100%), 1fr)); }
  .tm-tit { margin: 4px 0 6px; font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
  .tm-tit.erro { color: var(--alerta); }
  .tm-tit.ok { color: var(--ok); }
  .tm-lista { list-style: none; margin: 0; padding: 0; }
  .tm-lista li { padding: 6px 0; }
  .tm-lista li + li { border-top: 1px solid var(--n-100); }
  .tm-lin { display: flex; align-items: baseline; gap: 8px; }
  .tm-nome { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; line-height: 1.35; }
  .tm-pct { font-size: 14px; font-variant-numeric: tabular-nums; }

  .tm-pct.ok { color: var(--ok); }
  .tm-barra { height: 5px; border-radius: 99px; background: var(--n-100); margin: 5px 0 4px; overflow: hidden; }
  .tm-barra i { display: block; height: 100%; border-radius: 99px; }

  .tm-barra i.ok { background: var(--ok); }
  .tm-pe { display: flex; align-items: center; gap: 6px 8px; flex-wrap: wrap; font-size: 12px; color: var(--n-500); }
  .tm-volta { font-weight: 700; color: var(--alerta); background: var(--alerta-bg); border-radius: 99px; padding: 0 7px; }
  .tm-nova { margin-left: auto; }
  .s-rep { display: flex; gap: 8px; align-items: flex-start; margin: 10px 0 6px; font-size: 14px; line-height: 1.45; }
  .s-rep input { margin-top: 3px; }
  .s-temas ul { margin: 4px 0 0; padding-left: 18px; }
  .mis-quando { flex: none; font-size: 12px; color: var(--n-400); margin-top: 2px; font-variant-numeric: tabular-nums; }
  .mis-vazio { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--r-card); background: var(--marca-50); margin-bottom: 14px; }
  .mis-vazio .ic { width: 28px; height: 28px; color: var(--marca-700); flex: none; }
  .mis-vazio b { display: block; color: var(--marca-700); }
  .mis-vazio span { font-size: 13.5px; color: var(--n-500); }
  /* ---------- edital (temas estudados, estrelas e Dominando) ---------- */
  .ed-resumo { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .ed-resumo .mis-num b small { font-size: 15px; color: var(--n-500); font-weight: 600; }
  .mis-num .ed-ic-estrela { font-size: 22px; line-height: 20px; color: var(--marca-600); }
  .ed-regra { margin: 12px 0 14px; line-height: 1.5; }
  .ed-discs { display: grid; gap: 10px; }
  .ed-disc { border: 1px solid var(--n-200); border-radius: var(--r-card); background: #fff; }
  .ed-disc summary { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "nome cont" "barra barra"; align-items: center;
    gap: 6px 10px; padding: 12px 16px; cursor: pointer; list-style: none; }
  .ed-disc summary::-webkit-details-marker { display: none; }
  .ed-disc summary b { grid-area: nome; font-size: 16px; font-weight: 600; }
  .ed-disc summary b::before { content: "▸"; display: inline-block; width: 16px; color: var(--n-400); transition: transform .15s; }
  .ed-disc[open] summary b::before { transform: rotate(90deg); }
  .ed-disc summary .ed-cont { grid-area: cont; font-size: 13px; font-weight: 600; color: var(--n-500); font-variant-numeric: tabular-nums; }
  .ed-disc summary .mis-mini { grid-area: barra; margin: 0; display: block; }
  .ed-est-n { color: var(--marca-600); }
  .ed-lista { list-style: none; margin: 0; padding: 0 16px 6px; }
  .ed-lista > li + li { border-top: 1px solid var(--n-100); }
  .ed-item { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
  .ed-tema { flex: 1; min-width: 0; display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; }
  .ed-tema b { font-size: 14.5px; font-weight: 500; line-height: 1.4; }
  .ed-linha { flex-basis: 100%; display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; }
  .ed-estrelas { display: inline-flex; flex-wrap: wrap; gap: 1px; font-size: 16px; line-height: 1; letter-spacing: 0; }
  .ed-estrelas i { font-style: normal; color: var(--n-300); }
  .ed-estrelas i.on { color: var(--marca-600); }
  .ed-vezes { font-size: 12.5px; color: var(--n-500); }
  .mis.ed-estudei { flex: none; padding: 4px 0; font-size: 13px; font-weight: 600; color: var(--n-500); align-items: center; gap: 8px; }
  .ed-item.feito .ed-estudei { color: var(--marca-700); }
  /* ---------- Início do aluno ---------- */
  .ini-cards { margin-top: 4px; }
  .ini-card { display: flex; flex-direction: column; }
  .ini-cab { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .ini-cab h2 { margin: 0; display: inline-flex; align-items: center; gap: 8px; }
  .ini-cab h2 .ic { width: 20px; height: 20px; color: var(--marca-600); }
  .ini-cab .mut { margin-left: auto; }
  .ini-mais, .ini-txt { margin: 0 0 12px; }
  .ini-barra { height: 8px; margin: 4px 0 12px; }
  .ini-nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
  .ini-nums b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .ini-nums b small { font-size: 14px; color: var(--n-500); }
  .ini-nums span { font-size: 12.5px; color: var(--n-500); }
  .ini-card > .btn { margin-top: auto; align-self: flex-start; }
  .ini-lista-at { margin-bottom: 14px; }
  .ini-card .sit-lista { margin-bottom: 14px; }
  .sec-tit { margin: 28px 0 12px; }
  .meu-tit { margin: 10px 0 2px; }
  .meu-cod { font-family: monospace; font-weight: 700; font-size: 13px; color: var(--n-500); }
  .meu-acoes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; align-items: center; }
  .mis-rot { display: block; font-size: 12px; font-weight: 600; color: var(--marca-600); line-height: 1.3; margin-bottom: 1px; }
  @media (max-width: 820px) { .meu-acoes .btn { flex: 1 1 140px; justify-content: center; } }
  @media (max-width: 820px) {
    .ed-resumo { gap: 8px; }
    .ed-resumo .mis-num { padding: 10px 12px; }
    .mis-placar { grid-template-columns: 1fr 1fr; }
    .mis-nivel { grid-column: 1 / -1; }
  }
  .est-lista { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); }
  .est-lista.larga { grid-template-columns: 1fr; gap: 12px; }
  .est-lista.larga > .card { margin: 0; }
  .est-lista:not(.larga) > .est { border: 1px solid var(--n-200); border-radius: var(--r-card); padding: 16px 18px; }
  .est-cab { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .est-cab h3 { margin: 0; font-size: 17px; font-weight: 600; }
  .est-cab .meta { color: var(--n-500); font-size: 13px; font-variant-numeric: tabular-nums; }
  .est-cab .st { margin-left: auto; }
  .est-sel { width: 18px; height: 18px; margin: 0; }
  .est-meta { color: var(--n-500); font-size: 13px; margin: 4px 0 0; }
  .est-meta b { color: var(--n-700); font-weight: 600; }
  .est-corpo { margin-top: 6px; }
  .est-corpo h4:first-child { margin-top: 8px; }
  .est-txt { margin-top: 12px; font-size: 14.5px; line-height: 1.55; }
  .est-acoes { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .est-acoes > span { flex: 1; min-width: min(200px, 100%); }
  .est-pe { margin-top: 8px; }
  .est-pe a { margin-left: 8px; }
  .tab th.num { text-align: right; }

  /* gráficos do Painel do aluno */
  .graf-card { position: relative; }
  .graf { display: block; overflow: visible; touch-action: pan-y; }
  .graf .grade-l { stroke: var(--n-200); stroke-width: 1; }
  .graf .eixo { font: 400 12px var(--fonte); fill: var(--n-500); }
  .graf .rotulo { font: 600 13px var(--fonte); fill: var(--n-900); }
  .graf .linha { fill: none; stroke: var(--marca-600); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .graf .ponto { fill: var(--marca-600); stroke: #fff; stroke-width: 2; cursor: pointer; outline: none; }
  .graf .ponto:focus-visible { stroke: var(--marca-100); stroke-width: 4; }
  .graf .cruz { stroke: var(--n-400); stroke-width: 1; }
  .graf .alvo { cursor: pointer; }
  .graf-dica { position: absolute; display: none; z-index: 5; pointer-events: none; background: #fff; border: 1px solid var(--n-200);
    border-radius: var(--r-ctl); box-shadow: 0 6px 20px rgba(40, 33, 47, .12); padding: 8px 12px; font-size: 13px; max-width: 260px; }
  .graf-dica b { display: block; font-size: 16px; color: var(--n-900); font-variant-numeric: tabular-nums; }
  .graf-dica span { display: block; color: var(--n-500); line-height: 1.4; }
  .graf-dica .acao { color: var(--marca-600); margin-top: 2px; }
  .graf-filtro { margin: 0 0 12px; max-width: 420px; }
  .graf-legenda { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--n-500); margin: 0 0 8px; }
  .graf-legenda span { display: inline-flex; align-items: center; gap: 6px; }
  .lg-barra { width: 14px; height: 10px; border-radius: 0 3px 3px 0; background: var(--marca-600); }
  .lg-traco { width: 2px; height: 14px; background: var(--n-900); }
  .gd-linha, .gd-eixo { display: grid; grid-template-columns: 96px 1fr 52px; align-items: center; gap: 10px; }
  .gd-linha { padding: 7px 0; border-radius: var(--r-ctl); cursor: default; outline: none; }
  .gd-linha:hover, .gd-linha:focus-visible { background: var(--marca-50); }
  .gd-nome { font-size: 14px; color: var(--n-700); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 4px; }
  .gd-trilho { position: relative; height: 14px;
    background: linear-gradient(90deg, transparent calc(50% - .5px), var(--n-200) calc(50% - .5px), var(--n-200) calc(50% + .5px), transparent calc(50% + .5px)); }
  .gd-barra { position: absolute; left: 0; top: 0; bottom: 0; background: var(--marca-600); border-radius: 0 4px 4px 0; min-width: 2px; }
  .gd-media { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--n-900); border-radius: 1px;
    box-shadow: 0 0 0 2px #fff; }
  .gd-v { text-align: right; font-weight: 600; font-size: 14px; color: var(--n-900); font-variant-numeric: tabular-nums; padding-right: 4px; }
  .gd-eixo { margin-top: 2px; }
  .gd-escala { display: flex; justify-content: space-between; font-size: 12px; color: var(--n-500); }
  .gd-escala i { font-style: normal; }
  details.tabela-graf summary { cursor: pointer; color: var(--marca-600); font-weight: 600; font-size: 14px; }
  details.tabela-graf[open] summary { margin-bottom: 12px; }
  .sit-certa { color: var(--ok); font-weight: 600; }
  .sit-errada { color: var(--erro); font-weight: 600; }
  .sit-branco, .sit-dupla { color: var(--alerta); font-weight: 600; }
  .sit-anulada { color: var(--n-500); font-weight: 600; }
  details.res summary { cursor: pointer; color: var(--marca-600); font-size: 13px; }

  /* janelas, avisos flutuantes, carregando, avisos */
  .fundo { position: fixed; inset: 0; background: rgba(40, 33, 47, .5); z-index: 50; display: flex;
    align-items: flex-start; justify-content: center; padding: 32px 14px; overflow-y: auto; }
  .janela { background: #fff; border-radius: var(--r-jan); width: 100%; max-width: 760px; padding: 24px; box-shadow: var(--sombra-jan); }
  .janela.larga { max-width: 1000px; }
  .janela .topo-j { display: flex; align-items: center; gap: 12px; margin: -4px 0 18px; }
  .janela .topo-j h2 { font-size: 20px; }
  .janela .topo-j .fechar { margin-left: auto; }
  .janela iframe { width: 100%; height: 70vh; border: 1px solid var(--n-200); border-radius: var(--r-ctl); background: #fff; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 80; display: flex; flex-direction: column; gap: 8px; }
  #toast > div { background: var(--n-900); color: #fff; padding: 11px 16px; border-radius: var(--r-ctl); box-shadow: var(--sombra-flut);
    max-width: min(90vw, 520px); font-size: 14px; }
  #toast > div.erro { background: var(--erro); }
  #toast .t-linha { display: flex; align-items: center; gap: 14px; }
  #toast .t-linha span { flex: 1; }
  #toast .t-pergunta { display: flex; align-items: center; gap: 6px; margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, .15); flex-wrap: wrap; }
  #toast .t-pergunta span { flex: 1 0 auto; font-size: 13.5px; opacity: .85; }
  #toast .t-pergunta button { border: 1px solid rgba(255, 255, 255, .35); background: transparent; color: #fff; font: inherit; font-size: 13.5px; font-weight: 600;
    padding: 6px 12px; min-height: 36px; border-radius: 99px; cursor: pointer; }
  #toast .t-pergunta button:hover { background: rgba(255, 255, 255, .12); }
  #toast .t-linha button { flex: none; border: 0; background: transparent; color: var(--verde-marca); font: inherit; font-weight: 700; padding: 6px 4px; cursor: pointer; }
  .carregando { display: flex; align-items: center; gap: 10px; color: var(--n-500); padding: 20px 4px; }
  .giro { width: 18px; height: 18px; border: 2.5px solid var(--n-200); border-top-color: var(--marca-600); border-radius: 50%;
    animation: giro .8s linear infinite; flex: none; }
  @keyframes giro { to { transform: rotate(360deg); } }
  .aviso { padding: 11px 14px 11px 14px; border-radius: var(--r-ctl); margin-bottom: 12px; font-size: 14px; color: var(--n-900);
    border: 1px solid transparent; border-left-width: 3px; }
  .aviso.ambar { background: var(--alerta-bg); border-color: var(--alerta-borda); border-left-color: var(--alerta); }
  .aviso.verm { background: var(--erro-bg); border-color: var(--erro-borda); border-left-color: var(--erro); }
  .aviso.azul { background: var(--marca-50); border-color: var(--marca-borda); border-left-color: var(--marca-600); }
  .aviso.verde { background: var(--ok-bg); border-color: var(--ok-borda-clara); border-left-color: var(--ok); }

  /* entrada */
  .login { min-height: 100vh; display: grid; grid-template-columns: minmax(360px, 44%) 1fr; background: #fff; }
  .login-marca { position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
    gap: 40px; padding: 40px 48px; color: #fff; text-align: left; background: var(--grad-destaque); }
  .login-marca::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--grad-mira); }
  .login-reticula { position: absolute; right: -260px; top: 50%; width: 820px; height: 820px; transform: translateY(-50%);
    opacity: .1; pointer-events: none; }
  .login-id { position: relative; max-width: 520px; margin: auto 0; }
  .login-emblema { position: relative; display: block; width: 150px; height: auto; }
  .login-frase { color: #fff; font-size: 46px; line-height: 1.08; letter-spacing: -1px; font-weight: 700; margin: 0; }
  .login-frase em { font-style: normal; color: var(--verde-marca); }
  .login-tag { margin: 18px 0 0; max-width: 420px; font-size: 16px; line-height: 1.5; color: rgba(255, 255, 255, .8); }
  .login-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--marca-700);
    background: var(--marca-100); border-radius: 999px; padding: 4px 12px 4px 8px; margin-bottom: 14px; }
  .login-chip .ic { width: 16px; height: 16px; }
  .login-form { display: flex; flex-direction: column; align-items: center; padding: 48px 32px 24px; }
  .login-caixa { width: 100%; max-width: 360px; margin: auto 0; }
  .login-caixa h1 { font-size: 32px; margin: 0 0 6px; letter-spacing: -.5px; }
  .login-sub { color: var(--n-500); margin: 0 0 28px; font-size: 14.5px; }
  .login-form .credito { margin-top: 32px; text-align: center; }
  .btn.grande { width: 100%; justify-content: center; min-height: 44px; font-size: 15px; margin-top: 4px; }
  .login-ajuda { text-align: center; margin: 14px 0 0; }
  .login-sep { display: flex; align-items: center; gap: 12px; margin: 28px 0 14px; color: var(--n-500); font-size: 13.5px; }
  .login-sep::before, .login-sep::after { content: ""; flex: 1; height: 1px; background: var(--n-200); }
  .voltar { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0; margin: 0 0 20px;
    color: var(--marca-600); font-weight: 600; font-size: 14px; cursor: pointer; }
  .voltar::before { content: ""; width: 7px; height: 7px; border-left: 2px solid currentColor; border-bottom: 2px solid currentColor; transform: rotate(45deg); }
  label.campo > span i { font-style: normal; font-weight: 400; color: var(--n-500); }
  details.resp { margin: 0 0 18px; }
  details.resp summary { cursor: pointer; color: var(--marca-600); font-weight: 600; font-size: 14px; margin-bottom: 12px; }
  .isca { position: absolute !important; left: -9999px; width: 1px; height: 1px; opacity: 0; }
  @media (max-width: 860px) {
    .login { grid-template-columns: 1fr; }
    .login-marca { padding: 24px 20px 30px; gap: 22px; }
    .login-reticula { width: 520px; height: 520px; right: -220px; }
    .login-emblema { width: 124px; }
    .login-frase { font-size: 30px; }
    .login-tag { font-size: 14px; margin-top: 10px; }
    .login-form { padding: 28px 20px 24px; }
    .login-caixa { margin: 0; }
    .login-caixa h1 { font-size: 26px; }
  }

  /* pedidos de acesso */
  .pedidos-cab { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .pedidos-cab h2 { margin: 0; display: flex; align-items: center; gap: 8px; }
  .pedidos input[type=checkbox] { width: 18px; height: 18px; }

  /* minha conta › sobre */
  .sobre { display: flex; gap: 16px; align-items: center; }
  .perfil-foto { display: flex; gap: 16px; align-items: center; margin-bottom: 16px; }
  .foto-acoes { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .foto-acoes .btn { cursor: pointer; }
  label.btn.ocupado { opacity: .5; pointer-events: none; }
  .dado { font-size: 14px; padding: 8px 0; border-top: 1px solid var(--n-200); }
  .dado span { display: block; font-size: 12px; color: var(--n-500); }
  .aviso-senha { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .aviso-senha > div:first-child { flex: 1; min-width: min(220px, 100%); }
  .aviso-senha .acoes { display: flex; gap: 6px; }
  .sobre img { width: 120px; height: auto; flex: none; }


  /* ---------- destaque (cartão roxo em degradê) e próximo passo ---------- */
  .destaque { position: relative; overflow: hidden; color: #fff; background: var(--grad-destaque); border-radius: var(--r-jan);
    padding: 26px 28px; margin-bottom: 16px; box-shadow: 0 18px 40px -18px rgba(46, 18, 72, .6); }
  .destaque::after { content: ""; position: absolute; right: -90px; top: -90px; width: 320px; height: 320px; border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, .1); box-shadow: 0 0 0 60px rgba(255, 255, 255, .03), 0 0 0 61.5px rgba(255, 255, 255, .08); pointer-events: none; }
  .destaque > * { position: relative; z-index: 1; }
  .destaque h2, .destaque h3 { color: #fff; }
  .destaque .mut, .destaque p { color: rgba(255, 255, 255, .78); }
  .destaque .rot { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 10px;
    border-radius: 999px; background: rgba(255, 255, 255, .14); color: #fff; margin-bottom: 8px; }
  .destaque .rot .ic { width: 14px; height: 14px; color: var(--verde-marca); }
  .destaque-pend { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .destaque-pend .grande { font-size: 64px; font-weight: 700; line-height: 1; color: var(--verde-marca); font-variant-numeric: tabular-nums; }
  .destaque-pend .grande .ic { width: 56px; height: 56px; color: var(--verde-marca); display: block; }
  .destaque-pend .t { flex: 1; min-width: min(220px, 100%); }
  .destaque-pend h2 { font-size: 24px; margin: 0 0 4px; }
  .destaque-pend p { margin: 0; font-size: 14.5px; }
  .destaque .btn { box-shadow: none; }
    border-radius: 999px; padding: 7px 14px 7px 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; }
  /* nota no anel + números (cartão de destaque do relatório e do painel do aluno) */
  .nota-destaque { display: flex; align-items: center; gap: 26px; flex-wrap: wrap; }
  .anel-d { width: 150px; height: 150px; border-radius: 50%; flex: none; display: grid; place-items: center; }
  .anel-d > div { width: 122px; height: 122px; border-radius: 50%; background: var(--marca-950); display: grid; place-items: center; text-align: center; }
  .anel-d b { display: block; font-size: 44px; line-height: 1; color: #fff; font-variant-numeric: tabular-nums; }
  .anel-d small { color: rgba(255, 255, 255, .75); font-size: 12.5px; }
  .nota-destaque .lado { flex: 1; min-width: min(240px, 100%); }
  .numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  .numeros > div:last-child:nth-child(odd) { grid-column: 1 / -1; } /* número ímpar de caixas: a última ocupa a linha toda, sem buraco */
  @media (min-width: 821px) { .numeros > div:last-child:nth-child(odd) { grid-column: auto; } }
  .numeros > div { background: rgba(255, 255, 255, .09); border: 1px solid rgba(255, 255, 255, .12); border-radius: 16px; padding: 12px 14px; }
  .numeros .ic { width: 20px; height: 20px; color: var(--verde-marca); display: block; margin-bottom: 6px; }
  .numeros b { display: block; font-size: 24px; line-height: 1.15; color: #fff; }
  .numeros span { font-size: 12.5px; color: rgba(255, 255, 255, .75); }
  .destaque .q-meta { margin-top: 12px; display: flex; gap: 6px; flex-wrap: wrap; }
  .destaque .tag { background: rgba(255, 255, 255, .92); }
  .proximo { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--marca-50); border: 1px dashed var(--marca-tracejado);
    border-radius: var(--r-card); padding: 18px 20px; margin-bottom: 16px; }
  .proximo .chip { width: 44px; height: 44px; border-radius: 14px; background: var(--marca-100); display: grid; place-items: center; flex: none; }
  .proximo .chip .ic { width: 22px; height: 22px; }
  .proximo .t { flex: 1; min-width: min(200px, 100%); }
  .proximo b { display: block; font-size: 16px; color: var(--marca-700); }
  .proximo span { color: var(--n-500); font-size: 14px; }
  @media (max-width: 600px) {
    .destaque { padding: 22px 20px; border-radius: var(--r-card); }
    .nota-destaque { justify-content: center; }
    .destaque-pend .grande { font-size: 52px; }
  }

  @media print {
    .topo, nav.menu, .nao-imprimir, #toast { display: none !important; }
    main { padding: 0; max-width: none; }
    body { background: #fff; }
    .card { break-inside: avoid; }
  }
</style>

(function () {
  var URL_API = "https://jgchyaoeqzcarqivfusu.supabase.co/functions/v1/api";
  window.MIRA_SUPABASE = true;
  function chamada(fn, args, ok, falha) {
    fetch(URL_API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j.ok) { if (ok) ok(j.r); } else if (falha) falha(new Error(j.erro)); },
        function () { if (falha) falha(new Error('Sem conexão com o servidor do MIRA. Confira a internet e tente de novo.')); });
  }
  function Executor(ok, falha) { this.ok = ok; this.falha = falha; }
  Executor.prototype.withSuccessHandler = function (f) { return new Executor(f, this.falha); };
  Executor.prototype.withFailureHandler = function (f) { return new Executor(this.ok, f); };
  ['api', 'login', 'logout', 'pedirAcesso'].forEach(function (n) {
    Executor.prototype[n] = function () { chamada(n, Array.prototype.slice.call(arguments), this.ok, this.falha); };
  });
  window.google = { script: { run: new Executor(null, null) } };
})();

  <script>
/* =====================================================================
   MIRA — Leitura óptica do cartão-resposta no próprio aparelho (sem custo)
   1. encontra os 4 quadrados pretos dos cantos (e a marca de orientação);
   2. calcula a perspectiva da foto (homografia) a partir deles;
   3. mede, em cada bolha, o quanto o miolo está mais escuro que o papel em volta.
   A geometria (em mm) vem do servidor: a mesma usada para imprimir o cartão.
   ===================================================================== */
var OMR = (function () {
  var LIMIAR_MARCA = 0.30;   // miolo pelo menos 30% mais escuro que o entorno = marcada
  var LIMIAR_DUVIDA = 0.17;  // entre 17% e 30% = marca fraca, pede conferência

  function carregar(fonte) {
    return new Promise(function (ok, falha) {
      var img = new Image();
      img.onload = function () { ok(img); };
      img.onerror = function () { falha(new Error('Não foi possível abrir a foto.')); };
      img.src = typeof fonte === 'string' ? fonte : URL.createObjectURL(fonte);
    });
  }

  function cinza(img, maxLado) {
    var f = Math.min(1, maxLado / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
    var w = Math.round((img.naturalWidth || img.width) * f), h = Math.round((img.naturalHeight || img.height) * f);
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
    var d = ctx.getImageData(0, 0, w, h).data, g = new Float32Array(w * h);
    for (var i = 0, j = 0; i < g.length; i++, j += 4) g[i] = 0.299 * d[j] + 0.587 * d[j + 1] + 0.114 * d[j + 2];
    return { w: w, h: h, g: g, canvas: c };
  }

  /** escuro = mais escuro que a média da vizinhança (resiste a sombra e luz desigual) */
  function binarizar(G, janela, k) {
    var w = G.w, h = G.h, W = w + 1, I = new Float64Array(W * (h + 1));
    for (var y = 0; y < h; y++) {
      var s = 0;
      for (var x = 0; x < w; x++) { s += G.g[y * w + x]; I[(y + 1) * W + x + 1] = I[y * W + x + 1] + s; }
    }
    var r = janela >> 1, b = new Uint8Array(w * h);
    for (y = 0; y < h; y++) {
      var y0 = Math.max(0, y - r), y1 = Math.min(h, y + r + 1);
      for (x = 0; x < w; x++) {
        var x0 = Math.max(0, x - r), x1 = Math.min(w, x + r + 1);
        var soma = I[y1 * W + x1] - I[y0 * W + x1] - I[y1 * W + x0] + I[y0 * W + x0];
        var media = soma / ((x1 - x0) * (y1 - y0));
        b[y * w + x] = G.g[y * w + x] < media * k ? 1 : 0;
      }
    }
    return b;
  }

  function componentes(b, w, h) {
    var rot = new Int32Array(w * h), lista = [], pilha = [];
    for (var i = 0; i < b.length; i++) {
      if (!b[i] || rot[i]) continue;
      var c = { area: 0, minx: w, maxx: 0, miny: h, maxy: 0, sx: 0, sy: 0 };
      rot[i] = lista.length + 1; pilha.push(i);
      while (pilha.length) {
        var p = pilha.pop(), x = p % w, y = (p - x) / w;
        c.area++; c.sx += x; c.sy += y;
        if (x < c.minx) c.minx = x; if (x > c.maxx) c.maxx = x;
        if (y < c.miny) c.miny = y; if (y > c.maxy) c.maxy = y;
        var viz = [x > 0 ? p - 1 : -1, x < w - 1 ? p + 1 : -1, y > 0 ? p - w : -1, y < h - 1 ? p + w : -1];
        for (var v = 0; v < 4; v++) {
          var q = viz[v];
          if (q >= 0 && b[q] && !rot[q]) { rot[q] = rot[i]; pilha.push(q); }
        }
      }
      c.cx = c.sx / c.area; c.cy = c.sy / c.area;
      c.bw = c.maxx - c.minx + 1; c.bh = c.maxy - c.miny + 1;
      lista.push(c);
    }
    return lista;
  }

  /** Homografia de 4 pontos (cartão em mm → foto em px) */
  function homografia(src, dst) {
    var A = [], B = [];
    for (var i = 0; i < 4; i++) {
      var x = src[i][0], y = src[i][1], u = dst[i][0], v = dst[i][1];
      A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); B.push(u);
      A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); B.push(v);
    }
    for (var c = 0; c < 8; c++) {
      var piv = c;
      for (var r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[piv][c])) piv = r;
      var t = A[c]; A[c] = A[piv]; A[piv] = t; t = B[c]; B[c] = B[piv]; B[piv] = t;
      if (Math.abs(A[c][c]) < 1e-12) return null;
      for (r = 0; r < 8; r++) {
        if (r === c) continue;
        var f = A[r][c] / A[c][c];
        for (var k = c; k < 8; k++) A[r][k] -= f * A[c][k];
        B[r] -= f * B[c];
      }
    }
    var h = []; for (i = 0; i < 8; i++) h.push(B[i] / A[i][i]);
    h.push(1);
    return h;
  }
  function ponto(H, x, y) {
    var d = H[6] * x + H[7] * y + H[8];
    return [(H[0] * x + H[1] * y + H[2]) / d, (H[3] * x + H[4] * y + H[5]) / d];
  }
  function dist(a, b) { return Math.sqrt((a[0] - b[0]) * (a[0] - b[0]) + (a[1] - b[1]) * (a[1] - b[1])); }

  /** média de cinza num anel (r0 = 0 → disco) */
  function media(G, cx, cy, r0, r1) {
    var s = 0, n = 0, R = Math.ceil(r1);
    for (var dy = -R; dy <= R; dy++) {
      var y = Math.round(cy + dy); if (y < 0 || y >= G.h) continue;
      for (var dx = -R; dx <= R; dx++) {
        var d2 = dx * dx + dy * dy;
        if (d2 > r1 * r1 || d2 < r0 * r0) continue;
        var x = Math.round(cx + dx); if (x < 0 || x >= G.w) continue;
        s += G.g[y * G.w + x]; n++;
      }
    }
    return n ? s / n : 255;
  }

  function acharMarcadores(S, L) {
    var minDim = Math.min(S.w, S.h);
    var bin = binarizar(S, Math.round(minDim / 7) | 1, 0.72);
    var cand = componentes(bin, S.w, S.h).filter(function (c) {
      var lado = Math.max(c.bw, c.bh), asp = c.bw / c.bh;
      return lado >= minDim * 0.008 && lado <= minDim * 0.13 && asp > 0.6 && asp < 1.65 && c.area / (c.bw * c.bh) > 0.6;
    }).sort(function (a, b) { return b.area - a.area; }).slice(0, 16);
    if (cand.length < 4) return null;

    var M = L.marcadores, esperado = (M[1][0] - M[0][0]) / (M[3][1] - M[0][1]);
    var lista = [];
    for (var a = 0; a < cand.length; a++) for (var b = a + 1; b < cand.length; b++)
      for (var c = b + 1; c < cand.length; c++) for (var d = c + 1; d < cand.length; d++) {
        var g = [cand[a], cand[b], cand[c], cand[d]];
        var areas = g.map(function (x) { return x.area; });
        if (Math.max.apply(null, areas) / Math.min.apply(null, areas) > 3) continue;
        var mx = (g[0].cx + g[1].cx + g[2].cx + g[3].cx) / 4, my = (g[0].cy + g[1].cy + g[2].cy + g[3].cy) / 4;
        g.sort(function (p, q) { return Math.atan2(p.cy - my, p.cx - mx) - Math.atan2(q.cy - my, q.cx - mx); });
        var pts = g.map(function (x) { return [x.cx, x.cy]; });
        // área do quadrilátero (fórmula do laço)
        var area = 0; for (var i = 0; i < 4; i++) { var p1 = pts[i], p2 = pts[(i + 1) % 4]; area += p1[0] * p2[1] - p2[0] * p1[1]; }
        if (Math.abs(area) / 2 < 0.04 * S.w * S.h) continue;
        for (var rot = 0; rot < 4; rot++) {
          var q = [pts[rot % 4], pts[(rot + 1) % 4], pts[(rot + 2) % 4], pts[(rot + 3) % 4]];
          var topo = dist(q[0], q[1]), dir = dist(q[1], q[2]), base = dist(q[2], q[3]), esq = dist(q[3], q[0]);
          var razao = (topo + base) / (esq + dir), erro = Math.abs(razao / esperado - 1);
          if (erro > 0.3 || Math.abs(topo / base - 1) > 0.45 || Math.abs(esq / dir - 1) > 0.45) continue;
          var H = homografia(M, q); if (!H) continue;
          // cada marcador precisa ter o tamanho esperado de um quadrado de 8 mm naquele ponto da foto
          // (descarta bolhas preenchidas e manchas que caem por acaso na posição de um canto)
          var gq = [g[rot % 4], g[(rot + 1) % 4], g[(rot + 2) % 4], g[(rot + 3) % 4]], erroTam = 0, tamOk = true;
          for (var z = 0; z < 4; z++) {
            var esperadoPx = dist(ponto(H, M[z][0] - L.lado / 2, M[z][1]), ponto(H, M[z][0] + L.lado / 2, M[z][1]));
            var lido = Math.sqrt(gq[z].area);
            var rz = lido / esperadoPx;
            if (rz < 0.6 || rz > 1.5) { tamOk = false; break; }
            erroTam += Math.abs(rz - 1);
          }
          if (!tamOk) continue;
          var esc = dist(ponto(H, 0, 0), ponto(H, 1, 0));
          var o = ponto(H, L.orientacao[0], L.orientacao[1]), ref = ponto(H, L.orientacao[0], 9);
          var escOri = 1 - media(S, o[0], o[1], 0, esc * 1.3) / Math.max(1, media(S, ref[0], ref[1], 0, esc * 1.3));
          var nota = erro + erroTam / 4 - (escOri > 0.3 ? 1 : 0);
          lista.push({ nota: nota, q: q, orientado: escOri > 0.3 });
        }
      }
    return lista.sort(function (x, y) { return x.nota - y.nota; }).slice(0, 6);
  }

  /**
   * Confere o enquadramento: com a perspectiva certa, o contorno impresso de cada bolha
   * fica mais escuro que o papel logo em volta. Devolve a fração de bolhas que batem (0 a 1).
   */
  function alinhamento(T, H, L) {
    var ok = 0, n = 0;
    for (var i = 0; i < L.bolhas.length; i += 2) {
      var b = L.bolhas[i], c = ponto(H, b.x, b.y), rp = dist(c, ponto(H, b.x + L.raio, b.y));
      var contorno = media(T, c[0], c[1], rp * 0.85, rp * 1.12), volta = media(T, c[0], c[1], rp * 1.35, rp * 1.75);
      n++; if (contorno < volta * 0.93) ok++;
    }
    return n ? ok / n : 0;
  }

  /** Lê o cartão. fonte: File, Blob ou URL de imagem. L: layout do servidor. */
  function ler(fonte, L) {
    return carregar(fonte).then(function (img) {
      var T = cinza(img, 1700);         // imagem de trabalho (leitura das bolhas)
      var S = cinza(img, 1100);         // imagem pequena (busca dos marcadores)
      var f = T.w / S.w, m = null, H = null, melhorAl = 0;
      acharMarcadores(S, L).forEach(function (cand) {
        var Hc = homografia(L.marcadores, cand.q.map(function (p) { return [p[0] * f, p[1] * f]; }));
        var al = Hc ? alinhamento(T, Hc, L) : 0;
        if (al > melhorAl) { melhorAl = al; m = cand; H = Hc; }
      });
      if (!m || melhorAl < 0.6) return { ok: false, alinhamento: melhorAl, erro: 'Não consegui enquadrar o cartão com segurança. Fotografe o cartão inteiro, de cima, com boa luz, sem sombra forte e com os quatro quadrados pretos visíveis.' };

      var porQ = {};
      L.bolhas.forEach(function (b) {
        var c = ponto(H, b.x, b.y), rp = dist(c, ponto(H, b.x + L.raio, b.y));
        var miolo = media(T, c[0], c[1], 0, rp * 0.55), volta = media(T, c[0], c[1], rp * 1.35, rp * 1.75);
        var v = 1 - miolo / Math.max(volta, 1);
        (porQ[b.n] = porQ[b.n] || []).push({ l: b.l, v: v, c: c, r: rp });
      });

      var respostas = {}, duvidas = [];
      Object.keys(porQ).forEach(function (n) {
        var bs = porQ[n].slice().sort(function (a, b) { return b.v - a.v; });
        var v1 = bs[0].v, v2 = bs[1] ? bs[1].v : 0, r = '', duv = false;
        if (v1 < LIMIAR_DUVIDA) r = '';
        else if (v1 < LIMIAR_MARCA) { r = ''; duv = true; }
        else if (v2 >= LIMIAR_MARCA) { r = v2 > 0.6 * v1 ? 'X' : bs[0].l; duv = true; }
        else { r = bs[0].l; duv = v2 >= LIMIAR_DUVIDA; }
        respostas[n] = r;
        if (duv) duvidas.push(+n);
      });

      // imagem de conferência: o que foi lido, desenhado sobre a foto
      var fv = Math.min(1, 900 / T.w), cv = document.createElement('canvas');
      cv.width = Math.round(T.w * fv); cv.height = Math.round(T.h * fv);
      var ctx = cv.getContext('2d');
      ctx.drawImage(T.canvas, 0, 0, cv.width, cv.height);
      ctx.strokeStyle = '#2f6fd6'; ctx.lineWidth = 2; ctx.beginPath();
      m.q.forEach(function (p, i) { var x = p[0] * f * fv, y = p[1] * f * fv; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.closePath(); ctx.stroke();
      Object.keys(porQ).forEach(function (n) {
        porQ[n].forEach(function (b) {
          var x = b.c[0] * fv, y = b.c[1] * fv, r = b.r * fv * 1.25;
          if (respostas[n] === b.l || (respostas[n] === 'X' && b.v >= LIMIAR_MARCA)) {
            ctx.fillStyle = respostas[n] === 'X' ? 'rgba(224,36,47,.45)' : 'rgba(31,122,77,.5)';
            ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
          }
          if (duvidas.indexOf(+n) >= 0 && b.v >= LIMIAR_DUVIDA) {
            ctx.strokeStyle = '#e09b00'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x, y, r + 2, 0, 7); ctx.stroke();
          }
        });
      });
      return {
        ok: true, alinhamento: melhorAl, respostas: respostas, duvidas: duvidas.sort(function (a, b) { return a - b; }),
        orientado: m.orientado, conferencia: cv.toDataURL('image/jpeg', 0.8)
      };
    });
  }

  return { ler: ler, _homografia: homografia, _ponto: ponto };
})();

  <script>
/* =====================================================================
