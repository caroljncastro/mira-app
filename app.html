      if (VIEWS.questoes.recarregar) VIEWS.questoes.recarregar();
    }).catch(function () {});
  };
}

function verQuestao(q, aoMudar) {
  var adm = S.user.perfil === 'ADM';
  var autor = S.user.id === q.autorId;
  var c = conc(q.concurso);
  var cur = q.curadoria;
  var ad = cur && cur.adaptacao && !cur.adaptacao.aplicada ? cur.adaptacao : null; // adaptação proposta, ainda não aplicada
  var adFeita = cur && cur.adaptacao && cur.adaptacao.aplicada ? cur.adaptacao : null;
  var gabVersao = ad ? ad.gabarito : (q.gabaritoFinal || (cur && cur.gabarito) || '');
  var analisar = cur && ['ANALISE_PROF', 'CURADA', 'REVISAR'].indexOf(q.status) >= 0 && (autor || adm);
  var nFig = String(q.imagemId || '').split(',').filter(function (x) { return x.trim(); }).length;

  var h = topoModal((cur ? 'Relatório de curadoria · ' : 'Questão ') + q.id) +
    '<div class="q-meta">' + tag(STATUS_Q, q.status) + '<span class="tag azul">' + esc(q.disciplina) + '</span>' +
    (q.conteudo ? '<span class="tag">' + esc(q.conteudo) + '</span>' : '') +
    (q.habilidade ? '<span class="tag">' + esc(q.habilidade) + '</span>' : '') +
    (cur && cur.dificuldade ? '<span class="tag">' + esc(cur.dificuldade) + '</span>' : '') +
    '<span class="mut peq" style="margin-left:auto">' + esc(q.autorNome) + '</span></div>' +
    (gabVersao || q.gabaritoProfessor ? '<div class="gab-badge">Gabarito: <b>' + esc(gabVersao || q.gabaritoProfessor) + '</b>' +
      (ad ? ' <span>(na versão adaptada)</span>' : !q.gabaritoFinal ? ' <span>(indicado pelo professor)</span>' : '') + '</div>' : '');
  if (q.status === 'DEVOLVIDA' && q.observacaoAdm) h += '<div class="aviso verm"><b>Devolvida pela coordenação:</b> ' + esc(q.observacaoAdm) + '</div>';
  if (q.status === 'AJUSTE' && cur && cur.parecer) h += '<div class="aviso ambar"><b>Ajuste pedido por ' + esc(cur.parecer.por) + ' (' + dataBr(cur.parecer.em) + '):</b> ' +
    esc(cur.parecer.comentario) + '<br><span class="peq">A questão volta para a próxima curadoria, que vai atender ao pedido.</span></div>';
  if (q.status === 'VALIDADA' && cur && cur.parecer) h += '<div class="aviso verde"><b>Validada por ' + esc(cur.parecer.por) + '</b> em ' + dataBr(cur.parecer.em) +
    (adm ? '. Falta a aprovação da coordenação para entrar nos simulados.' : '. Aguardando a aprovação da coordenação.') + '</div>';
  if (analisar && autor) h += '<div class="aviso azul"><b>Sua análise é necessária.</b> Leia a curadoria abaixo e, no fim da página, ' +
    'clique em <b>De acordo</b> ou escreva o que deve ser alterado.</div>';
  if (cur && cur.pedidoAtendido) h += '<div class="aviso azul peq"><b>Esta curadoria respondeu ao pedido:</b> "' + esc(cur.pedidoAtendido.comentario) + '"</div>';

  if (!cur) {
    h += '<div id="v-enun">' + enunciadoHtml(q.enunciado, [], nFig) + '</div><div class="alts">' +
      c.alternativas.map(function (l) {
        var ok = l === q.gabaritoProfessor;
        return '<div class="' + (ok ? 'certa' : '') + '"><b>(' + l + ')</b> ' + esc(q.alternativas[l]) +
          (ok ? '<span class="alt-marca">✔ Gabarito</span>' : '') + '</div>';
      }).join('') + '</div>' +
      '<div class="aviso ambar">Esta questão ainda não passou pela curadoria.</div>';
  } else {
    // --- adaptação
    if (ad) {
      h += '<div class="card" style="border-color:var(--azul-2)"><h3 style="margin-top:0">A curadoria propôs uma adaptação</h3>' +
        '<p class="peq" style="margin-top:0">' + esc(ad.motivo) + '</p>' +
        (ad.alteracoes && ad.alteracoes.length ? '<ul class="peq" style="margin:0;padding-left:18px">' +
          ad.alteracoes.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul>' : '') +
        '<p class="mut peq" style="margin-bottom:0">Abaixo está a <b>versão adaptada</b>. As alternativas que mudaram têm uma faixa azul à esquerda. ' +
        'Ao dar <b>De acordo</b>, ela substitui a original.</p></div>';
    }
    if (adFeita) h += '<p class="mut peq">Questão adaptada pela curadoria' + (adFeita.aplicadaEm ? ' em ' + dataBr(adFeita.aplicadaEm) : '') + '.</p>';

    // --- gabarito
    h += cur.concordaComProfessor
      ? '<div class="aviso verde peq">A curadoria confirmou o gabarito do professor' + (ad ? ' na versão original (<b>' + esc(cur.gabarito) + '</b>). Na versão adaptada, a correta é a <b>' + esc(ad.gabarito) + '</b>.' : ' (<b>' + esc(gabVersao) + '</b>).') + '</div>'
      : '<div class="aviso verm"><b>Atenção ao gabarito:</b> a curadoria encontrou <b>' + esc(cur.gabarito) + '</b>, diferente do indicado pelo professor (<b>' + esc(q.gabaritoProfessor) + '</b>). Confira a resolução.</div>';
    if (cur.alertas && cur.alertas.length) h += '<div class="aviso ambar"><b>Alertas da curadoria:</b><ul style="margin:4px 0 0;padding-left:18px">' +
      cur.alertas.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul></div>';

    // --- enunciado + alternativas com o diagnóstico ao lado
    var alts = ad ? ad.alternativas : q.alternativas;
    var textoVersao = ad && ad.enunciado ? ad.enunciado : q.enunciado;
    h += '<div id="v-enun">' + enunciadoHtml(textoVersao, [], nFig) + '</div>';
    h += '<h3 style="margin:14px 0 2px">Alternativas e o que cada erro revela</h3>' +
      '<p class="mut peq" style="margin-top:0">Ao lado de cada alternativa errada: por que o aluno a escolhe e qual deficiência isso mostra.</p>';
    h += c.alternativas.map(function (l) {
      var mudou = ad && ad.alternativas[l] !== q.alternativas[l];
      var certa = l === gabVersao;
      var d = (cur.distratores || {})[l];
      var esq = '<div class="d-alt"><b>(' + l + ')</b> ' + esc(alts[l]) +
        (mudou ? '<div class="antes">Antes: ' + esc(q.alternativas[l]) + '</div>' : '') + '</div>';
      var dir;
      if (certa) dir = '<div class="d-exp">✔ Alternativa correta</div>';
      else if (!d) dir = '<div class="d-exp mut">Sem diagnóstico.</div>';
      else if (adm) dir = '<div class="d-exp" data-l="' + l + '">' +
        '<label class="peq"><b>Deficiência</b> (rótulo curto)' + (d.plausivel === false ? ' <span class="tag ambar">fraca</span>' : '') +
        '<input type="text" class="d-conc" value="' + esc(d.conceito) + '"></label>' +
        '<label class="peq"><b>Por que o aluno erra</b><textarea class="d-erro" rows="3">' + esc(d.erro) + '</textarea></label>' +
        '<label class="peq"><b>O que estudar</b><textarea class="d-rec" rows="2">' + esc(d.recomendacao) + '</textarea></label></div>';
      else dir = '<div class="d-exp"><span class="rot">' + esc(d.conceito) + '</span>' +
        (d.plausivel === false ? ' <span class="tag ambar">distrator fraco</span>' : '') +
        '<p><b>Por que o aluno erra:</b> ' + esc(d.erro) + '</p>' +
        (d.recomendacao ? '<p><b>O que estudar:</b> ' + esc(d.recomendacao) + '</p>' : '') + '</div>';
      return '<div class="diag' + (certa ? ' certa' : '') + (mudou ? ' mudou' : '') + '">' + esq + dir + '</div>';
    }).join('');

    var orig = ad ? { enunciado: q.enunciado, alternativas: q.alternativas, gab: q.gabaritoProfessor }
      : adFeita && adFeita.original ? { enunciado: adFeita.original.enunciado, alternativas: adFeita.original.alternativas, gab: adFeita.original.gabaritoProfessor } : null;
    if (orig) h += '<details class="orig"><summary>Ver a versão original do professor</summary><div class="card" style="margin-top:8px">' +
      '<div class="enun peq">' + esc(semFiguras(orig.enunciado)) + '</div><div class="alts peq">' +
      c.alternativas.map(function (l) { return '<div class="' + (l === orig.gab ? 'prof' : '') + '"><b>(' + l + ')</b> ' + esc(orig.alternativas[l]) + '</div>'; }).join('') +
      '</div><p class="mut peq" style="margin-bottom:0">Faixa amarela: gabarito do professor (' + esc(orig.gab || '—') + ')</p></div></details>';

    h += '<div class="card" style="margin-top:12px"><h3>Resolução comentada</h3><div class="enun peq">' + esc(cur.resolucao) + '</div>' +
      (cur.aderencia ? '<p class="mut peq" style="margin-bottom:0"><b>Aderência à banca:</b> ' + esc(cur.aderencia) + '</p>' : '') + '</div>';
  }

  // --- parecer do professor
  if (analisar) {
    h += '<div class="card parecer"><h3 style="margin-top:0">' + (autor ? 'Sua análise' : 'Análise do professor (' + esc(q.autorNome) + ')') + '</h3>' +
      (!autor ? '<p class="mut peq" style="margin-top:0">Como coordenação, você pode registrar a análise no lugar do professor.</p>' : '') +
      '<p class="peq" style="margin-top:0">Concorda com ' + (ad ? 'a adaptação, ' : '') + 'o gabarito e os diagnósticos? Se sim, clique em <b>De acordo</b>' +
      (ad ? ' e a versão adaptada passa a valer' : '') + '. Se algo precisa mudar, descreva abaixo: o pedido vai para a próxima curadoria.</p>' +
      '<label class="campo"><span>O que deve ser alterado (só se não estiver de acordo)</span>' +
      '<textarea id="p-com" rows="3" placeholder="Ex.: na alternativa D, prefiro um erro de sinal no calor do gelo; manter o valor 20 °C."></textarea></label>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end">' +
      '<button class="btn" id="p-aj">Pedir alteração</button><button class="btn ok" id="p-ok">De acordo</button></div></div>';
  }

  // --- decisão da coordenação
  if (adm) {
    h += '<div class="card" style="margin-top:16px;background:var(--bg)"><h3>Decisão da coordenação</h3>' +
      (ad ? '<p class="peq mut" style="margin-top:0">Aprovar agora aplica a versão adaptada, mesmo sem a análise do professor.</p>' : '') +
      '<div class="linha"><label class="campo"><span>Gabarito final</span><select id="v-gab">' +
      c.alternativas.map(function (l) { return '<option' + (l === gabVersao ? ' selected' : '') + '>' + l + '</option>'; }).join('') + '</select></label>' +
      '<label class="campo" style="flex:3"><span>Observação ao professor (para devolução)</span><input type="text" id="v-obs" value="' + esc(q.observacaoAdm) + '"></label></div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="v-curar">' + (cur ? 'Refazer curadoria automática' : 'Fazer curadoria automática') + '</button>' +
      '<button class="btn perigo" id="v-dev">Devolver ao professor</button>' +
      '<button class="btn ok" id="v-apr" style="margin-left:auto">Aprovar para simulados</button></div></div>';
  } else if (q.status !== 'APROVADA') {
    h += '<div style="display:flex;justify-content:flex-end;margin-top:12px"><button class="btn" id="v-edit">Editar a questão eu mesmo(a)</button></div>' +
      (cur ? '<p class="mut peq" style="text-align:right">Editar reinicia a curadoria desta questão.</p>' : '');
  }

  var md = modal(h, true);
  if (nFig) {
    call('imagemQuestao', { id: q.id }).then(function (l) {
      var urls = (l || []).map(function (f) { return f.url; });
      if ($('#v-enun', md.el)) $('#v-enun', md.el).innerHTML = enunciadoHtml(cur && cur.adaptacao && !cur.adaptacao.aplicada && cur.adaptacao.enunciado ? cur.adaptacao.enunciado : q.enunciado, urls, nFig);
    });
  }
  var depois = function (nova, msg) {
    md.fechar(); toast(msg);
    if (aoMudar) aoMudar();
    if (nova) verQuestao(nova, aoMudar);
  };
  if ($('#v-edit', md.el)) $('#v-edit', md.el).onclick = function () { md.fechar(); formQuestao(q); };
  if (analisar) {
    $('#p-ok', md.el).onclick = function () {
      if ($('#p-com', md.el).value.trim()) { toast('Você escreveu um pedido de alteração. Use "Pedir alteração" ou apague o texto.', true); return; }
      ocupado(this, 'Registrando…', function () { return call('parecerQuestao', { id: q.id, decisao: 'OK' }); })
        .then(function () { depois(null, ad ? 'De acordo registrado. A versão adaptada passou a valer.' : 'De acordo registrado.'); }).catch(function () {});
    };
    $('#p-aj', md.el).onclick = function () {
      var t = $('#p-com', md.el).value.trim();
      if (!t) { toast('Escreva o que deve ser alterado.', true); $('#p-com', md.el).focus(); return; }
      ocupado(this, 'Enviando…', function () { return call('parecerQuestao', { id: q.id, decisao: 'AJUSTE', comentario: t }); })
        .then(function () { depois(null, 'Pedido enviado. A questão volta para a próxima curadoria.'); }).catch(function () {});
    };
  }
  if (adm) {
    $('#v-curar', md.el).onclick = function () {
      ocupado(this, 'Analisando…', function () { return call('curarQuestao', { id: q.id }); })
        .then(function (n) { depois(n, 'Curadoria atualizada.'); }).catch(function () {});
    };
    var curEditada = function () {
      if (!cur) return null;
      var copia = JSON.parse(JSON.stringify(cur));
      $$('.d-exp[data-l]', md.el).forEach(function (el) {
        var l = el.getAttribute('data-l');
        copia.distratores[l].erro = $('.d-erro', el).value;
        copia.distratores[l].conceito = $('.d-conc', el).value;
        copia.distratores[l].recomendacao = $('.d-rec', el).value;
      });
      return copia;
    };
    $('#v-apr', md.el).onclick = function () {
      var d = { id: q.id, decisao: 'APROVADA', gabaritoFinal: $('#v-gab', md.el).value, curadoria: curEditada() };
      // fecha na hora; a gravação segue em segundo plano
      md.fechar();
      if (aoMudar) aoMudar({ id: q.id, status: 'APROVADA' });
      toast('Questão ' + q.id + ' aprovada.');
      call('decidirQuestao', d).catch(function (e) {
        toast('A aprovação da questão ' + q.id + ' não foi gravada: ' + msgErro(e), true);
        if (aoMudar) aoMudar(null);
      });
    };
    $('#v-dev', md.el).onclick = function () {
      var obs = $('#v-obs', md.el).value.trim();
      if (!obs) { toast('Escreva uma observação para o professor.', true); return; }
      ocupado(this, 'Devolvendo…', function () { return call('decidirQuestao', { id: q.id, decisao: 'DEVOLVIDA', observacao: obs }); })
        .then(function () { depois(null, 'Questão devolvida ao professor.'); }).catch(function () {});
    };
  }
}

// ---------------------------------------------------------------- simulados
VIEWS.simulados = function (m) {
  var adm = S.user.perfil === 'ADM';
  m.innerHTML = cabPag('Simulados', 'Provas no padrão EsPCEx, com caderno, cartão-resposta e gabarito comentado',
    adm ? '<button class="btn pri" id="novo">+ Novo simulado</button>' : '') + '<div id="lista"></div>';
  if (adm) $('#novo').onclick = function () { formSimulado(carregar); };
  var carregar = function () {
    var l = $('#lista'); carregando(l);
    call('listarSimulados').then(function (ss) {
      if (!ss.length) { l.innerHTML = '<div class="card vazio">' + icone('simulados', 'ic-vazio') + 'Nenhum simulado criado ainda.' + (adm ? ' Aprove questões no banco e clique em "Novo simulado".' : '') + '</div>'; return; }
      l.innerHTML = ss.map(function (s, i) {
        return '<div class="card"><div class="q-meta">' + tag(STATUS_S, s.status) +
          '<span class="meta">' + esc(s.concursoNome) + ' · ' + esc(s.provaTitulo) + ' · ' + s.total + ' questões · ' +
          (s.turmas ? 'Turmas ' + esc(s.turmas) : 'Todas as turmas') + (s.dataAplicacao ? ' · ' + dataBr(s.dataAplicacao) : '') + '</span>' +
          (adm && s.status === 'RASCUNHO' ? '<label class="tag" style="padding:0 0 0 9px">Versões <select data-a="versoes" data-i="' + i + '" class="sel-tag">' +
            [1, 2, 3, 4, 5, 6].map(function (n) { return '<option' + (n === s.versoes ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></label>'
            : s.versoes > 1 ? '<span class="tag">' + s.versoes + ' versões</span>' : '') +
          '<span class="dir">' + esc(s.codigo) + '</span></div>' +
          '<h2 style="margin:6px 0 ' + (adm && s.status === 'RASCUNHO' ? '4px' : '14px') + ';font-size:19px">' + esc(s.titulo) + '</h2>' +
          (adm && s.status === 'RASCUNHO' ? '<p class="mut peq" style="margin:0 0 12px">Em rascunho, os alunos ainda não veem este simulado. ' +
            'Mude para <b>Aberto</b> quando aplicar a prova: aí cada aluno envia a foto do cartão em <b>Meus simulados</b>.</p>' : '') +
          '<div class="sim-acoes">' +
          '<button class="btn peq" data-a="caderno" data-i="' + i + '">Caderno de prova</button>' +
          '<button class="btn peq" data-a="cartao" data-i="' + i + '">Cartão-resposta</button>' +
          '<button class="btn peq" data-a="gabarito" data-i="' + i + '">Gabarito comentado</button>' +
          '<button class="btn peq" data-a="res" data-i="' + i + '">Resultados</button>' +
          '<button class="btn peq" data-a="mapa" data-i="' + i + '">Mapa da turma</button>' +
          (adm ? '<button class="btn peq" data-a="lancar" data-i="' + i + '">Lançar cartão de aluno</button>' +
            '<select data-a="status" data-i="' + i + '" style="width:auto;margin-left:auto;padding:5px 8px">' +
            Object.keys(STATUS_S).map(function (k) { return '<option value="' + k + '"' + (k === s.status ? ' selected' : '') + '>' + STATUS_S[k][0] + '</option>'; }).join('') +
            '</select>' : '') + '</div></div>';
      }).join('');
      $$('[data-a]', l).forEach(function (b) {
        var s = ss[+b.getAttribute('data-i')], a = b.getAttribute('data-a');
        if (a === 'versoes') {
          b.onchange = function () {
            var n = Number(b.value), ja = s.versoesPorAluno ? Object.keys(s.versoesPorAluno).length : 0;
            var mudar = function () {
              call('versoesSimulado', { id: s.id, quantidade: n }).then(function () {
                toast(n > 1 ? 'Simulado com ' + n + ' versões. Gere os cartões-resposta para distribuir as versões.' : 'Simulado com uma única versão.');
                carregar();
              }).catch(function (e) { toast(msgErro(e), true); carregar(); });
            };
            if (ja && n !== s.versoes) confirmar(ja + ' aluno(s) já receberam versão nos cartões gerados. Mudar a quantidade apaga essa distribuição: será preciso gerar os cartões de novo.', 'Mudar versões').then(mudar);
            else mudar();
          };
          return;
        }
        if (a === 'status') {
          b.onchange = function () {
            call('statusSimulado', { id: s.id, status: b.value }).then(function () {
              toast(b.value === 'ABERTO' ? 'Simulado aberto: os alunos já podem enviar o cartão.' :
                b.value === 'ENCERRADO' ? 'Simulado encerrado: resoluções liberadas aos alunos.' : 'Simulado voltou a rascunho.');
              carregar();
            }).catch(function (e) { toast(msgErro(e), true); });
          };
          return;
        }
        b.onclick = function () {
          if (a === 'res') return ir('resultados', { simuladoId: s.id });
          if (a === 'mapa') return ir('turmas', { simuladoId: s.id });
          if (a === 'lancar') return escolherAluno(s);
          if (a === 'cartao' && adm) return escolherCartoes(s);
          if (a === 'caderno' && s.versoes > 1) return escolherVersao(s);
          verImpresso(s, a);
        };
      });
    }).catch(function (e) { l.innerHTML = '<div class="aviso verm">' + esc(msgErro(e)) + '</div>'; });
  };
  carregar();
};

/** Escolher qual versão do caderno imprimir */
function escolherVersao(s) {
  var md = modal(topoModal('Caderno de prova · ' + s.codigo) +
    '<p class="peq" style="margin-top:0">Este simulado tem <b>' + s.versoes + ' versões</b>. Imprima a quantidade de cada uma conforme a distribuição dos cartões.</p>' +
    '<div class="versoes">' + Array.apply(null, Array(s.versoes)).map(function (x, i) {
      var n = i + 1, qtd = s.versoesPorAluno ? Object.keys(s.versoesPorAluno).filter(function (k) { return s.versoesPorAluno[k] === n; }).length : 0;
      return '<button class="btn versao" data-v="' + n + '"><b>Versão ' + n + '</b><small>' + (qtd ? qtd + ' aluno(s) nos cartões gerados' : 'nenhum cartão gerado ainda') + '</small></button>';
    }).join('') + '</div>');
  $$('[data-v]', md.el).forEach(function (b) { b.onclick = function () { md.fechar(); verImpresso(s, 'caderno', null, +b.getAttribute('data-v')); }; });
}

/** Escolher para quais alunos gerar o cartão-resposta (ou um cartão em branco). */
function escolherCartoes(s) {
  var md = modal(topoModal('Cartões-resposta · ' + s.codigo) +
    '<p class="peq" style="margin-top:0">Selecione os alunos e gere um arquivo com <b>um cartão por aluno</b>, já com nome, matrícula e turma. ' +
    'Ou gere um cartão em branco para copiar.</p><div id="ca"><div class="carregando"><div class="giro"></div>Carregando alunos…</div></div>', true);
  call('listarUsuarios').then(function (us) {
    var turmasSim = csv(s.turmas);
    var alunos = us.filter(function (u) { return u.perfil === 'ALUNO' && u.ativo !== 'NAO'; })
      .filter(function (u) { return !turmasSim.length || turmasSim.indexOf(u.turma) >= 0; })
      .sort(function (a, b) { return (a.turma + ' ' + a.nome).localeCompare(b.turma + ' ' + b.nome, 'pt'); });
    var turmas = alunos.map(function (a) { return a.turma; }).filter(function (t, i, l) { return t && l.indexOf(t) === i; });
    var sel = {};
    alunos.forEach(function (a) { sel[a.id] = true; });
    var area = $('#ca', md.el);
    if (!alunos.length) {
      area.innerHTML = '<div class="aviso ambar">Nenhum aluno cadastrado' + (turmasSim.length ? ' nas turmas deste simulado (' + esc(s.turmas) + ')' : '') + '.</div>' +
        '<button class="btn" id="ca-branco">Gerar cartão em branco</button>';
      $('#ca-branco', md.el).onclick = function () { md.fechar(); verImpresso(s, 'cartao'); };
      return;
    }
    var desenhar = function () {
      var filtro = $('#ca-tur', md.el) ? $('#ca-tur', md.el).value : '';
      var vis = alunos.filter(function (a) { return !filtro || a.turma === filtro; });
      var n = Object.keys(sel).length;
      $('#ca-lista', md.el).innerHTML = vis.map(function (a) {
        return '<label class="aluno-sel"><input type="checkbox" data-id="' + esc(a.id) + '"' + (sel[a.id] ? ' checked' : '') + '>' +
          '<span><b>' + esc(a.nome) + '</b><small>' + esc(a.matricula || 'sem matrícula') + ' · ' + esc(a.turma || 'sem turma') + '</small></span></label>';
      }).join('');
      var todosVis = vis.every(function (a) { return sel[a.id]; });
      $('#ca-todos', md.el).checked = vis.length > 0 && todosVis;
      $('#ca-ger', md.el).disabled = !n;
      $('#ca-ger', md.el).textContent = n ? 'Gerar ' + n + ' cartão(ões)' : 'Selecione alunos';
      $$('#ca-lista input', md.el).forEach(function (c) {
        c.onchange = function () { if (c.checked) sel[c.getAttribute('data-id')] = true; else delete sel[c.getAttribute('data-id')]; desenhar(); };
      });
    };
    area.innerHTML = '<div class="linha" style="align-items:flex-end">' +
      (turmas.length > 1 ? '<label class="campo" style="margin:0"><span>Turma</span><select id="ca-tur"><option value="">Todas</option>' +
        turmas.map(function (t) { return '<option>' + esc(t) + '</option>'; }).join('') + '</select></label>' : '') +
      '<label class="peq" style="display:flex;gap:6px;align-items:center;padding-bottom:10px"><input type="checkbox" id="ca-todos"> Selecionar todos' +
      (turmas.length > 1 ? ' desta turma' : '') + '</label></div>' +
      '<div id="ca-lista" class="alunos-sel"></div>' +
      '<div style="display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:12px">' +
      '<button class="btn" id="ca-branco">Cartão em branco</button><button class="btn pri" id="ca-ger"></button></div>';
    if ($('#ca-tur', md.el)) $('#ca-tur', md.el).onchange = desenhar;
    $('#ca-todos', md.el).onchange = function () {
      var filtro = $('#ca-tur', md.el) ? $('#ca-tur', md.el).value : '', on = this.checked;
      alunos.forEach(function (a) { if (!filtro || a.turma === filtro) { if (on) sel[a.id] = true; else delete sel[a.id]; } });
      desenhar();
    };
    $('#ca-branco', md.el).onclick = function () { md.fechar(); verImpresso(s, 'cartao'); };
    $('#ca-ger', md.el).onclick = function () {
      var ids = alunos.filter(function (a) { return sel[a.id]; }).map(function (a) { return a.id; });
      md.fechar(); verImpresso(s, 'cartao', ids);
    };
    desenhar();
  }).catch(function (e) { $('#ca', md.el).innerHTML = '<div class="aviso verm">' + esc(msgErro(e)) + '</div>'; });
}

function verImpresso(s, tipo, alunos, versao) {
  var nomes = { caderno: 'Caderno de prova' + (versao ? ' · Versão ' + versao : ''), cartao: alunos && alunos.length ? 'Cartões-resposta (' + alunos.length + ' alunos)' : 'Cartão-resposta', gabarito: 'Gabarito comentado' };
  var md = modal(topoModal(nomes[tipo] + ' · ' + s.codigo) +
    '<div style="display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap"><button class="btn pri" id="imp">Imprimir</button>' +
    (tipo === 'cartao' ? '<span class="aviso azul peq" style="margin:0">Imprima em A4, escala 100%. Para PDF, escolha "Salvar como PDF" na janela de impressão.</span>'
      : window.MIRA_SUPABASE ? '<span class="aviso azul peq" style="margin:0">Para PDF, use "Imprimir" e escolha "Salvar como PDF".</span>'
        : '<button class="btn" id="pdf">Salvar PDF no Drive</button>') +
    (tipo === 'gabarito' ? '<span class="aviso ambar peq" style="margin:0">Uso exclusivo do professor. Não distribua aos alunos antes do encerramento.</span>' : '') +
    '</div><div id="area"><div class="carregando"><div class="giro"></div>Montando impresso…</div></div>', true);
  call('impresso', { id: s.id, tipo: tipo, alunos: alunos || null, versao: versao || 1 }).then(function (r) {
    var f = document.createElement('iframe');
    $('#area', md.el).innerHTML = ''; $('#area', md.el).appendChild(f);
    f.srcdoc = r.html;
    $('#imp', md.el).onclick = function () { f.contentWindow.focus(); f.contentWindow.print(); };
  }).catch(function (e) { $('#area', md.el).innerHTML = '<div class="aviso verm">' + esc(msgErro(e)) + '</div>'; });
  if ($('#pdf', md.el)) $('#pdf', md.el).onclick = function () {
    ocupado(this, 'Gerando PDF…', function () { return call('impressoPdf', { id: s.id, tipo: tipo, versao: versao || 1 }); }).then(function (r) {
      $('#area', md.el).insertAdjacentHTML('beforebegin', '<div class="aviso verde">PDF salvo no Drive: <a href="' + esc(r.url) + '" target="_blank">' + esc(r.nome) + '</a></div>');
    }).catch(function () {});
  };
}

function formSimulado(aoCriar) {
  var c = conc('ESPCEX');
  var md = modal(topoModal('Novo simulado ' + c.nome) +
    '<form id="fs"><label class="campo"><span>Título</span><input type="text" id="s-tit" placeholder="Ex.: 1º Simulado EsPCEx 2027 – 1º dia"></label>' +
    '<div class="linha"><label class="campo"><span>Dia de prova</span><select id="s-dia">' +
    c.provas.map(function (p) {
      return '<option value="' + p.dia + '">' + esc(p.titulo) + ' – ' + p.disciplinas.map(function (d) { return d[0] + ' (' + d[1] + ')'; }).join(', ') + '</option>';
    }).join('') + '</select></label></div>' +
    '<div class="linha"><label class="campo"><span>Turmas (separe por vírgula; vazio = todas)</span><input type="text" id="s-tur" placeholder="Ex.: 3A, 3B"></label>' +
    '<label class="campo"><span>Data de aplicação</span><input type="date" id="s-data"></label></div>' +
    '<div class="campo"><span class="mut peq" style="font-weight:600">Montagem</span>' +
    '<label style="display:block;margin:4px 0"><input type="radio" name="s-modo" value="auto" checked> Automática: sorteia questões aprovadas, priorizando as nunca usadas</label>' +
    '<label style="display:block;margin:4px 0"><input type="radio" name="s-modo" value="manual"> Manual: eu escolho as questões</label></div>' +
    '<div id="s-manual"></div>' +
    '<label style="display:block;margin:10px 0"><input type="checkbox" id="s-red"> Permitir simulado reduzido (menos questões que o padrão)</label>' +
    '<div class="linha" style="align-items:flex-end"><label class="campo" style="max-width:220px"><span>Versões do caderno</span><select id="s-ver">' +
    [1, 2, 3, 4, 5, 6].map(function (n) { return '<option value="' + n + '">' + (n === 1 ? '1 (todos iguais)' : n + ' versões') + '</option>'; }).join('') +
    '</select></label><p class="mut peq" style="flex:3;margin:0 0 14px">Como na EsPCEx: cada versão traz as mesmas questões em outra ordem dentro de cada disciplina. ' +
    'A versão de cada aluno é definida quando você gera os cartões-resposta.</p></div>' +
    '<div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn fechar">Cancelar</button>' +
    '<button class="btn pri" id="s-criar">Criar simulado</button></div></form>', true);

  var aprovadas = null;
  var desenharManual = function () {
    var alvo = $('#s-manual', md.el);
    if ($('input[name=s-modo]:checked', md.el).value !== 'manual') { alvo.innerHTML = ''; return; }
    var dia = $('#s-dia', md.el).value;
    var prova = c.provas.filter(function (p) { return String(p.dia) === dia; })[0];
    var montar = function () {
      alvo.innerHTML = prova.disciplinas.map(function (d) {
        var qs = aprovadas.filter(function (q) { return q.disciplina === d[0]; });
        return '<div class="card"><h3>' + esc(d[0]) + ' <span class="mut peq cont" data-d="' + esc(d[0]) + '">0/' + d[1] + '</span></h3>' +
          (qs.length ? qs.map(function (q) {
            return '<label style="display:flex;gap:8px;padding:4px 0;border-bottom:1px solid var(--borda)"><input type="checkbox" class="s-q" value="' + q.id + '" data-d="' + esc(d[0]) + '">' +
              '<span class="peq"><b>' + esc(q.id) + '</b> · ' + esc(q.conteudo) + ' — ' + esc(semFiguras(q.enunciado).slice(0, 120)) + '…</span></label>';
          }).join('') : '<p class="mut peq">Nenhuma questão aprovada.</p>') + '</div>';
      }).join('');
      $$('.s-q', alvo).forEach(function (cb) {
        cb.onchange = function () {
          var d = cb.getAttribute('data-d');
          var n = $$('.s-q:checked', alvo).filter(function (x) { return x.getAttribute('data-d') === d; }).length;
          var el = $$('.cont', alvo).filter(function (x) { return x.getAttribute('data-d') === d; })[0];
          var meta = prova.disciplinas.filter(function (x) { return x[0] === d; })[0][1];
          el.textContent = n + '/' + meta;
          el.style.color = n === meta ? 'var(--verde)' : n > meta ? 'var(--verm)' : '';
        };
      });
    };
    if (aprovadas) montar();
    else {
      carregando(alvo, 'Carregando questões aprovadas…');
      call('listarQuestoes', { status: 'APROVADA' }).then(function (qs) { aprovadas = qs; montar(); });
    }
  };
  $$('input[name=s-modo]', md.el).forEach(function (r) { r.onchange = desenharManual; });
  $('#s-dia', md.el).onchange = desenharManual;

  $('#fs', md.el).onsubmit = function (e) {
    e.preventDefault();
    var d = {
      concurso: 'ESPCEX', titulo: $('#s-tit', md.el).value, dia: $('#s-dia', md.el).value,
      turmas: csv($('#s-tur', md.el).value).join(', '), dataAplicacao: $('#s-data', md.el).value,
      modo: $('input[name=s-modo]:checked', md.el).value, permitirIncompleto: $('#s-red', md.el).checked,
      questoes: $$('.s-q:checked', md.el).map(function (x) { return x.value; }),
      versoes: Number($('#s-ver', md.el).value)
    };
    ocupado($('#s-criar', md.el), 'Montando…', function () { return call('criarSimulado', d); }).then(function (r) {

// ---------------------------------------------------------------- envio do cartão
/** Questões em que o aluno mudou a resposta lida na foto */
function ajustesLeitura(st) {
  if (!st.lido) return [];
  return Object.keys(st.respostas).filter(function (k) { return (st.respostas[k] || '') !== (st.lido[k] || ''); })
    .map(Number).sort(function (a, b) { return a - b; });
}

VIEWS.enviar = function (m, p) {
  carregando(m);
  return Promise.all([call('listarSimulados'), call('layoutCartao', { simuladoId: p.simuladoId })]).then(function (r) {
    var s = r[0].filter(function (x) { return x.id === p.simuladoId; })[0];
    var L = r[1];
    if (!s) throw new Error('Simulado não encontrado.');
    var alts = L.alternativas;
    var st = { etapa: 1, respostas: {}, lido: null, todas: false, duvidas: [], foto: null, conferencia: '', avisos: [], arquivo: null, erroLeitura: '' };
    // versão do caderno: a do cartão do aluno; se não houver, ele (ou a coordenação) informa
    var versaoFixa = S.user.perfil === 'ALUNO' ? (s.minhaVersao || 0) : 0;
    st.versao = versaoFixa || (p.alunoId && s.versoesPorAluno ? (s.versoesPorAluno[p.alunoId] || 0) : 0);
    for (var i = 1; i <= s.total; i++) st.respostas[i] = '';

    var desenhar = function () {
      var h = cabPag('Enviar cartão-resposta', esc(s.titulo) + ' · <span style="font-family:monospace">' + esc(s.codigo) + '</span>' +
        (p.alunoId ? ' · <b>lançamento pela coordenação</b>' : ''),
        '<button class="btn" id="voltar">Voltar</button>') +
        '<div class="passos"><span class="' + (st.etapa === 1 ? 'on' : '') + '">1. Foto do cartão</span>' +
        '<span class="' + (st.etapa === 2 ? 'on' : '') + '">2. Conferir respostas</span><span>3. Relatório</span></div>';

      if (st.etapa === 1) {
        h += '<div class="card"><h2>Foto do cartão-resposta</h2>' +
          '<ul class="peq" style="padding-left:18px"><li>Cartão sobre a mesa, em local bem iluminado e sem sombra forte.</li>' +
          '<li>Enquadre o cartão inteiro, com os <b>quatro quadrados pretos</b> visíveis.</li>' +
          '<li>Segure o celular reto, acima do cartão. Pode ser em pé ou deitado.</li></ul>' +
          '<div class="foto-opcoes">' +
          '<label class="btn pri"><input type="file" class="foto-in" accept="image/*" capture="environment">Tirar foto agora</label>' +
          '<label class="btn"><input type="file" class="foto-in" accept="image/*">Anexar foto da galeria</label></div>' +
          '<p class="mut peq" style="margin:8px 0 0">Já fotografou o cartão com a câmera do celular? Use <b>Anexar foto da galeria</b> e escolha a imagem.</p>' +
          '<div id="prev">' + (st.erroLeitura ? '<div class="aviso verm" style="margin-top:12px">' + esc(st.erroLeitura) + '</div>' : '') +
          (st.foto ? '<img class="foto-prev" src="' + st.foto.url + '">' : '') + '</div>' +
          (st.erroLeitura && L.iaConfigurada ? '<button class="btn" id="ia">Tentar leitura com IA</button> ' : '') +
          '<p class="peq" style="margin-top:16px"><a href="#" id="manual">Prefiro digitar minhas respostas</a></p></div>';
      } else {
        var resp = 0, branco = 0, dup = 0;
        Object.keys(st.respostas).forEach(function (k) { var v = st.respostas[k]; if (v === 'X') dup++; else if (v) resp++; else branco++; });
        h += st.avisos.map(function (a) { return '<div class="aviso ' + a[0] + '">' + a[1] + '</div>'; }).join('');
        if (st.conferencia) h += '<details class="card"><summary style="cursor:pointer;font-weight:600">Ver a leitura sobre a foto</summary>' +
          '<p class="mut peq">Verde: marcação lida · Vermelho: dupla marcação · Laranja: conferir</p><img class="foto-prev" src="' + st.conferencia + '"></details>';
        h += '<div class="card"><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px">' +
          '<h2 style="flex:1">Confira suas respostas</h2><span class="tag verde">' + resp + ' marcadas</span>' +
          '<span class="tag ambar">' + branco + ' em branco</span>' + (dup ? '<span class="tag verm">' + dup + ' rasuradas</span>' : '') + '</div>' +
          '<p class="mut peq" style="margin-top:0">Compare com o seu cartão. Toque numa letra para corrigir só o que saiu diferente; toque de novo para deixar em branco.</p>';
        var ajustadas = ajustesLeitura(st), mostrar = [];
        for (var n = 1; n <= s.total; n++) {
          var atencao = st.duvidas.indexOf(n) >= 0 || st.respostas[n] === 'X' || ajustadas.indexOf(n) >= 0;
          if (st.todas || !st.lido || atencao) mostrar.push(n);
        }
        if (st.lido && !st.todas) h += '<h3 style="margin:4px 0 8px">' + (mostrar.length ? 'Pedem atenção' : 'Nenhuma questão pede atenção') + '</h3>';
        if (mostrar.length) h += '<div class="gabgrid">' + mostrar.map(function (n) {
          var v = st.respostas[n], alerta = st.duvidas.indexOf(n) >= 0 || v === 'X', aj = ajustadas.indexOf(n) >= 0;
          return '<div class="gq' + (alerta ? ' alerta' : '') + (aj ? ' ajustada' : '') + '"><span class="n">' + n + '</span>' +
            alts.map(function (l) { return '<button data-n="' + n + '" data-l="' + l + '" class="' + (v === l ? 'on' : '') + '">' + l + '</button>'; }).join('') +
            (v === 'X' ? '<button class="x" data-n="' + n + '" data-l="X" title="Mais de uma marcação">X</button>' : '') +
            (aj ? '<span class="aj">ajustada</span>' : '') + '</div>';
        }).join('') + '</div>';
        if (st.lido) h += '<p class="peq" style="margin:12px 0 0">' + (st.todas
          ? '<a href="#" id="todas">Mostrar só as que pedem atenção</a>'
          : 'Alguma outra leitura saiu diferente do seu cartão? <a href="#" id="todas">Ver todas as ' + s.total + ' questões</a>') + '</p>' +
          (ajustadas.length ? '<p class="mut peq" style="margin:6px 0 0">As questões ajustadas ficam registradas para o professor conferir na foto.</p>' : '');
        h += '</div>';
        if (s.versoes > 1) {
          h += '<div class="card versao-envio"><h3 style="margin-bottom:6px">Versão do caderno de prova</h3>' +
            (versaoFixa ? '<p style="margin:0">Seu cartão é da <b>versão ' + versaoFixa + '</b>. A correção usa o gabarito dessa versão.</p>'
              : '<p class="mut peq" style="margin-top:0">A versão está impressa na capa do caderno e no cartão-resposta. Ela define o gabarito usado na correção.</p>' +
                '<div class="versoes">' + Array.apply(null, Array(s.versoes)).map(function (x, i) {
                  return '<button class="btn versao' + (st.versao === i + 1 ? ' on' : '') + '" data-ver="' + (i + 1) + '"><b>Versão ' + (i + 1) + '</b></button>';
                }).join('') + '</div>') + '</div>';
        }
        h += '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">' +
          '<button class="btn" id="refazer">Refazer foto</button><button class="btn pri" id="enviar">Enviar e corrigir</button></div>';
      }
      m.innerHTML = h;
      $('#voltar').onclick = function () { ir(S.user.perfil === 'ALUNO' ? 'meus' : 'simulados'); };

      var aposLeitura = function (res) {
        st.respostas = res.respostas; st.lido = JSON.parse(JSON.stringify(res.respostas)); st.todas = false; st.duvidas = res.duvidas || []; st.conferencia = res.conferencia || ''; st.avisos = [];
        if (st.duvidas.length) st.avisos.push(['ambar', 'Confira com atenção as questões ' + st.duvidas.join(', ') + ' (marca fraca, apagada ou dupla).']);
        else st.avisos.push(['verde', 'Cartão lido. Mesmo assim, confira as respostas antes de enviar.']);
        st.etapa = 2; desenhar();
      };

      if (st.etapa === 1) {
        $$('.foto-in').forEach(function (inp) { inp.onchange = function (e) {
          var f = e.target.files[0]; if (!f) return;
          st.arquivo = f; st.erroLeitura = '';
          carregando($('#prev'), 'Lendo o cartão…');
          Promise.resolve().then(function () {
            return Promise.all([lerImagem(f, 1400, 0.75), OMR.ler(f, L)]);
          }).then(function (rr) {
            st.foto = rr[0];
            if (!rr[1].ok) { st.erroLeitura = rr[1].erro; desenhar(); return; }
            aposLeitura(rr[1]);
          }).catch(function (er) { st.erroLeitura = msgErro(er); desenhar(); });
        }; });
        if ($('#ia')) $('#ia').onclick = function () {
          ocupado(this, 'A IA está lendo o cartão…', function () {
            return call('lerCartao', { simuladoId: s.id, base64: st.foto.base64, mime: st.foto.mime });
          }).then(function (r) { aposLeitura({ respostas: r.respostas, duvidas: r.ilegiveis }); }).catch(function () {});
        };
        $('#manual').onclick = function (e) { e.preventDefault(); st.lido = null; st.avisos = [['azul', 'Preencha conforme o que marcou no cartão.']]; st.conferencia = ''; st.etapa = 2; desenhar(); };
      } else {
        $$('.gq button').forEach(function (b) {
          b.onclick = function () {
            var n = b.getAttribute('data-n'), l = b.getAttribute('data-l');
            st.respostas[n] = (st.respostas[n] === l) ? '' : l;
            desenhar();
          };
        });
        if ($('#todas')) $('#todas').onclick = function (e) { e.preventDefault(); st.todas = !st.todas; desenhar(); };
        $$('[data-ver]').forEach(function (b) { b.onclick = function () { st.versao = +b.getAttribute('data-ver'); desenhar(); }; });
        $('#refazer').onclick = function () { st.etapa = 1; st.erroLeitura = ''; desenhar(); };
        $('#enviar').onclick = function () {
          var btn = this;
          if (s.versoes > 1 && !st.versao) { toast('Escolha a versão do caderno de prova antes de enviar.', true); return; }
          confirmar('Depois de enviado, o cartão não pode ser alterado. Suas respostas estão conferidas?', 'Enviar').then(function () {
            ocupado(btn, 'Corrigindo e montando o relatório…', function () {
              return call('enviarRespostas', { simuladoId: s.id, respostas: st.respostas, alunoId: p.alunoId,
                versao: st.versao || null, ajustes: ajustesLeitura(st), foto: st.foto ? { base64: st.foto.base64 } : null });
            }).then(function (r) {
              toast('Cartão corrigido: ' + r.acertos + '/' + r.total + ' acertos.');
              ir('relatorio', { id: r.id });
            }).catch(function () {});
          });
        };
      }
    };
    desenhar();
  });
};

// ---------------------------------------------------------------- relatório individual
function formatarPlano(t) {
  var h = '', lista = false;
  String(t || '').split(/\r?\n/).forEach(function (l) {
    l = l.trim();
    if (!l) return;
    var item = /^[-•*]\s+/.test(l);
    if (item && !lista) { h += '<ul>'; lista = true; }
    if (!item && lista) { h += '</ul>'; lista = false; }
    l = l.replace(/\*\*/g, '');
    if (item) h += '<li>' + esc(l.replace(/^[-•*]\s+/, '')) + '</li>';
    else if (/:$/.test(l) && l.length < 80) h += '<h4>' + esc(l) + '</h4>';
    else h += '<p style="margin:4px 0">' + esc(l) + '</p>';
  });
  return h + (lista ? '</ul>' : '');
}

    };
  });
};

// ---------------------------------------------------------------- estratégias de estudo
var STATUS_E = { SUGERIDA: ['Aguardando OK', 'ambar'], APROVADA: ['Aprovada', 'verde'] };

/** Uma estratégia (uma disciplina). interno = visão do professor/coordenação (com edição e OK). */
function blocoEstrategia(e, interno, selecionavel) {
  var de = e.desempenho ? '<span class="meta">' + e.desempenho.acertos + '/' + e.desempenho.total + ' · ' + String(e.desempenho.pct).replace('.', ',') + '%</span>' : '';
  var editar = interno && e.podeAprovar && e.status === 'SUGERIDA';
  var h = '<div class="est" data-id="' + esc(e.id) + '"><div class="est-cab">' +
    (selecionavel && editar ? '<input type="checkbox" class="est-sel" data-id="' + esc(e.id) + '" aria-label="Selecionar">' : '') +
    '<h3>' + esc(e.disciplina) + '</h3>' + de + (interno ? tag(STATUS_E, e.status) : '') + '</div>';
  if (interno) {
    h += '<div class="est-meta">' + (e.aluno ? '<b>' + esc(e.aluno) + '</b>' + (e.turma ? ' · ' + esc(e.turma) : '') + ' · ' : '') + esc(e.simulado) +
      ' · ' + (e.origem === 'IA' ? 'sugestão da IA' : 'sugestão automática') + (e.editada ? ' · ajustada' : '') + '</div>';
  }
  h += editar
    ? '<textarea class="est-txt" rows="9">' + esc(e.texto) + '</textarea>' +
      '<div class="est-acoes"><span class="mut peq">Ajuste o texto se quiser e dê o OK. Só então o aluno vê.</span>' +
      (e.resultadoId && S.rota !== 'relatorio' ? '<button class="btn peq" data-rel="' + esc(e.resultadoId) + '">Ver relatório</button>' : '') +
      '<button class="btn peq ok est-ok">Dar OK</button></div>'
    : '<div class="plano est-corpo">' + formatarPlano(e.texto) + '</div>' +
      '<div class="est-pe mut peq">' + (e.status === 'APROVADA' ? 'Aprovada por ' + esc(e.professorNome || 'professor(a)') + (e.decididoEm ? ' em ' + dataBr(e.decididoEm) : '') : '') +
      (!interno && e.simulado ? (e.status === 'APROVADA' ? ' · ' : '') + esc(e.simulado) : '') +
      (interno && e.podeAprovar && e.status === 'APROVADA' ? ' <a href="#" class="est-editar">Editar</a>' : '') +
      (interno && e.resultadoId && S.rota !== 'relatorio' ? ' <a href="#" data-rel="' + esc(e.resultadoId) + '">Ver relatório</a>' : '') + '</div>';
  return h + '</div>';
}

/** Liga os botões de OK/edição dentro de raiz. aoMudar() recarrega a tela. */
function ligarEstrategias(raiz, aoMudar, lista) {
  if (!raiz) return;
  $$('[data-rel]', raiz).forEach(function (b) {
    b.onclick = function (ev) { ev.preventDefault(); ir('relatorio', { id: b.getAttribute('data-rel') }); };
  });
  $$('.est-ok', raiz).forEach(function (b) {
    b.onclick = function () {
      var box = b.closest('.est');
      var item = { id: box.getAttribute('data-id'), texto: $('.est-txt', box).value };
      ocupado(b, 'Salvando…', function () { return call('aprovarEstrategias', { itens: [item] }); }).then(function (r) {
        if (r.erros.length) { toast(r.erros.join(' · '), true); return; }
        toast('Estratégia aprovada. O aluno já pode ver.');
        aoMudar();
      }).catch(function () {});
    };
  });
  $$('.est-editar', raiz).forEach(function (a) {
    a.onclick = function (ev) {
      ev.preventDefault();
      var box = a.closest('.est'), id = box.getAttribute('data-id');
      var e = (lista || []).filter(function (x) { return x.id === id; })[0];
      var texto = e ? e.texto : $('.est-corpo', box).innerText;
      $('.est-corpo', box).outerHTML = '<textarea class="est-txt" rows="9">' + esc(texto) + '</textarea>';
      $('.est-pe', box).outerHTML = '<div class="est-acoes"><span class="mut peq">O aluno passa a ver o texto novo assim que você salvar.</span>' +
        '<button class="btn peq ok est-ok">Salvar</button></div>';
      ligarEstrategias(box, aoMudar, lista);
    };
  });
}

/** Lista de estratégias para o professor (e a coordenação) dar o OK */
VIEWS.estrategias = function (m, p) {

  m.innerHTML = cabPag('Estratégias de estudo', 'Sugestões feitas a partir do relatório de cada aluno. Confira, ajuste se precisar e dê o OK: só então o aluno vê.',
    adm ? '<button class="btn" id="ee-exp">Exportar para a IA</button><button class="btn" id="ee-imp">Importar da IA</button>' : '') +
    '<div class="card nao-imprimir"><div class="linha">' +
    '<label class="campo" style="margin:0"><span>Situação</span><select id="ee-st"><option value="SUGERIDA">Aguardando OK</option>' +
    '<option value="APROVADA">Aprovadas</option><option value="">Todas</option></select></label>' +
    '<label class="campo" style="margin:0"><span>Disciplina</span><select id="ee-disc"><option value="">Todas</option>' +
    disciplinasDe('ESPCEX').map(function (d) { return '<option>' + esc(d) + '</option>'; }).join('') + '</select></label>' +

  var todas = [], marcadas = {};

    var vis = todas.filter(function (e) {
      return (!disc || e.disciplina === disc) && (!b || ((e.aluno || '') + ' ' + (e.turma || '')).toLowerCase().indexOf(b) >= 0);
    });
    if (!vis.length) {
      l.innerHTML = '<div class="card vazio">' + icone('plano-estudos', 'ic-vazio') +

    ligarEstrategias(l, carregar, todas);
    var selecionaveis = vis.filter(function (e) { return e.podeAprovar && e.status === 'SUGERIDA'; });
    var lote = function () {
      var n = Object.keys(marcadas).length;
      $('#ee-lote').innerHTML = selecionaveis.length < 2 ? '' :
        '<div class="lote"><label class="peq"><input type="checkbox" id="ee-todas"' + (n && n === selecionaveis.length ? ' checked' : '') + '> ' +
        'Selecionar todas (' + selecionaveis.length + ')</label>' +
        '<button class="btn ok" id="ee-ok"' + (n ? '' : ' disabled') + '>Dar OK nas selecionadas' + (n ? ' (' + n + ')' : '') + '</button></div>';
      if (!$('#ee-todas')) return;
      $('#ee-todas').onchange = function () {
        marcadas = {};
        if (this.checked) selecionaveis.forEach(function (e) { marcadas[e.id] = true; });
        $$('.est-sel', l).forEach(function (c) { c.checked = !!marcadas[c.getAttribute('data-id')]; });
        lote();
      };
      $('#ee-ok').onclick = function () {
        var itens = Object.keys(marcadas).map(function (id) {
          var box = $('.est[data-id="' + id + '"]', l);
          return { id: id, texto: box ? $('.est-txt', box).value : undefined };
        });
        ocupado(this, 'Salvando…', function () { return call('aprovarEstrategias', { itens: itens }); }).then(function (r) {
          if (r.aprovadas.length) toast(r.aprovadas.length + ' estratégia(s) aprovada(s). Os alunos já podem ver.');
          if (r.erros.length) toast('Não aprovadas: ' + r.erros.join(' · '), true);
          carregar();
        }).catch(function () {});
      };
    };
    $$('.est-sel', l).forEach(function (c) {
      c.checked = !!marcadas[c.getAttribute('data-id')];
      c.onchange = function () { if (c.checked) marcadas[c.getAttribute('data-id')] = true; else delete marcadas[c.getAttribute('data-id')]; lote(); };
    });
    lote();
  };
  var carregar = function () {
    carregando($('#lista')); marcadas = {};
    call('listarEstrategias', { status: $('#ee-st').value }).then(function (es) { todas = es; desenhar(); })
      .catch(function (e) { $('#lista').innerHTML = '<div class="aviso verm">' + esc(msgErro(e)) + '</div>'; });
  };
  $('#ee-st').onchange = carregar; $('#ee-disc').onchange = desenhar; $('#ee-busca').oninput = desenhar;
  carregar();
};

// ---------------------------------------------------------------- gráficos do Painel do aluno
function num(v) { return String(Math.round(v * 10) / 10).replace('.', ','); }

/** Dica flutuante única de um cartão de gráfico (texto sempre via textContent) */
function dicaGrafico(card) {
  var d = $('.graf-dica', card);
  if (!d) { d = document.createElement('div'); d.className = 'graf-dica'; d.setAttribute('role', 'status'); card.appendChild(d); }
  return {
    mostrar: function (linhas, x, y) {
      d.innerHTML = '';
      linhas.forEach(function (l, i) {
        var e = document.createElement(i === 0 ? 'b' : 'span'); e.textContent = l;
        if (/^Toque/.test(l)) e.className = 'acao';
        d.appendChild(e);
      });
      d.style.display = 'block';
      var w = d.offsetWidth, cw = card.clientWidth;
      d.style.left = Math.max(8, Math.min(cw - w - 8, x - w / 2)) + 'px';
      d.style.top = Math.max(4, y - d.offsetHeight - 12) + 'px';
    },
    esconder: function () { d.style.display = 'none'; }
  };
}

/** Evolução da nota: linha única, cruz que segue o dedo/mouse, toque no ponto abre o relatório */
function graficoEvolucao(alvo, rs) {
  var pts = rs.slice().reverse(); // do mais antigo para o mais recente
  var desenhar = function () {
    var W = Math.max(280, alvo.clientWidth), H = 230, ml = 36, mr = 18, mt = 16, mb = 30;
    var iw = W - ml - mr, ih = H - mt - mb;
    var X = function (i) { return ml + (pts.length === 1 ? iw / 2 : iw * i / (pts.length - 1)); };
    var Y = function (v) { return mt + ih * (1 - v / 100); };
    var g = '<svg class="graf" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Evolução da nota nos simulados">';
    [0, 25, 50, 75, 100].forEach(function (v) {
      g += '<line x1="' + ml + '" x2="' + (W - mr) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" class="grade-l"/>' +
        '<text x="' + (ml - 8) + '" y="' + (Y(v) + 4) + '" class="eixo" text-anchor="end">' + v + '</text>';
    });
    var passo = Math.ceil(pts.length / Math.max(1, Math.floor(iw / 64)));
    pts.forEach(function (r, i) {
      if (i % passo === 0 || i === pts.length - 1) g += '<text x="' + X(i) + '" y="' + (H - 8) + '" class="eixo" text-anchor="middle">' + dataBr(r.criadoEm).slice(0, 5) + '</text>';
    });
    if (pts.length > 1) g += '<polyline class="linha" points="' + pts.map(function (r, i) { return X(i) + ',' + Y(r.notaFinal); }).join(' ') + '"/>';
    g += '<line class="cruz" y1="' + mt + '" y2="' + (mt + ih) + '" x1="0" x2="0" style="display:none"/>';
    pts.forEach(function (r, i) {
      g += '<circle class="ponto" cx="' + X(i) + '" cy="' + Y(r.notaFinal) + '" r="4" data-i="' + i + '" tabindex="0" ' +
        'aria-label="' + esc(r.simulado + ': nota final ' + num(r.notaFinal)) + '"/>';
    });
    var u = pts[pts.length - 1];
    g += '<text class="rotulo" x="' + X(pts.length - 1) + '" y="' + (Y(u.notaFinal) - 12) + '" text-anchor="' + (pts.length > 1 ? 'end' : 'middle') + '">' + num(u.notaFinal) + '</text>';
    g += '<rect class="alvo" x="' + ml + '" y="0" width="' + iw + '" height="' + H + '" fill="transparent"/></svg>';
    alvo.innerHTML = g;

    var card = alvo.closest('.card'), dica = dicaGrafico(card), svg = $('svg', alvo), cruz = $('.cruz', alvo);
    var marcar = function (i) {
      var r = pts[i], c = $$('.ponto', alvo);
      c.forEach(function (p, k) { p.setAttribute('r', k === i ? 6 : 4); });
      cruz.setAttribute('x1', X(i)); cruz.setAttribute('x2', X(i)); cruz.style.display = '';
      var bs = svg.getBoundingClientRect(), bc = card.getBoundingClientRect();
      dica.mostrar(['Nota final ' + num(r.notaFinal), r.simulado, r.acertos + '/' + r.total + ' acertos · ' + dataBr(r.criadoEm),
        r.apto ? 'Atingiu a mediana em todas' : 'Abaixo da mediana em ' + r.abaixo.join(', '), 'Toque para abrir o relatório'],
        bs.left - bc.left + X(i), bs.top - bc.top + Y(r.notaFinal));
      alvo.setAttribute('data-sel', i);
    };
    var limpar = function () { dica.esconder(); cruz.style.display = 'none'; $$('.ponto', alvo).forEach(function (p) { p.setAttribute('r', 4); }); alvo.removeAttribute('data-sel'); };
    var maisPerto = function (ev) {
      var x = ev.clientX - svg.getBoundingClientRect().left, m = 0, dm = 1e9;
      pts.forEach(function (r, i) { var dd = Math.abs(X(i) - x); if (dd < dm) { dm = dd; m = i; } });
      return m;
    };
    var alvoR = $('.alvo', alvo);
    alvoR.addEventListener('pointermove', function (ev) { marcar(maisPerto(ev)); });
    alvoR.addEventListener('pointerleave', function (ev) { if (ev.pointerType === 'mouse') limpar(); });
    alvoR.addEventListener('click', function (ev) {
      var i = maisPerto(ev);
      if (ev.pointerType !== 'mouse' && String(alvo.getAttribute('data-sel')) !== String(i)) { marcar(i); return; } // 1º toque mostra, 2º abre
      ir('relatorio', { id: pts[i].id });
    });
    $$('.ponto', alvo).forEach(function (p) {
      var i = +p.getAttribute('data-i');
      p.addEventListener('focus', function () { marcar(i); });
      p.addEventListener('blur', limpar);
      p.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') ir('relatorio', { id: pts[i].id }); });
    });
  };
  desenhar();
  var t = null;
  var aoRedim = function () { if (!document.body.contains(alvo)) { window.removeEventListener('resize', aoRedim); return; } clearTimeout(t); t = setTimeout(desenhar, 120); };
  window.addEventListener('resize', aoRedim);
}

/** Desempenho por disciplina no simulado escolhido, com a sua média nos simulados como referência */
function graficoDisciplinas(alvo, rs) {
  var medias = {};
  rs.forEach(function (r) {
    (r.porDisciplina || []).forEach(function (x) {
      var m = medias[x.disciplina] = medias[x.disciplina] || { a: 0, t: 0, n: 0 };
      m.a += x.acertos; m.t += x.total; m.n++;
    });
  });
  var comMedia = rs.length > 1;
  var desenhar = function (k) {
    var r = rs[k], ds = r.porDisciplina || [];
    alvo.innerHTML = (rs.length > 1 ? '<label class="campo graf-filtro"><span>Simulado</span><select class="gd-sel">' + rs.map(function (x, i) {
      return '<option value="' + i + '"' + (i === k ? ' selected' : '') + '>' + esc(x.simulado) + ' · ' + dataBr(x.criadoEm) + '</option>';
    }).join('') + '</select></label>' : '<p class="mut peq" style="margin:0 0 8px">' + esc(r.simulado) + '</p>') +
      (comMedia ? '<div class="graf-legenda"><span><i class="lg-barra"></i>Este simulado</span><span><i class="lg-traco"></i>Sua média nos simulados</span></div>' : '') +
      (ds.length ? '<div class="gd">' + ds.map(function (x, i) {
        var m = medias[x.disciplina], mp = m && m.t ? 100 * m.a / m.t : null;
        return '<div class="gd-linha" tabindex="0" data-i="' + i + '"><span class="gd-nome">' + esc(x.disciplina) + '</span>' +
          '<span class="gd-trilho"><i class="gd-barra" style="width:' + Math.max(0, Math.min(100, x.pct)) + '%"></i>' +
          (comMedia && mp !== null ? '<i class="gd-media" style="left:' + mp + '%"></i>' : '') + '</span>' +
          '<span class="gd-v">' + num(x.pct) + '%</span></div>';
      }).join('') + '<div class="gd-eixo"><span></span><span class="gd-escala"><i>0%</i><i>50%</i><i>100%</i></span><span></span></div></div>'
        : '<p class="mut">Sem dados por disciplina neste simulado.</p>');
    var sel = $('.gd-sel', alvo);
    if (sel) sel.onchange = function () { desenhar(+sel.value); };
    var card = alvo.closest('.card'), dica = dicaGrafico(card);
    $$('.gd-linha', alvo).forEach(function (l) {
      var x = ds[+l.getAttribute('data-i')], m = medias[x.disciplina];
      var mostrar = function () {
        var b = $('.gd-barra', l).getBoundingClientRect(), bc = card.getBoundingClientRect();
        var linhas = [num(x.pct) + '% em ' + x.disciplina, x.acertos + ' de ' + x.total + ' questões certas'];
        if (comMedia && m && m.t) linhas.push('Sua média: ' + num(100 * m.a / m.t) + '% (' + m.n + ' simulado' + (m.n > 1 ? 's' : '') + ')');
        dica.mostrar(linhas, b.left - bc.left + Math.max(b.width, 24), b.top - bc.top);
      };
      l.addEventListener('pointerenter', mostrar); l.addEventListener('focus', mostrar); l.addEventListener('click', mostrar);
      l.addEventListener('pointerleave', function (ev) { if (ev.pointerType === 'mouse') dica.esconder(); });
      l.addEventListener('blur', function () { dica.esconder(); });
    });
  };
  desenhar(0);
}

      '<div class="kpi"><small>Mediana no último</small><div style="margin-top:8px">' + tag(STATUS_CORTE, rs[0].apto ? 'TODAS_C' : 'FORA_C') + '</div></div></div>' +

    h += '<details class="card tabela-graf"><summary>Ver os números em tabela</summary><div class="rolagem"><table class="tab"><tr><th>Simulado</th><th>Data</th><th class="num">Nota final</th>' +

          '<td class="peq">' + (x.porDisciplina || []).map(function (d) { return esc(d.disciplina) + ' ' + d.acertos + '/' + d.total; }).join(' · ') + '</td></tr>';

/** Nota final (pesos do edital), mediana de cada disciplina e classificação no simulado */
var STATUS_CORTE = { SIM: ['Atingiu', 'verde'], NAO: ['Abaixo', 'verm'], TODAS: ['Atingiu a mediana em todas', 'verde'], FORA: ['Abaixo da mediana', 'verm'],
  TODAS_C: ['Atingiu em todas', 'verde'], FORA_C: ['Abaixo em alguma', 'verm'] };
function blocoCorte(c, aluno) {
  var h = '<div class="card"><h2>Nota final e mediana</h2>' +
    '<p class="mut peq" style="margin-top:0">Como na EsPCEx: cada disciplina vale de 0 a 100 e a nota final é a média com os pesos do edital ' +
    '(Português e Matemática 2; Física e Inglês 1,5; as demais 1). Quem fica abaixo da <b>mediana</b> em qualquer disciplina é eliminado. ' +
    'Entre os demais, a classificação segue a nota final, e passar depende do número de vagas. Aqui, a mediana é a dos ' +
    c.participantes + ' participante(s) deste simulado. A redação não entra.</p>' +
    (c.participantes < 5 ? '<div class="aviso ambar peq">Com poucos participantes, a mediana ainda diz pouco. Ela fica mais confiável quando a turma toda envia o cartão.</div>' : '') +
    '<div class="grade"><div class="kpi"><small>Nota final</small><b>' + num(c.notaFinal || 0) + '</b></div>' +
    '<div class="kpi"><small>Mediana</small><div style="margin-top:8px">' + tag(STATUS_CORTE, c.apto ? 'TODAS' : 'FORA') + '</div></div>' +
    '<div class="kpi"><small>Classificação</small>' + (c.apto
      ? '<b>' + c.posicaoAptos + 'º</b><span class="mut peq">de ' + c.aptos + ' que atingiram a mediana</span>'
      : '<div class="peq" style="margin-top:8px">Ficaria fora: abaixo da mediana em ' + esc(c.abaixo.join(', ')) + '.</div>') + '</div></div>' +
    '<div class="rolagem"><table class="tab"><tr><th>Disciplina</th><th class="num">Peso</th><th class="num">' + (aluno ? 'Sua nota' : 'Nota') + '</th>' +
    '<th class="num">Mediana</th><th>Situação</th></tr>' + c.disciplinas.map(function (x) {
      var ok = c.abaixo.indexOf(x.disciplina) < 0;
      return '<tr><td>' + esc(x.disciplina) + '</td><td class="num">' + num(x.peso) + '</td><td class="num">' + num(x.pct) + '</td>' +
        '<td class="num">' + (x.mediana === null || x.mediana === undefined ? '—' : num(x.mediana)) + '</td><td>' + tag(STATUS_CORTE, ok ? 'SIM' : 'NAO') + '</td></tr>';
    }).join('') + '</table></div></div>';
  return h;
}

// ---------------------------------------------------------------- resultados (ADM/PROF)
VIEWS.resultados = function (m, p) {
  m.innerHTML = cabPag('Resultados', 'Cartões corrigidos. Toque em uma linha para abrir o relatório do aluno.') +
    '<div class="card nao-imprimir"><div class="linha"><label class="campo" style="margin:0"><span>Simulado</span><select id="r-sim"><option value="">Todos</option></select></label>' +
    '<label class="campo" style="margin:0"><span>Turma</span><input type="text" id="r-tur" placeholder="Todas"></label></div></div><div id="lista"></div>';
  call('listarSimulados').then(function (ss) {
    $('#r-sim').innerHTML += ss.map(function (s) { return '<option value="' + s.id + '">' + esc(s.codigo + ' · ' + s.titulo) + '</option>'; }).join('');
    if (p.simuladoId) $('#r-sim').value = p.simuladoId;
    carregar();
  });
  var carregar = function () {
    var l = $('#lista'); carregando(l);
    call('resultados', { simuladoId: $('#r-sim').value, turma: $('#r-tur').value.trim() }).then(function (rs) {
      if (!rs.length) {
        l.innerHTML = '<div class="card vazio">Nenhum resultado.' + (S.user.perfil === 'PROFESSOR' && !S.user.turmas ? ' Peça à coordenação para vincular suas turmas.' : '') + '</div>';
        return;
      }
      var media = Math.round(10 * rs.reduce(function (a, r) { return a + r.notaFinal; }, 0) / rs.length) / 10;
      var aptos = rs.filter(function (r) { return r.apto; }).length;
      if ($('#r-sim').value) rs.sort(function (a, b) { return (a.posicao || 1e9) - (b.posicao || 1e9); });
      l.innerHTML = '<div class="grade"><div class="kpi"><small>Cartões</small><b>' + rs.length + '</b></div><div class="kpi"><small>Média da nota final</small><b>' + num(media) + '</b></div>' +
        '<div class="kpi"><small>Atingiram a mediana em todas</small><b>' + aptos + '</b></div></div>' +
        '<p class="mut peq">Nota final com os pesos da EsPCEx (0 a 100). A mediana é a dos participantes de cada simulado.' +
        ($('#r-sim').value ? ' Lista em ordem de classificação.' : ' Escolha um simulado para ver a ordem de classificação.') + '</p>' +
        '<div class="card rolagem"><table class="tab"><tr>' + ($('#r-sim').value ? '<th class="num">Nº</th>' : '') + '<th>Aluno</th><th>Turma</th><th>Simulado</th><th class="num">Nota final</th>' +
        '<th class="num">Acertos</th><th>Mediana</th><th>Data</th><th>E-mail</th></tr>' +
        rs.map(function (r, i) {
          return '<tr class="clic" data-i="' + i + '">' + ($('#r-sim').value ? '<td class="num">' + (r.posicao || '') + '</td>' : '') +
            '<td>' + esc(r.aluno) + '</td><td>' + esc(r.turma) + '</td><td class="peq">' + esc(r.simulado) + '</td>' +
            '<td class="num" style="font-weight:700">' + num(r.notaFinal) + '</td><td class="num">' + r.acertos + '/' + r.total + '</td>' +
            '<td>' + (r.apto ? tag(STATUS_CORTE, 'SIM') : '<span title="Abaixo em ' + esc(r.abaixo.join(', ')) + '">' + tag(STATUS_CORTE, 'NAO') + '</span>') + '</td>' +
            '<td class="peq">' + dataBr(r.criadoEm) + '</td><td class="peq mut">' + esc((r.emailStatus || '').split(' ')[0]) + '</td></tr>';
        }).join('') + '</table></div>';
      $$('tr.clic', l).forEach(function (tr) { tr.onclick = function () { ir('relatorio', { id: rs[+tr.getAttribute('data-i')].id }); }; });
    }).catch(function (e) { l.innerHTML = '<div class="aviso verm">' + esc(msgErro(e)) + '</div>'; });
  };
  $('#r-sim').onchange = carregar;
  $('#r-tur').onchange = carregar;
};

        '<div class="kpi"><small>Média geral</small><b>' + d.media + '%</b></div>' +
        '<div class="kpi"><small>Turma</small><b style="font-size:20px">' + esc(d.turma) + '</b></div></div>';
      h += '<div class="grade-2"><div class="card"><h2>Aproveitamento por disciplina</h2>' +
        d.porDisciplina.map(function (x) { return barra(x.disciplina, x.pct); }).join('') + '</div>' +
        '<div class="card"><h2>Alunos que precisam de mais atenção</h2>' + d.alunos.slice(0, 8).map(function (x, i) {
          return '<div class="clic al" data-id="' + x.resultadoId + '" style="cursor:pointer">' + barra(x.nome, x.nota) + '</div>';
        }).join('') + '<p class="mut peq">Ordenados da menor para a maior nota. Toque para abrir o relatório.</p></div></div>';
      h += '<h2 style="margin:10px 0">O que trabalhar em sala</h2>' +
        (d.deficiencias.length ? d.deficiencias.slice(0, 12).map(function (x) {
          var pct = Math.round(100 * x.alunosAfetados / d.participantes);
          return '<div class="def"><h3>' + esc(x.conceito) + ' <span class="tag">' + esc(x.disciplina) + '</span> ' +
            '<span class="tag verm">' + x.alunosAfetados + ' aluno(s) · ' + pct + '% da turma</span></h3>' +
            '<div class="peq"><b>Erro típico:</b> ' + esc(x.erro) + '</div><div class="peq"><b>Sugestão:</b> ' + esc(x.recomendacao) + '</div></div>';
        }).join('') : '<div class="card vazio">Nenhum erro mapeado.</div>');

            '<td class="num" style="color:' + corPct(x.pctAcerto) + ';font-weight:700">' + x.pctAcerto + '%</td><td style="text-align:center"><b>' + esc(x.correta) + '</b></td>' +
            '<td class="peq">' + dist + '</td><td class="peq">' + (dm ? '<b>' + dm.letra + '</b> (' + dm.vezes + 'x)' +

// ---------------------------------------------------------------- usuários (ADM)
VIEWS.usuarios = function (m) {
  m.innerHTML = cabPag('Usuários', 'Alunos, professores e administração',
    '<button class="btn" id="imp">Importar alunos</button><button class="btn pri" id="novo">+ Novo usuário</button>') +
    '<div class="card nao-imprimir"><div class="linha"><label class="campo" style="margin:0"><span>Perfil</span><select id="u-perf">' +
    '<option value="ALUNO">Alunos</option><option value="PROFESSOR">Professores</option><option value="ADM">Administração</option></select></label>' +
    '<label class="campo" style="margin:0"><span>Buscar</span><input type="text" id="u-busca" placeholder="Nome, turma ou matrícula"></label></div></div>' +
    '<div id="pedidos"></div><div id="lista"></div>';
  var todos = [];
  var carregarPedidos = function () {
    call('listarSolicitacoes').then(function (ps) {
      var box = $('#pedidos'); if (!box) return;
      if (!ps.length) { box.innerHTML = ''; return; }
      var sel = {};
      var desenharP = function () {
        var n = Object.keys(sel).length;
        box.innerHTML = '<div class="card pedidos"><div class="pedidos-cab"><h2>Pedidos de acesso <span class="tag ambar">' + ps.length + '</span></h2>' +
          '<label class="peq"><input type="checkbox" id="pd-todos"' + (n === ps.length ? ' checked' : '') + '> Selecionar todos</label></div>' +
          '<p class="mut peq" style="margin-top:0">Ao aprovar, o MIRA cria o login do aluno e envia a <b>senha provisória</b> para o e-mail dele. No primeiro acesso ele cria a própria senha.</p>' +
          '<div class="rolagem"><table class="tab"><tr><th></th><th>Nome</th><th>E-mail</th><th>Matrícula</th><th>Turma</th><th>Responsável</th><th>Pedido em</th></tr>' +
          ps.map(function (p) {
            return '<tr><td><input type="checkbox" class="pd" data-id="' + esc(p.id) + '"' + (sel[p.id] ? ' checked' : '') + '></td>' +
              '<td><b>' + esc(p.nome) + '</b></td><td class="peq">' + esc(p.email) + '</td><td>' + esc(p.matricula || '—') + '</td><td>' + esc(p.turma || '—') + '</td>' +
              '<td class="peq">' + esc(p.responsavelNome || '') + '<div class="mut">' + esc(p.responsavelEmail || '') + '</div></td><td class="peq">' + dataBr(p.criadoEm) + '</td></tr>';
          }).join('') + '</table></div>' +
          '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px">' +
          '<button class="btn perigo" id="pd-rec"' + (n ? '' : ' disabled') + '>Recusar</button>' +
          '<button class="btn ok" id="pd-apr"' + (n ? '' : ' disabled') + '>Aprovar e enviar senha' + (n ? ' (' + n + ')' : '') + '</button></div></div>';
        $('#pd-todos').onchange = function () { sel = {}; if (this.checked) ps.forEach(function (p) { sel[p.id] = true; }); desenharP(); };
        $$('.pd', box).forEach(function (c) { c.onchange = function () { if (c.checked) sel[c.getAttribute('data-id')] = true; else delete sel[c.getAttribute('data-id')]; desenharP(); }; });
        var decidir = function (btn, decisao) {
          var ids = Object.keys(sel);
          ocupado(btn, decisao === 'APROVAR' ? 'Aprovando…' : 'Recusando…', function () {
            return call('decidirSolicitacoes', { ids: ids, decisao: decisao, enviarEmail: true });
          }).then(function (r) {
            if (r.erros.length) toast('Não processados: ' + r.erros.join(' · '), true);
            if (decisao === 'APROVAR' && r.feitos.length) {
              var semEmail = r.feitos.filter(function (f) { return !f.emailEnviado; });
              modal(topoModal(r.feitos.length + ' acesso(s) liberado(s)') +
                '<p class="peq">' + (semEmail.length ? 'Não foi possível enviar o e-mail para ' + semEmail.length + ' aluno(s): entregue a senha provisória a eles.'
                  : 'A senha provisória foi enviada para o e-mail de cada aluno.') + ' Ela aparece aqui só agora.</p>' +
                '<div class="rolagem"><table class="tab"><tr><th>Aluno</th><th>Login</th><th>Senha provisória</th><th>E-mail</th></tr>' +
                r.feitos.map(function (f) {
                  return '<tr><td>' + esc(f.nome) + '</td><td class="peq">' + esc(f.login) + '</td><td><code>' + esc(f.senha) + '</code></td><td>' +
                    (f.emailEnviado ? '<span class="tag verde">enviado</span>' : '<span class="tag verm">não enviado</span>') + '</td></tr>';
                }).join('') + '</table></div>', true);
            } else if (r.feitos.length) toast(r.feitos.length + ' pedido(s) recusado(s).');
            carregarPedidos(); carregar();
          }).catch(function () {});
        };
        $('#pd-apr').onclick = function () { decidir(this, 'APROVAR'); };
        $('#pd-rec').onclick = function () { var b = this; confirmar('Recusar ' + Object.keys(sel).length + ' pedido(s)? O aluno não é avisado.', 'Recusar').then(function () { decidir(b, 'RECUSAR'); }); };
      };
      desenharP();
    }).catch(function () {});
  };
  var desenhar = function () {
    var perf = $('#u-perf').value, b = $('#u-busca').value.toLowerCase();
    var us = todos.filter(function (u) {
      return u.perfil === perf && (!b || (u.nome + ' ' + u.turma + ' ' + u.turmas + ' ' + u.matricula + ' ' + u.email).toLowerCase().indexOf(b) >= 0);
    }).sort(function (a, c) { return a.nome.localeCompare(c.nome); });
    var l = $('#lista');
    if (!us.length) { l.innerHTML = '<div class="card vazio">Nenhum usuário.</div>'; return; }
    var cols = perf === 'ALUNO' ? '<th>Nome</th><th>Matrícula</th><th>Turma</th><th>Responsável</th><th>LGPD</th>'
      : perf === 'PROFESSOR' ? '<th>Nome</th><th>E-mail</th><th>Disciplinas</th><th>Turmas</th>' : '<th>Nome</th><th>E-mail</th>';
    l.innerHTML = '<div class="card rolagem"><p class="mut peq" style="margin-top:0">' + us.length + ' usuário(s)</p><table class="tab"><tr>' + cols + '<th></th></tr>' +
      us.map(function (u) {
        var inativo = u.ativo !== 'SIM' ? ' <span class="tag">inativo</span>' : '';
        var c = perf === 'ALUNO' ? '<td>' + esc(u.nome) + inativo + '</td><td>' + esc(u.matricula) + '</td><td>' + esc(u.turma) + '</td><td class="peq">' + esc(u.responsavelNome) + '<div class="mut">' + esc(u.responsavelEmail) + '</div></td>' +
          '<td>' + (u.consentimento === 'SIM' ? '<span class="tag verde">ok</span>' : '<span class="tag ambar">pendente</span>') + '</td>'
          : perf === 'PROFESSOR' ? '<td>' + esc(u.nome) + inativo + '</td><td class="peq">' + esc(u.email) + '</td><td class="peq">' + esc(u.disciplinas || 'Todas') + '</td><td class="peq">' + esc(u.turmas || '—') + '</td>'
            : '<td>' + esc(u.nome) + inativo + '</td><td class="peq">' + esc(u.email) + '</td>';
        return '<tr class="clic" data-id="' + u.id + '">' + c + '<td class="mut peq">editar</td></tr>';
      }).join('') + '</table></div>';
    $$('tr.clic', l).forEach(function (tr) {
      tr.onclick = function () { formUsuario(todos.filter(function (u) { return u.id === tr.getAttribute('data-id'); })[0], carregar); };
    });
  };
  var carregar = function () {
    carregando($('#lista'));
    call('listarUsuarios').then(function (us) { todos = us; desenhar(); });
  };
  $('#u-perf').onchange = desenhar; $('#u-busca').oninput = desenhar;
  $('#novo').onclick = function () { formUsuario({ perfil: $('#u-perf').value }, carregar); };
  $('#imp').onclick = function () { importarAlunos(carregar); };
  carregar();
  carregarPedidos();
};

function mostrarSenha(titulo, login, senha) {
  modal(topoModal(titulo) + '<p>Entregue estes dados ao usuário. A senha não será exibida novamente.</p>' +
    '<div class="card" style="background:var(--bg);font-size:16px"><div><b>Login:</b> ' + esc(login) + '</div><div><b>Senha:</b> <span style="font-family:monospace;font-size:18px">' + esc(senha) + '</span></div></div>' +
    '<p class="mut peq">O usuário pode trocar a senha em "Minha conta".</p>');
}

function formUsuario(u, aoSalvar) {
  var discs = disciplinasDe('ESPCEX');
  var minhas = csv(u.disciplinas);
  var md = modal(topoModal(u.id ? 'Editar usuário' : 'Novo usuário') + '<form id="fu">' +
    '<div class="linha"><label class="campo"><span>Perfil</span><select id="u-p">' +
    [['ALUNO', 'Aluno'], ['PROFESSOR', 'Professor'], ['ADM', 'Administração']].map(function (x) {
      return '<option value="' + x[0] + '"' + (x[0] === u.perfil ? ' selected' : '') + '>' + x[1] + '</option>';
    }).join('') + '</select></label>' +
    '<label class="campo"><span>Situação</span><select id="u-at"><option value="SIM">Ativo</option><option value="NAO"' + (u.ativo === 'NAO' ? ' selected' : '') + '>Inativo</option></select></label></div>' +
    '<label class="campo"><span>Nome completo *</span><input type="text" id="u-nome" required value="' + esc(u.nome) + '"></label>' +
    '<div class="linha"><label class="campo"><span>E-mail</span><input type="email" id="u-email" value="' + esc(u.email) + '"></label>' +
    '<label class="campo grp-aluno"><span>Matrícula</span><input type="text" id="u-mat" value="' + esc(u.matricula) + '"></label></div>' +
    '<div class="grp-aluno"><label class="campo"><span>Turma</span><input type="text" id="u-tur" placeholder="Ex.: 3A" value="' + esc(u.turma) + '"></label>' +
    '<div class="linha"><label class="campo"><span>Nome do responsável</span><input type="text" id="u-rn" value="' + esc(u.responsavelNome) + '"></label>' +
    '<label class="campo"><span>E-mail do responsável</span><input type="email" id="u-re" value="' + esc(u.responsavelEmail) + '"></label></div>' +
    '<label style="display:flex;gap:8px;margin-bottom:12px" class="peq"><input type="checkbox" id="u-cons"' + (u.consentimento === 'SIM' ? ' checked' : '') + '>' +
    '<span>O responsável autorizou o tratamento dos dados de desempenho e o envio de relatórios por e-mail (LGPD).</span></label></div>' +
    '<div class="grp-prof"><div class="campo"><span class="mut peq" style="font-weight:600">Disciplinas (nenhuma marcada = todas)</span><div style="display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px">' +
    discs.map(function (d) { return '<label class="peq"><input type="checkbox" class="u-d" value="' + esc(d) + '"' + (minhas.indexOf(d) >= 0 ? ' checked' : '') + '> ' + esc(d) + '</label>'; }).join('') +
    '</div></div><label class="campo"><span>Turmas que acompanha (separe por vírgula)</span><input type="text" id="u-turs" placeholder="Ex.: 3A, 3B" value="' + esc(u.turmas) + '"></label></div>' +
    '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap">' +
    (u.id ? '<button type="button" class="btn" id="u-rs" style="margin-right:auto">Gerar nova senha</button>' : '') +
    '<button type="button" class="btn fechar">Cancelar</button><button class="btn pri" id="u-ok">Salvar</button></div></form>');
  var ajustar = function () {
    var p = $('#u-p', md.el).value;
    $$('.grp-aluno', md.el).forEach(function (x) { x.style.display = p === 'ALUNO' ? '' : 'none'; });
    $$('.grp-prof', md.el).forEach(function (x) { x.style.display = p === 'PROFESSOR' ? '' : 'none'; });
  };
  $('#u-p', md.el).onchange = ajustar; ajustar();
  if ($('#u-rs', md.el)) $('#u-rs', md.el).onclick = function () {
    ocupado(this, 'Gerando…', function () { return call('redefinirSenha', { id: u.id }); })
      .then(function (r) { md.fechar(); mostrarSenha('Nova senha', u.email || u.matricula, r.senha); }).catch(function () {});
  };
  $('#fu', md.el).onsubmit = function (e) {
    e.preventDefault();
    var d = {
      id: u.id, perfil: $('#u-p', md.el).value, ativo: $('#u-at', md.el).value, nome: $('#u-nome', md.el).value.trim(),
      email: $('#u-email', md.el).value.trim(), matricula: $('#u-mat', md.el).value.trim(), turma: $('#u-tur', md.el).value.trim(),
      responsavelNome: $('#u-rn', md.el).value.trim(), responsavelEmail: $('#u-re', md.el).value.trim(),
      consentimento: $('#u-cons', md.el).checked ? 'SIM' : 'NAO',
      disciplinas: $$('.u-d:checked', md.el).map(function (x) { return x.value; }).join(', '),
      turmas: csv($('#u-turs', md.el).value).join(', ')
    };
    if (d.perfil !== 'ALUNO') { d.matricula = ''; d.turma = ''; d.responsavelNome = ''; d.responsavelEmail = ''; }
    ocupado($('#u-ok', md.el), 'Salvando…', function () { return call('salvarUsuario', d); }).then(function (r) {
      md.fechar(); toast('Usuário salvo.'); aoSalvar();
      if (r.senhaInicial) mostrarSenha('Usuário criado', d.email || d.matricula, r.senhaInicial);
    }).catch(function () {});
  };
}

    '<textarea id="imp-txt" rows="10" placeholder="Cole aqui…"></textarea>' +
