// ---------------------------------------------------------------- fórmulas (LaTeX com KaTeX)
// Fórmulas entre $...$, $$...$$, \(...\) ou \[...\] viram fórmulas formatadas em qualquer tela.
// Potências escritas sem LaTeX (10^2, m/s^2, x^-1) também viram expoente. "R$" nunca abre fórmula.
var KATEX_CSS = 'https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css';
var TAGS_SEM_FORMULA = { SCRIPT: 1, STYLE: 1, TEXTAREA: 1, OPTION: 1, PRE: 1, CODE: 1, INPUT: 1, SELECT: 1, SVG: 1, svg: 1 };
var RE_TRECHO_MATH = /(\$\$[\s\S]+?\$\$|\$[^$\n]+?\$|\\\([\s\S]+?\\\)|\\\[[\s\S]+?\\\])/;
var RE_POTENCIA = /([A-Za-z0-9)\]]+)\^\(?\{?([+\-−]?[A-Za-z0-9.,]+)\}?\)?/g;
function potenciasEmLatex(t) {
  return t.split(RE_TRECHO_MATH).map(function (parte, i) {
    return i % 2 ? parte : parte.replace(RE_POTENCIA, function (m, base, exp) { return '\\(' + base + '^{' + exp.replace('−', '-') + '}\\)'; });
  }).join('');
}
function prepararFormulas(raiz) {
  var doc = raiz.ownerDocument || document, nos = [];
  var w = doc.createTreeWalker(raiz, NodeFilter.SHOW_TEXT, {
    acceptNode: function (n) {
      for (var p = n.parentNode; p && p !== raiz.parentNode; p = p.parentNode) {
        if (p.nodeType !== 1) continue;
        if (TAGS_SEM_FORMULA[p.tagName] || p.isContentEditable || (p.classList && (p.classList.contains('katex') || p.classList.contains('sem-formula')))) return NodeFilter.FILTER_REJECT;
      }
      return /[$^\\]/.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_SKIP;
    }
  });
  while (w.nextNode()) nos.push(w.currentNode);
  nos.forEach(function (n) {
    var t = n.nodeValue;
    if (/R\$/.test(t)) {
      // "R$" vai num elemento à parte: o cifrão do dinheiro não forma par com o de uma fórmula
      var frag = doc.createDocumentFragment();
      t.split(/(R\$)/).forEach(function (p) {
        if (!p) return;
        if (p === 'R$') { var sp = doc.createElement('span'); sp.className = 'sem-formula'; sp.textContent = p; frag.appendChild(sp); }
        else frag.appendChild(doc.createTextNode(potenciasEmLatex(p)));
      });
      n.parentNode.replaceChild(frag, n);
    } else if (/\^/.test(t)) {
      var novo = potenciasEmLatex(t);
      if (novo !== t) n.nodeValue = novo;
    }
  });
}
function formulas(raiz) {
  if (!raiz || !window.renderMathInElement) return;
  prepararFormulas(raiz);
  try {
    renderMathInElement(raiz, {
      delimiters: [{ left: '$$', right: '$$', display: true }, { left: '\\[', right: '\\]', display: true },
        { left: '\\(', right: '\\)', display: false }, { left: '$', right: '$', display: false }],
      ignoredClasses: ['sem-formula', 'katex'], throwOnError: false, strict: false
    });
  } catch (e) { /* fórmula com erro fica como texto */ }
}
(function vigiarFormulas() {
  var pendente = false, rodando = false;
  var obs = new MutationObserver(function () {
    if (rodando || pendente) return;
    pendente = true;
    requestAnimationFrame(function () {
      pendente = false; rodando = true;
      try { formulas(document.getElementById('app')); } finally { obs.takeRecords(); rodando = false; }
      $$('.fundo').forEach(function (f) { rodando = true; try { formulas(f); } finally { obs.takeRecords(); rodando = false; } });
    });
  });
  var ligar = function () { obs.observe(document.body, { childList: true, subtree: true, characterData: true }); };
  window.formulasProntas = function () { formulas(document.getElementById('app')); $$('.fundo').forEach(formulas); };
  if (document.body) ligar(); else document.addEventListener('DOMContentLoaded', ligar);
})();
/** Fórmulas dentro de um impresso (iframe): leva o estilo do KaTeX junto */
function formulasNoImpresso(f) {
  try {
    var d = f.contentDocument;
    if (!d || !d.body) return;
    if (!d.getElementById('katex-css')) {
      var l = d.createElement('link'); l.id = 'katex-css'; l.rel = 'stylesheet'; l.href = KATEX_CSS; d.head.appendChild(l);
    }
    formulas(d.body);
  } catch (e) { }
}

/**
 * Aviso rápido. acao (opcional): { rotulo, fn } vira um botão no aviso (ex.: Desfazer).
 * pergunta (opcional): { texto, opcoes: [{ rotulo, fn }] } — uma linha de botões (ex.: "Como foi?").
 */
function toast(msg, erro, acao, pergunta) {
  var d = document.createElement('div');
  if (erro) d.className = 'erro';
  var linha = document.createElement('div'); linha.className = 't-linha';
  var t = document.createElement('span'); t.textContent = msg; linha.appendChild(t);
  if (acao) {
    d.className += ' com-acao';
    var b = document.createElement('button'); b.type = 'button'; b.textContent = acao.rotulo;
    b.onclick = function () { d.remove(); acao.fn(); };
    linha.appendChild(b);
  }
  d.appendChild(linha);
  if (pergunta) {
    $$('#toast > div.com-pergunta').forEach(function (x) { x.remove(); }); // só uma pergunta por vez
    d.className += ' com-pergunta';
    var q = document.createElement('div'); q.className = 't-pergunta';
    var qt = document.createElement('span'); qt.textContent = pergunta.texto; q.appendChild(qt);
    pergunta.opcoes.forEach(function (o) {
      var ob = document.createElement('button'); ob.type = 'button'; ob.textContent = o.rotulo;
      ob.onclick = function () { d.remove(); o.fn(); };
      q.appendChild(ob);
    });
    d.appendChild(q);
  }
  $('#toast').appendChild(d);
  setTimeout(function () { d.remove(); }, erro ? 7000 : pergunta ? 9000 : acao ? 6000 : 4000);
}

// Leituras recentes ficam guardadas por alguns segundos: voltar a uma tela é instantâneo.
// Qualquer gravação limpa tudo, para nunca mostrar dado velho depois de uma ação.
var LEITURAS = { me: 45, concursos: 86400, listarSimulados: 45, listarUsuarios: 45, listarQuestoes: 45, resultados: 45,
  listarEstrategias: 45, imagemQuestao: 600, relatorioTurma: 45, relatorio: 45, painel: 45, listarSolicitacoes: 45,
  layoutCartao: 600, configuracao: 45, notificacoes: 30 };
var GUARDADO = {};
function limparGuardado() { GUARDADO = {}; }
function call(acao, dados) {
  var seg = LEITURAS[acao];
  if (!seg) { limparGuardado(); return chamar(acao, dados).then(function (r) { limparGuardado(); return r; }); }
  var k = acao + '|' + JSON.stringify(dados || {}), g = GUARDADO[k];
  if (g && Date.now() - g.em < seg * 1000) return g.p.then(function (r) { return JSON.parse(JSON.stringify(r)); });
  var p = chamar(acao, dados);
  GUARDADO[k] = { em: Date.now(), p: p };
  p.catch(function () { if (GUARDADO[k] && GUARDADO[k].p === p) delete GUARDADO[k]; });
  return p.then(function (r) { return JSON.parse(JSON.stringify(r)); });
}
function chamar(acao, dados) {
  return new Promise(function (ok, falha) {
    google.script.run
      .withSuccessHandler(ok)
      .withFailureHandler(function (e) {
        if (msgErro(e).indexOf('SESSAO_EXPIRADA') >= 0) { sair(true); return; }
        falha(e);
      })
      .api(S.token, acao, dados || {});
  });
}
function callFn(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, falha) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(falha);
    r[fn].apply(r, args);
  });
}

/**
 * Abre a imagem escolhida e redesenha num canvas (fundo branco, JPEG).
 * recorte(img) devolve [sx, sy, sw, sh, largura, altura]: o pedaço da imagem e o tamanho final.
 */
function imagemNoCanvas(file, recorte, qualidade) {
  return new Promise(function (ok, falha) {
    var r = new FileReader();
    r.onerror = function () { falha(new Error('Não foi possível ler a imagem.')); };
    r.onload = function () {
      var img = new Image();
      img.onerror = function () { falha(new Error('Arquivo de imagem inválido.')); };
      img.onload = function () {
        var k = recorte(img), c = document.createElement('canvas');
        c.width = k[4]; c.height = k[5];
        var ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, k[0], k[1], k[2], k[3], 0, 0, c.width, c.height);
        var url = c.toDataURL('image/jpeg', qualidade || 0.85);
        ok({ base64: url.split(',')[1], mime: 'image/jpeg', nome: file.name, url: url });
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}
/** Imagem inteira, com o lado maior limitado a maxLado */
function lerImagem(file, maxLado, qualidade) {
  return imagemNoCanvas(file, function (img) {
    var fator = Math.min(1, maxLado / Math.max(img.width, img.height));
    return [0, 0, img.width, img.height, Math.round(img.width * fator), Math.round(img.height * fator)];
  }, qualidade);
}

function iniciar() {

    S.user = r[0]; S.conc = r[1];
    $('#app').innerHTML =
      '<div class="casca"><nav class="menu" id="menu" aria-label="Menu"></nav><div class="conteudo">' +
      '<header class="topo"><div class="marca"><img class="emblema" src="' + LOGO_SIMBOLO + '" alt="MIRA"></div>' +
      '<div class="busca" id="busca"><button class="busca-abrir" aria-label="Buscar">' + icone('busca') + '</button>' +
      '<label class="busca-campo">' + icone('busca') + '<input type="search" id="busca-in" placeholder="' + esc(BUSCA_DICA[S.user.perfil]) + '" autocomplete="off" aria-label="Buscar"></label>' +
      '<div class="busca-res" id="busca-res" role="listbox"></div></div>' +
      '<div class="topo-acoes"><div class="sino" id="sino"><button aria-label="Notificações" aria-haspopup="true" aria-expanded="false">' + icone('notificacoes') + '</button>' +
      '<div class="sino-lista" role="menu"></div></div>' +
      '<div class="usuario" id="usuario"><button aria-haspopup="true" aria-expanded="false">' + avatar(S.user) +
      '<span class="nome">' + esc(S.user.nome) + '<small>' + PERFIL_TXT[S.user.perfil] + '</small></span><span class="seta"></span></button>' +
      '<div class="usuario-menu" role="menu"><button data-u="conta">Minha conta</button><hr><button data-u="sair" class="perigo">Sair</button></div></div></div></header>' +
      '<div id="aviso-senha"></div><main id="main"></main></div></div>';
    ligarBusca();
    atualizarSino();
    var um = $('#usuario');
    $('button', um).onclick = function (e) {
      e.stopPropagation();
      var ab = um.classList.toggle('aberto'); this.setAttribute('aria-expanded', ab ? 'true' : 'false');
      $('#sino').classList.remove('aberto');
    };
    document.addEventListener('click', function () { um.classList.remove('aberto'); });
    $$('[data-u]', um).forEach(function (b) {
      b.onclick = function () { um.classList.remove('aberto'); if (b.getAttribute('data-u') === 'sair') sair(false); else ir('conta'); };
    });
    avisoSenha();
    ir(MENUS[S.user.perfil][0][0]);
  });
}

// ---------------------------------------------------------------- busca e notificações (topo)
var BUSCA_DICA = { ADM: 'Buscar aluno, questão, simulado…', PROFESSOR: 'Buscar questão, aluno, simulado…', ALUNO: 'Buscar simulado ou relatório…' };
function semAcento(t) { return String(t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

/** Fontes da busca, conforme o perfil (as mesmas listas das telas, já filtradas pelo servidor) */
function fontesBusca() {
  var perfil = S.user.perfil;
  var pedidos = perfil === 'ALUNO' ? [call('listarSimulados'), call('resultados')]
    : [call('listarSimulados'), call('resultados'), call('listarQuestoes', {}), perfil === 'ADM' ? call('listarUsuarios') : Promise.resolve([])];
  return Promise.all(pedidos).then(function (r) { return { sims: r[0], res: r[1], qs: r[2] || [], us: r[3] || [] }; });
}

function resultadosBusca(f, q) {
  var t = semAcento(q), tem = function () {
    for (var i = 0; i < arguments.length; i++) if (semAcento(arguments[i]).indexOf(t) >= 0) return true;
    return false;
  };
  var grupos = [], ultimoDe = {};
  f.res.forEach(function (r) { if (!ultimoDe[r.alunoId] || ultimoDe[r.alunoId].criadoEm < r.criadoEm) ultimoDe[r.alunoId] = r; });
  if (S.user.perfil === 'ALUNO') {
    grupos.push(['Relatórios', f.res.filter(function (r) { return tem(r.simulado, r.codigo); }).slice(0, 6).map(function (r) {
      return { ic: 'relatorio', t: r.simulado, s: 'Nota final ' + num(r.notaFinal) + ' · ' + dataBr(r.criadoEm), ir: ['relatorio', { id: r.id }] };
    })]);
    grupos.push(['Simulados', f.sims.filter(function (x) { return !x.resultadoId && tem(x.titulo, x.codigo); }).slice(0, 6).map(function (x) {
      return { ic: 'avaliacao', t: x.titulo, s: x.status === 'ABERTO' ? 'Aberto: envie a foto do cartão' : 'Ainda não aberto',
        ir: x.status === 'ABERTO' ? ['enviar', { simuladoId: x.id }] : ['meus'] };
    })]);
  } else {
    var pessoas = S.user.perfil === 'ADM'
      ? f.us.filter(function (u) { return tem(u.nome, u.matricula, u.email, u.turma); }).map(function (u) {
          return { ic: u.perfil === 'ALUNO' ? 'alunos' : 'perfil', t: u.nome,
            s: (PERFIL_TXT[u.perfil] || '') + (u.turma ? ' · Turma ' + u.turma : '') + (ultimoDe[u.id] ? ' · abrir último relatório' : ''),
            ir: ultimoDe[u.id] ? ['relatorio', { id: ultimoDe[u.id].id }] : ['usuarios'] };
        })
      : Object.keys(ultimoDe).map(function (k) { return ultimoDe[k]; }).filter(function (r) { return tem(r.aluno, r.matricula, r.turma); }).map(function (r) {
          return { ic: 'alunos', t: r.aluno, s: 'Turma ' + r.turma + ' · último relatório', ir: ['relatorio', { id: r.id }] };
        });
    grupos.push([S.user.perfil === 'ADM' ? 'Pessoas' : 'Alunos', pessoas.slice(0, 6)]);
    grupos.push(['Questões', f.qs.filter(function (x) { return tem(x.id, x.disciplina, x.conteudo, semFiguras(x.enunciado)); }).slice(0, 6).map(function (x) {
      return { ic: 'biblioteca', t: semFiguras(x.enunciado).slice(0, 80) || x.id, s: x.disciplina + (x.conteudo ? ' · ' + x.conteudo : '') + ' · ' + ((STATUS_Q[x.status] || [x.status])[0]), q: x };
    })]);
    grupos.push(['Simulados', f.sims.filter(function (x) { return tem(x.titulo, x.codigo); }).slice(0, 6).map(function (x) {
      return { ic: 'avaliacao', t: x.titulo, s: x.codigo + ' · ' + x.total + ' questões', ir: ['resultados', { simuladoId: x.id }] };
    })]);
  }
  return grupos.filter(function (g) { return g[1].length; });
}

function ligarBusca() {
  var box = $('#busca'), inp = $('#busca-in'), res = $('#busca-res'), fontes = null, itens = [], foco = -1, espera;
  var fechar = function () { box.classList.remove('aberta'); foco = -1; };
  var escolher = function (it) {
    fechar(); inp.value = '';
    if (it.q) verQuestao(it.q, function () { if (S.rota === 'questoes') ir('questoes', S.params); });
    else ir(it.ir[0], it.ir[1]);
  };
  var mostrar = function () {
    var q = inp.value.trim();
    if (q.length < 2) { res.innerHTML = '<div class="nada">Digite pelo menos 2 letras.</div>'; itens = []; return; }
    if (!fontes) { carregando(res, 'Buscando…'); }
    (fontes || (fontes = fontesBusca())).then(function (f) {
      if (inp.value.trim() !== q) return;
      var grupos = resultadosBusca(f, q); itens = []; foco = -1;
      res.innerHTML = grupos.length ? grupos.map(function (g) {
        return '<h4>' + esc(g[0]) + '</h4>' + g[1].map(function (it) {
          itens.push(it);
          return '<button role="option" data-i="' + (itens.length - 1) + '">' + icone(it.ic) + '<span>' + esc(it.t) + '<small>' + esc(it.s) + '</small></span></button>';
        }).join('');
      }).join('') : '<div class="nada">Nada encontrado para "' + esc(q) + '".</div>';
      $$('button', res).forEach(function (b) { b.onclick = function () { escolher(itens[+b.getAttribute('data-i')]); }; });
    }).catch(function (e) { fontes = null; res.innerHTML = '<div class="nada">' + esc(msgErro(e)) + '</div>'; });
  };
  inp.onfocus = function () { box.classList.add('aberta'); mostrar(); };
  inp.oninput = function () { box.classList.add('aberta'); clearTimeout(espera); espera = setTimeout(mostrar, 180); };
  inp.onkeydown = function (e) {
    var bs = $$('button', res);
    if (e.key === 'Escape') { fechar(); inp.blur(); }
    else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && bs.length) {
      e.preventDefault(); foco = (foco + (e.key === 'ArrowDown' ? 1 : -1) + bs.length) % bs.length;
      bs.forEach(function (b, i) { b.classList.toggle('foco', i === foco); }); bs[foco].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && itens.length) { e.preventDefault(); escolher(itens[foco >= 0 ? foco : 0]); }
  };
  $('.busca-abrir', box).onclick = function (e) { e.stopPropagation(); box.classList.add('aberta'); inp.focus(); };
  box.addEventListener('click', function (e) { e.stopPropagation(); });
  document.addEventListener('click', fechar);
  // dados novos depois de qualquer gravação: a próxima busca recarrega
  box.addEventListener('focusin', function () { if (!Object.keys(GUARDADO).length) fontes = null; });
}

/** O aluno abriu Missões: as estratégias que estão lá deixam de contar como novas no sino (neste aparelho) */
function marcarEstrategiasVistas(es) {
  var chave = 'mira_vistas_' + S.user.id;
  try {
    var v = JSON.parse(localStorage.getItem(chave) || '[]');
    es.forEach(function (e) { if (v.indexOf(e.id) < 0) v.push(e.id); });
    localStorage.setItem(chave, JSON.stringify(v));
  } catch (e) { }
  atualizarSino();
}
/** Sino: pendências do perfil. Aluno: estratégias já vistas não contam (guardadas neste aparelho). */
function atualizarSino() {
  var box = $('#sino'); if (!box) return;
  var chaveVistas = 'mira_vistas_' + S.user.id, vistas = {};
  try { (JSON.parse(localStorage.getItem(chaveVistas) || '[]')).forEach(function (id) { vistas[id] = 1; }); } catch (e) { }
  call('notificacoes').then(function (itens) {
    itens = itens.map(function (it) {
      if (it.ids) { var novas = it.ids.filter(function (id) { return !vistas[id]; }); it.n = novas.length; it.titulo = it.n === 1 ? 'Missões novas de 1 disciplina' : 'Missões novas de ' + it.n + ' disciplinas'; }
      return it;
    }).filter(function (it) { return it.n > 0; });
    var total = itens.reduce(function (a, it) { return a + it.n; }, 0);
    var btn = $('button', box);
    var b = $('.bolha', box); if (b) b.remove();
    if (total) btn.insertAdjacentHTML('beforeend', '<span class="bolha">' + (total > 99 ? '99+' : total) + '</span>');
    btn.setAttribute('aria-label', total ? 'Notificações: ' + total + ' pendente(s)' : 'Notificações');
    $('.sino-lista', box).innerHTML = '<h4>Notificações</h4>' + (itens.length ? itens.map(function (it, i) {
      return '<button data-i="' + i + '"><span class="n">' + it.n + '</span><span><b>' + esc(it.titulo) + '</b><span>' + esc(it.texto) + '</span></span></button>';
    }).join('') : '<div class="nada">Tudo em dia. Nada pedindo a sua atenção agora.</div>');
    $$('.sino-lista button', box).forEach(function (bt) {
      bt.onclick = function () {
        var it = itens[+bt.getAttribute('data-i')];
        if (it.ids) { try { localStorage.setItem(chaveVistas, JSON.stringify(Object.keys(vistas).concat(it.ids))); } catch (e) { } }
        box.classList.remove('aberto'); ir(it.rota, it.params);
      };
    });
  }).catch(function () {});
  if (!box.ligado) {
    box.ligado = true;
    $('button', box).onclick = function (e) {
      e.stopPropagation(); var ab = box.classList.toggle('aberto'); this.setAttribute('aria-expanded', ab ? 'true' : 'false');
      $('#usuario').classList.remove('aberto');
    };
    box.addEventListener('click', function (e) { e.stopPropagation(); });
    document.addEventListener('click', function () { box.classList.remove('aberto'); });
  }
}

/** Senha provisória: o usuário navega normalmente, mas vê a sugestão de criar a própria senha */
function avisoSenha() {
  var box = $('#aviso-senha'); if (!box) return;
  var adiado = false;
  try { adiado = sessionStorage.getItem('mira_senha_depois') === S.user.id; } catch (e) { }
  if (!S.user.trocarSenha || adiado || S.rota === 'conta') { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="aviso azul aviso-senha nao-imprimir"><div><b>Você está usando uma senha provisória.</b> ' +
    'Para sua segurança, crie uma senha só sua.</div><div class="acoes"><button class="btn peq pri" id="as-criar">Criar minha senha</button>' +
    '<button class="btn peq disc" id="as-depois">Agora não</button></div></div>';
  $('#as-criar').onclick = function () { ir('conta'); };
  $('#as-depois').onclick = function () {
    try { sessionStorage.setItem('mira_senha_depois', S.user.id); } catch (e) { }
    box.innerHTML = '';
  };
}

function ir(rota, params) {
  S.rota = rota; S.params = params || {};
  var menu = MENUS[S.user.perfil];
  $('#menu').innerHTML = '<img class="menu-logo" src="' + LOGO_EMBLEMA_BRANCO + '" alt="MIRA">' + menu.map(function (m) {
    var ativo = m[0] === rota || (rota === 'relatorio' && (m[0] === 'resultados' || (S.user.perfil === 'ALUNO' && m[0] === 'meus'))) ||
      (rota === 'enviar' && (m[0] === 'meus' || m[0] === 'simulados'));
    var ic = m[0] === 'painel' ? 'inicio' : ICONE_ROTA[m[0]];
    return '<button data-r="' + m[0] + '" class="' + (ativo ? 'ativo' : '') + '">' + icone(ic) + '<span>' + esc(m[1]) + '</span></button>';
  }).join('');
  $$('#menu button').forEach(function (b) { b.onclick = function () { ir(b.getAttribute('data-r')); }; });
  avisoSenha();
  atualizarSino();
  var main = $('#main');
  window.scrollTo(0, 0);
  return Promise.resolve().then(function () { return VIEWS[rota](main, S.params); })
    .catch(function (e) { main.innerHTML = caixaErro(e); });
}

function cabPag(titulo, sub, acoes) {
  return '<div class="cab-pag"><div><h1>' + esc(titulo) + '</h1>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>' +
    (acoes ? '<div class="acoes nao-imprimir">' + acoes + '</div>' : '') + '</div>';
}

// =====================================================================
// VIEWS
// =====================================================================
var VIEWS = {};

// ---------------------------------------------------------------- minha conta
VIEWS.conta = function (m) {
  var u = S.user;
  var dados = function (rot, v) { return v ? '<div class="dado"><span>' + rot + '</span>' + esc(v) + '</div>' : ''; };
  m.innerHTML = cabPag('Minha conta') + '<div class="grade-2"><div class="card"><h2>Dados</h2>' +
    '<div class="perfil-foto">' + avatar(u, 'grande') + '<div><b>' + esc(u.nome) + '</b><div class="mut peq">' + PERFIL_TXT[u.perfil] + '</div>' +
    '<div class="foto-acoes"><label class="btn peq"><input type="file" id="ft-in" accept="image/*">' + (u.fotoUrl ? 'Trocar foto' : 'Colocar foto') + '</label>' +
    (u.fotoUrl ? '<button class="btn peq disc" id="ft-rem">Remover</button>' : '') + '</div></div></div>' +
    dados('E-mail', u.email) + dados('Matrícula', u.matricula) + dados('Turma', u.turma) + dados('Turmas', u.turmas) + dados('Disciplinas', u.disciplinas) + '</div>' +
    '<form class="card" id="fs"><h2>' + (u.trocarSenha ? 'Criar minha senha' : 'Trocar senha') + '</h2>' +
    (u.trocarSenha ? '<p class="mut peq" style="margin-top:0">Você está usando a senha provisória que recebeu. Crie uma senha só sua.</p>' : '') +
    '<label class="campo"><span>' + (u.trocarSenha ? 'Senha provisória (a que você recebeu)' : 'Senha atual') + '</span><input type="password" id="s-a" required autocomplete="current-password"></label>' +
    '<label class="campo"><span>Nova senha (mínimo 8 caracteres)</span><input type="password" id="s-n" required minlength="8" autocomplete="new-password"></label>' +
    '<label class="campo"><span>Repita a nova senha</span><input type="password" id="s-n2" required minlength="8" autocomplete="new-password"></label>' +
    '<button class="btn pri" id="s-ok">Salvar nova senha</button></form></div>' +
    '<div class="card sobre"><img src="' + LOGO_EMBLEMA + '" alt=""><div><h3 style="margin-bottom:2px">Sobre o MIRA</h3>' +
    '<p class="mut peq" style="margin:0">Monitoramento Inteligente de Resultados e Aprendizagem.<br>Desenvolvido por Carol J Castro.</p></div></div>';
  var trocarAvatar = function () {
    var b = $('#usuario .avatar'); if (b) b.outerHTML = avatar(S.user);
    VIEWS.conta(m);
  };
  $('#ft-in').onchange = function (e) {
    var f = e.target.files[0]; if (!f) return;
    var rot = this.parentNode;
    rot.classList.add('ocupado');
    fotoQuadrada(f, 320).then(function (img) { return call('salvarFoto', { base64: img.base64, mime: img.mime }); })
      .then(function (r) { S.user.fotoUrl = r.fotoUrl; toast('Foto atualizada.'); trocarAvatar(); })
      .catch(function (er) { rot.classList.remove('ocupado'); toast(msgErro(er), true); });
  };
  if ($('#ft-rem')) $('#ft-rem').onclick = function () {
    ocupado(this, 'Removendo…', function () { return call('salvarFoto', { remover: true }); })
      .then(function () { S.user.fotoUrl = null; toast('Foto removida.'); trocarAvatar(); }).catch(function () {});
  };
  $('#fs').onsubmit = function (e) {
    e.preventDefault();
    var nova = $('#s-n').value;
    if (nova !== $('#s-n2').value) { toast('As duas senhas novas não são iguais. Digite de novo.', true); $('#s-n2').focus(); return; }
    ocupado($('#s-ok'), 'Salvando…', function () { return call('trocarSenha', { atual: $('#s-a').value, nova: nova }); })
      .then(function () {
        var era = S.user.trocarSenha;
        S.user.trocarSenha = false;
        toast(era ? 'Senha criada. A partir de agora, use a sua senha nova.' : 'Senha alterada.');
        VIEWS.conta(m);
      }).catch(function () {});
  };
};

/** Quadrado do meio da imagem (foto de perfil), com no máximo lado × lado */
function fotoQuadrada(file, lado) {
  return imagemNoCanvas(file, function (img) {
    var q = Math.min(img.width, img.height), t = Math.min(lado, q);
    return [(img.width - q) / 2, (img.height - q) / 2, q, q, t, t];
  });
}

  <script>
/* =====================================================================
   MIRA — interface: Início da coordenação e do professor, e usuários
   (parte do App; a ordem dos arquivos está em Index.html)
   ===================================================================== */
// ---------------------------------------------------------------- Início (coordenação e professor)
/** Cabeçalho acolhedor dos painéis: data por extenso e "Olá, primeiro nome" */
function cabSaudacao(acoes, sub) {
  var hoje = new Date(), dias = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'],
    meses = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  var nome = String(S.user.nome || '').trim().split(/\s+/)[0];
  return '<div class="cab-pag"><div><p class="sobre-tit">' + dias[hoje.getDay()] + ', ' + hoje.getDate() + ' de ' + meses[hoje.getMonth()] + '</p>' +
    '<h1>Olá, ' + esc(nome) + '</h1>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>' + (acoes ? '<div class="acoes nao-imprimir">' + acoes + '</div>' : '') + '</div>';
}

/** "Seu próximo passo": uma caixa com a ação mais importante agora (o mesmo bloco do Início do aluno) */
function caixaProximo(ic, titulo, texto, botao) {
  return '<div class="proximo nao-imprimir"><span class="chip">' + icone(ic) + '</span><div class="t"><b>' + esc(titulo) + '</b>' +
    '<span>' + esc(texto) + '</span></div>' + (botao || '') + '</div>';
}
/** Cartão de destaque sem nota (antes do primeiro cartão corrigido) */
function destaqueVazio(titulo, texto, botao) {
  return '<section class="destaque"><div class="destaque-pend"><span class="grande">' + icone('avaliacao', 'ic') + '</span><div class="t">' +
    '<h2>' + esc(titulo) + '</h2><p>' + esc(texto) + '</p></div>' + (botao || '') + '</div></section>';
}
VIEWS.painel = function (m) {
  if (S.user.perfil === 'ALUNO') return VIEWS.painelAluno(m);
  if (S.user.perfil === 'PROFESSOR') return VIEWS.painelProf(m);
  carregando(m);
  return call('painel').then(function (d) {
    var h = cabSaudacao('', 'Como está o MIRA e o que fazer agora');
    var paraCurar = (d.questoesPorStatus.PENDENTE || 0) + (d.questoesPorStatus.AJUSTE || 0);
    var pend = [];
    if (d.pedidosAcesso) pend.push([d.pedidosAcesso, 'Pedidos de acesso', 'Alunos aguardando a sua aprovação.', 'ped']);
    if (d.questoesPorStatus.VALIDADA) pend.push([d.questoesPorStatus.VALIDADA, 'Questões para aprovar', 'Já validadas pelos professores.', 'val']);
    if (d.estrategiasPendentes) pend.push([d.estrategiasPendentes, 'Estratégias aguardando o OK', 'Sugestões antigas para os professores conferirem.', 'est']);
    var dc = diasDesdeCopia(d.ultimaCopia);
    var da = diasDesdeCopia(d.ultimaCopiaAuto), autoOk = !!window.MIRA_SUPABASE && d.ultimaCopiaAuto && da <= DIAS_COPIA_AUTO;
    if (window.MIRA_SUPABASE && d.ultimaCopiaAuto && !autoOk) pend.push([da + 'd', 'Cópia automática atrasada',
      'A última cópia automática no Drive foi há ' + da + ' dias. Enquanto isso, baixe uma cópia manual.', 'copia']);
    if (dc >= (autoOk ? DIAS_COPIA_COM_AUTO : DIAS_COPIA)) pend.push([d.ultimaCopia ? dc + 'd' : '!', autoOk ? 'Cópia de segurança do mês' : 'Cópia de segurança da semana',
      d.ultimaCopia ? 'A última foi há ' + dc + ' dias. Baixe uma nova e guarde no seu computador.' : 'Você ainda não baixou nenhuma. Baixe e guarde no seu computador.', 'copia']);
    if (paraCurar) pend.push([paraCurar, 'Questões para a curadoria', d.questoesPorStatus.AJUSTE ?
      d.questoesPorStatus.AJUSTE + ' com ajuste pedido pelo professor.' : 'Peça a curadoria e importe o resultado.', 'q']);

    // cartão roxo: o último simulado (como a nota do aluno)
    var u = d.ultimoSimulado, aprovadas = d.questoesPorStatus.APROVADA || 0;
    h += u ? notaDestaque(u.media, 'nota média', [

/** Início do professor: o último simulado na matéria dele, o próximo passo, as questões dele e os temas mais errados */
VIEWS.painelProf = function (m) {
  carregando(m);
  return Promise.all([call('resultados'), call('listarQuestoes', {}), call('temasUltimoSimulado', {}).catch(function () { return {}; })]).then(function (r) {
    var rs = r[0], qs = r[1], temas = r[2] || {};
    var por = {}; qs.forEach(function (q) { por[q.status] = (por[q.status] || 0) + 1; });
    var minhas = S.user.disciplinas ? csv(S.user.disciplinas).join(', ') : 'todas as disciplinas';
    var h = cabSaudacao('', 'Como suas turmas estão em ' + esc(minhas) + ' e o que fazer agora');

    // cartão roxo: o último simulado, só na matéria do professor
    if (rs.length) {
      var simId = rs[0].simuladoId, us = rs.filter(function (x) { return x.simuladoId === simId; });
      var ac = 0, tot = 0, aptos = 0;
      us.forEach(function (x) { ac += Number(x.acertos) || 0; tot += Number(x.total) || 0; if (x.apto) aptos++; });
      h += notaDestaque(tot ? Math.round(1000 * ac / tot) / 10 : 0, 'acerto médio', [
        ['relatorio', String(us.length), us.length === 1 ? 'cartão na sua matéria' : 'cartões na sua matéria'],
        ['foco', aptos + ' de ' + us.length, 'na mediana da sua matéria'],
        ['biblioteca', String(por.APROVADA || 0), 'questões suas aprovadas']
      ], '<button class="btn verde peq" id="pp-res">Ver resultados</button>', 'Último simulado: ' + rs[0].simulado);
    } else {
      h += destaqueVazio('Ainda sem cartões corrigidos', 'Quando os alunos enviarem o cartão, o desempenho na sua matéria aparece aqui.', '');
    }

    // seu próximo passo
    var piores = [];
    Object.keys(temas).forEach(function (disc) {
      (temas[disc].temas || []).forEach(function (t) { if (t.pct < 60) piores.push({ disciplina: disc, tema: t.tema, pct: t.pct }); });
    });
    piores.sort(function (a, b) { return a.pct - b.pct; });
    if (por.ANALISE_PROF) h += caixaProximo('relatorio', 'Seu próximo passo: conferir ' + por.ANALISE_PROF + (por.ANALISE_PROF === 1 ? ' relatório de curadoria' : ' relatórios de curadoria'),
      'A curadoria terminou: dê o De acordo ou peça alteração.', '<button class="btn pri" id="pp-analise">Conferir agora</button>');
    else if (piores.length) h += caixaProximo('foco', 'Seu próximo passo: questões de ' + piores[0].tema,
      'Foi o tema mais errado no último simulado (' + num(piores[0].pct) + '% de acerto). Escreva questões novas: ele volta no próximo simulado.',
      '<button class="btn pri" data-ir="questoes">Escrever questões</button>');
    else h += caixaProximo('conquista', 'Tudo em dia', 'Nenhuma questão esperando a sua análise.', '<button class="btn pri" data-ir="questoes">Abrir minhas questões</button>');

    // cartões com ícone, como no Início do aluno
    var cardQ = '<div class="card ini-card"><div class="ini-cab"><h2>' + icone('biblioteca') + 'Minhas questões</h2><span class="mut peq">' + qs.length + ' no total</span></div>' +
      '<div class="ini-nums"><div><b>' + (por.APROVADA || 0) + '</b><span>aprovadas</span></div>' +
      '<div><b>' + (por.ANALISE_PROF || 0) + '</b><span>para você analisar</span></div>' +
      '<div><b>' + ((por.PENDENTE || 0) + (por.AJUSTE || 0) + (por.VALIDADA || 0)) + '</b><span>em andamento</span></div></div>' +
      '<button class="btn" data-ir="questoes">Abrir minhas questões</button></div>';
    var discs = Object.keys(temas), d0 = discs.length ? temas[discs[0]] : null;
    var cardT = '<div class="card ini-card"><div class="ini-cab"><h2>' + icone('turmas') + 'Temas do último simulado</h2>' +
      (d0 ? '<span class="mut peq">' + esc(discs[0]) + ' · ' + d0.alunos + (d0.alunos === 1 ? ' aluno' : ' alunos') + '</span>' : '') + '</div>' +
      (d0 && d0.temas.length ? '<p class="mut peq ini-txt">Os mais errados primeiro.</p>' + d0.temas.slice(0, 3).map(function (t) {
        return barra(t.tema, t.pct, t.acertos + '/' + t.total);
      }).join('') : '<p class="mut peq ini-txt">Ainda não há simulado corrigido nas suas turmas.</p>') +
      '<button class="btn" data-ir="turmas">Abrir o mapa da turma</button></div>';
    h += '<div class="grade-2 ini-cards">' + cardQ + cardT + '</div>';
    m.innerHTML = h;
    ligarIr(m);
    if ($('#pp-res', m)) $('#pp-res', m).onclick = function () { ir('resultados', { simuladoId: rs[0].simuladoId }); };
    if ($('#pp-analise', m)) $('#pp-analise', m).onclick = function () { ir('questoes', { status: 'ANALISE_PROF' }); };
  });
};

// ---------------------------------------------------------------- usuários (ADM)
VIEWS.usuarios = function (m) {

          '<div class="rolagem"><table class="tab"><tr><th></th><th>Nome</th><th>E-mail</th><th>Matrícula</th><th>Turma</th><th>Responsável</th><th>Pedido em</th></tr>' +
          ps.map(function (p) {
            return '<tr><td><input type="checkbox" class="pd" data-id="' + esc(p.id) + '"' + (sel[p.id] ? ' checked' : '') + '></td>' +
              '<td><b>' + esc(p.nome) + '</b></td><td class="peq">' + esc(p.email) + '</td><td>' + esc(p.matricula || '—') + '</td><td>' + esc(p.turma || '—') + '</td>' +
              '<td class="peq">' + esc(p.responsavelNome || '') + '<div class="mut">' + esc(p.responsavelEmail || '') + '</div></td><td class="peq">' + dataBr(p.criadoEm) + '</td></tr>';
          }).join('') + '</table></div>' +
          '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px">' +

        var decidir = function (btn, decisao) {
          var ids = Object.keys(sel);
          ocupado(btn, decisao === 'APROVAR' ? 'Aprovando…' : 'Recusando…', function () {
            return call('decidirSolicitacoes', { ids: ids, decisao: decisao, enviarEmail: true });
          }).then(function (r) {
            if (r.erros.length) toast('Não processados: ' + r.erros.join(' · '), true);
            if (decisao === 'APROVAR' && r.feitos.length) {
              var semEmail = r.feitos.filter(function (f) { return !f.emailEnviado; });
              modal(topoModal(r.feitos.length + ' acesso(s) liberado(s)') +

                  return '<tr><td>' + esc(f.nome) + '</td><td class="peq">' + esc(f.login) + '</td><td><code>' + esc(f.senha) + '</code></td><td>' +

                }).join('') + '</table></div>', true);
            } else if (r.feitos.length) toast(r.feitos.length + ' pedido(s) recusado(s).');

          }).catch(function () {});
        };
        $('#pd-apr').onclick = function () { decidir(this, 'APROVAR'); };
        $('#pd-rec').onclick = function () { var b = this; confirmar('Recusar ' + Object.keys(sel).length + ' pedido(s)? O aluno não é avisado.', 'Recusar').then(function () { decidir(b, 'RECUSAR'); }); };
      };

          : perf === 'PROFESSOR' ? '<td>' + esc(u.nome) + inativo + '</td><td class="peq">' + esc(u.email) + '</td><td class="peq">' + esc(u.disciplinas || 'Todas') + '</td><td class="peq">' + esc(u.turmas || '—') + '</td>'

        return '<tr class="clic" data-id="' + u.id + '">' + c + '<td class="mut peq">editar</td></tr>';
      }).join('') + '</table></div>';
    $$('tr.clic', l).forEach(function (tr) {
      tr.onclick = function () { formUsuario(todos.filter(function (u) { return u.id === tr.getAttribute('data-id'); })[0], carregar); };
    });

  var carregar = function () {

    call('listarUsuarios').then(function (us) { todos = us; desenhar(); });

  $('#imp').onclick = function () { importarAlunos(carregar); };
  carregar();
  carregarPedidos();

// ---------------------------------------------------------------- figuras no enunciado
/** Enunciado com as figuras no lugar de [FIGURA n]; as não marcadas vão para o fim.
 *  urls: lista na ordem das figuras (null = ainda carregando); total: quantas figuras a questão tem. */
function enunciadoHtml(texto, urls, total, classe) {
  texto = String(texto || '').replace(/\[FIGURA\]/gi, '[FIGURA 1]');
  urls = urls || [];
  total = Math.max(total || 0, urls.length);
  var usadas = {}, h = '';
  var fig = function (n) {
    usadas[n] = true;
    return imgSrc(urls[n]) ? '<img class="figura" src="' + imgSrc(urls[n]) + '" alt="Figura ' + (n + 1) + '">'
      : '<div class="fig-ph">Figura ' + (n + 1) + (n < total ? ' (carregando…)' : ' (não encontrada)') + '</div>';
  };
  String(texto).split(/\[FIGURA\s+(\d+)\]/i).forEach(function (p, i) {
    if (i % 2 === 0) { p = p.replace(/^\n+|\n+$/g, ''); if (p.trim()) h += '<div class="' + (classe || 'enun') + '">' + esc(p) + '</div>'; }
    else h += fig(Number(p) - 1);
  });
  for (var n = 0; n < total; n++) if (!usadas[n]) h += fig(n);
  return h;
}
/** Texto sem as marcações de figura (para listas e relatórios sem imagem) */
function semFiguras(t) { return String(t || '').replace(/\[FIGURA\s*(\d*)\]/gi, function (m, n) { return '(figura ' + (n || 1) + ')'; }); }

// ---------------------------------------------------------------- colar alternativas
/** Procura as marcações (A) … (E) num texto colado.
 *  Aceita (A), [A], A), a), A. ou A - no começo da linha, e (A) ou [A] no meio da linha.
 *  Devolve { antes, alts } ou null. minimo: quantas letras seguidas, a partir da primeira, precisam aparecer. */
function separarAlternativas(texto, letras, minimo, primeira) {
  // primeiro só marcações no começo da linha (mais seguro); depois aceita também (A) no meio da linha
  return separarAlternativas_(texto, letras, minimo, primeira, false) || separarAlternativas_(texto, letras, minimo, primeira, true);
}
function separarAlternativas_(texto, letras, minimo, primeira, aceitaMeio) {
  texto = String(texto || '').replace(/\r/g, '');
  var ini = primeira ? letras.indexOf(primeira) : 0;
  var achados = [], pos = 0;
  for (var k = ini; k < letras.length; k++) {
    var L = letras[k];
    var reLinha = new RegExp('(^|\\n)[ \\t]*[\\(\\[]?' + L + '[\\)\\]\\.:–-][ \\t]*', 'gi');
    var reMeio = new RegExp('(^|\\s)[\\(\\[]' + L + '[\\)\\]][ \\t]*', 'gi');
    var melhor = null;
    (aceitaMeio ? [reLinha, reMeio] : [reLinha]).forEach(function (re) {
      re.lastIndex = pos;
      var m = re.exec(texto);
      if (m && (!melhor || m.index < melhor.index)) melhor = { index: m.index + m[1].length, fim: m.index + m[0].length };
    });
    if (!melhor) break;
    achados.push({ letra: L, index: melhor.index, fim: melhor.fim });
    pos = melhor.fim;
  }
  if (achados.length < minimo) return null;
  var alts = {};
  achados.forEach(function (a, i) {
    var fim = i + 1 < achados.length ? achados[i + 1].index : texto.length;
    alts[a.letra] = texto.slice(a.fim, fim).replace(/\s+/g, ' ').trim();
  });
  return { antes: texto.slice(0, achados[0].index).replace(/\s+$/, ''), alts: alts };
}

// ---------------------------------------------------------------- origem da questão
var PROVAS_SUGERIDAS = ['EsPCEx', 'AFA', 'EFOMM', 'Escola Naval', 'EEAR', 'ESA', 'IME', 'ITA', 'ENEM', 'Fuvest', 'Unicamp', 'UnB', 'PAS-UnB'];
/** "Autoral" · "EsPCEx 2024" · "Livro: ..." · "Outra: ..." → { tipo, prova, ano, texto } */
function partesOrigem(txt) {
  txt = String(txt || '').trim();
  if (!txt) return { tipo: '' };
  if (txt === 'Autoral') return { tipo: 'AUTORAL' };
  if (/^Livro: /.test(txt)) return { tipo: 'LIVRO', texto: txt.slice(7) };
  if (/^Outra: /.test(txt)) return { tipo: 'OUTRA', texto: txt.slice(7) };
  var m = txt.match(/^(.*?)\s+((?:19|20)\d{2})$/);
  return { tipo: 'PROVA', prova: m ? m[1] : txt, ano: m ? m[2] : '' };
}
function campoOrigem(txt) {
  var o = partesOrigem(txt);
  var op = function (v, rot) { return '<label class="origem-op"><input type="radio" name="q-orig" value="' + v + '"' + (o.tipo === v ? ' checked' : '') + '> ' + rot + '</label>'; };
  return '<div class="campo"><span class="mut peq" style="font-weight:600">Origem da questão *</span>' +
    '<div class="origem-ops">' + op('AUTORAL', 'Autoral (criada por mim)') + op('PROVA', 'De prova ou vestibular') +

    '<label class="campo" style="max-width:140px"><span>Ano</span><input type="text" id="q-orig-ano" inputmode="numeric" maxlength="4" placeholder="Ex.: 2024" value="' + esc(o.ano || '') + '"></label></div>' +
    '<datalist id="q-orig-lista">' + PROVAS_SUGERIDAS.map(function (p) { return '<option value="' + esc(p) + '">'; }).join('') + '</datalist>' +
    '<label class="campo" id="q-orig-outro"' + (o.tipo === 'LIVRO' || o.tipo === 'OUTRA' ? '' : ' hidden') + '><span id="q-orig-outro-rot">' +
    (o.tipo === 'OUTRA' ? 'De onde é a questão?' : 'Livro ou apostila (título e autor)') + '</span>' +

    };

function lerOrigem(el) {
  var r = $('input[name=q-orig]:checked', el);
  if (!r) { toast('Informe a origem da questão: autoral ou de qual prova ela é.', true); return null; }

  }
  return o;
}
function rotuloOrigem(txt) { return !txt ? '' : txt === 'Autoral' ? 'Questão autoral' : txt; }

// ---------------------------------------------------------------- formulário da questão
// ---------------------------------------------------------------- temas do último simulado (mais errados e mais acertados)
var CORTE_REAVALIAR = 60;
/**
 * Um cartão por disciplina com os temas mais errados e mais acertados no último simulado que cobrou a disciplina.
 * dados: resposta de temasUltimoSimulado. op.botao: mostra "+ Questão" nos temas errados (tela de questões).
 */
function painelTemas(dados, discs, op) {
  op = op || {};
  var lista = discs.filter(function (d) { return dados[d] && dados[d].temas.length; });
  if (!lista.length) return '<p class="mut peq" style="margin:0">Ainda não há simulado corrigido' + (op.vazio || '') + '.</p>';
  return '<div class="temas-grade">' + lista.map(function (d) {
    var x = dados[d], ts = x.temas;
    var errados = ts.filter(function (t) { return t.pct < 70; }).slice(0, 4);
    var acertados = ts.filter(function (t) { return t.pct >= 70; }).slice().reverse().slice(0, 3);
    var linha = function (t, erro) {
      var reav = erro && t.pct < CORTE_REAVALIAR;
      return '<li><div class="tm-lin"><span class="tm-nome">' + esc(t.tema) + '</span><b class="tm-pct' + (erro ? ' erro' : ' ok') + '">' + num(t.pct) + '%</b></div>' +
        '<div class="tm-barra"><i class="' + (erro ? 'erro' : 'ok') + '" style="width:' + Math.max(3, t.pct) + '%"></i></div>' +
        '<div class="tm-pe"><span>' + t.acertos + ' de ' + t.total + ' respostas certas</span>' + (reav ? '<span class="tm-volta">volta no próximo</span>' : '') +
        (erro && op.botao ? '<button type="button" class="btn peq tm-nova" data-d="' + esc(d) + '" data-t="' + esc(t.tema) + '">+ Questão</button>' : '') + '</div></li>';
    };
    return '<section class="tm-disc"><div class="tm-cab"><h3>' + esc(d) + '</h3><span class="mut peq">' + esc(x.simulado) + ' · ' + x.alunos + (x.alunos === 1 ? ' aluno' : ' alunos') + '</span></div>' +
      '<div class="tm-cols"><div><h4 class="tm-tit erro">Mais errados</h4>' + (errados.length ? '<ul class="tm-lista">' + errados.map(function (t) { return linha(t, true); }).join('') + '</ul>'
        : '<p class="mut peq">Nenhum tema abaixo de 70%. Muito bem!</p>') + '</div>' +
      '<div><h4 class="tm-tit ok">Mais acertados</h4>' + (acertados.length ? '<ul class="tm-lista">' + acertados.map(function (t) { return linha(t, false); }).join('') + '</ul>'
        : '<p class="mut peq">Nenhum tema com 70% ou mais.</p>') + '</div></div></section>';
  }).join('') + '</div>';
}

function formQuestao(q) {
  var c = conc('ESPCEX');
  var discs = disciplinasDe('ESPCEX');
  if (S.user.perfil === 'PROFESSOR' && S.user.disciplinas) {
    var minhas = csv(S.user.disciplinas);
    discs = discs.filter(function (d) { return minhas.indexOf(d) >= 0; });
  }
  q = q || {};
  var alt = q.alternativas || {};
  var md = modal(topoModal(q.id ? 'Editar questão ' + q.id : 'Nova questão') +
    '<form id="fq">' +
    '<div class="linha"><label class="campo"><span>Concurso</span><select disabled><option>' + esc(c.nome) + '</option></select></label>' +
    '<label class="campo"><span>Disciplina *</span><select id="q-disc" required>' +
    discs.map(function (d) { return '<option' + (d === q.disciplina ? ' selected' : '') + '>' + esc(d) + '</option>'; }).join('') + '</select></label></div>' +
    '<div class="linha"><label class="campo"><span>Conteúdo do edital</span><select id="q-cont"></select></label>' +
    '<label class="campo"><span>Habilidade (opcional)</span><input type="text" id="q-hab" placeholder="Ex.: interpretar gráficos" value="' + esc(q.habilidade) + '"></label></div>' +
    campoOrigem(q.origem) +
    '<label class="campo"><span>Enunciado *</span><textarea id="q-enun" rows="8" required>' + esc(q.enunciado) + '</textarea></label>' +
    '<div class="dica peq"><b>Dicas:</b> para pôr uma figura no meio do texto, clique no ponto do enunciado e cole a imagem com <b>Ctrl+V</b> ' +
    '(ou use "Adicionar figura" e depois "Inserir no texto"). Se colar a questão inteira, com as alternativas, o MIRA separa as alternativas sozinho.<br>' +
    '<b>Fórmulas:</b> escreva entre cifrões, como <code>$10^{2}$</code>, <code>$\\frac{\\Delta s}{\\Delta t}$</code> ou <code>$\\sqrt{2}$</code>. ' +
    'Potências simples (10^2) já aparecem como expoente. Confira na prévia, embaixo das alternativas.</div>' +
    '<div class="campo"><span class="mut peq" style="font-weight:600">Figuras</span>' +
    '<div id="q-figs" class="figs"></div>' +
    '<label class="btn peq" style="cursor:pointer;display:inline-flex;margin-top:6px"><input type="file" id="q-img" accept="image/*" multiple style="display:none">+ Adicionar figura</label></div>' +
    '<div class="campo"><span class="mut peq" style="font-weight:600">Alternativas * — marque a correta</span>' +
    '<p class="mut peq" style="margin:2px 0 4px">Pode colar todas de uma vez no campo (A): o MIRA separa em A, B, C, D e E.</p>' +
    c.alternativas.map(function (l) {
      return '<div class="alt-lin" data-l="' + l + '">' +
        '<label class="alt-gab"><input type="radio" name="q-gab" value="' + l + '"' + (q.gabaritoProfessor === l ? ' checked' : '') + '> ' + l + '</label>' +
        '<textarea id="q-alt-' + l + '" class="q-alt" data-l="' + l + '" rows="1" style="min-height:40px" required>' + esc(alt[l]) + '</textarea>' +
        '<span class="alt-ok">✔ correta</span></div>';
    }).join('') + '</div>' +
    '<div class="campo"><span class="mut peq" style="font-weight:600">Prévia (como o aluno vê)</span><div id="q-previa" class="previa"></div></div>' +
    '<div class="aviso azul peq">Depois de salva, a questão passa pela curadoria: resolução, conferência do gabarito e o erro de raciocínio por trás de cada alternativa incorreta. Capriche nas alternativas erradas: elas é que revelam as dificuldades dos alunos.</div>' +
    '<div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn fechar">Cancelar</button>' +
    '<button class="btn pri" id="q-salvar">Salvar questão</button></div></form>', true);

  var enun = $('#q-enun', md.el);
  ligarOrigem(md.el);
  var opcoesConteudo = function () {
    var disc = $('#q-disc', md.el).value, lista = ((c.edital || {})[disc]) || [], atual = $('#q-cont', md.el).value || q.conteudo || '';
    var fora = atual && lista.indexOf(atual) < 0 ? '<option value="' + esc(atual) + '">' + esc(atual) + ' (texto antigo)</option>' : '';
    $('#q-cont', md.el).innerHTML = '<option value="">Escolha o conteúdo…</option>' + fora +
      lista.map(function (t) { return '<option' + (t === atual ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('');
    if (fora) $('#q-cont', md.el).value = atual;
  };
  opcoesConteudo();
  $('#q-disc', md.el).addEventListener('change', function () { $('#q-cont', md.el).value = ''; opcoesConteudo(); });
  var tPrevia = null;
  var previa = function () {
    var el = $('#q-previa', md.el);
    if (!el) return;
    el.innerHTML = '<div class="previa-enun">' + esc(semFiguras(enun.value) || 'O enunciado aparece aqui.') + '</div>' +
      c.alternativas.map(function (l) { var v = $('#q-alt-' + l, md.el).value; return v ? '<div>(' + l + ') ' + esc(v) + '</div>' : ''; }).join('');
  };
  md.el.addEventListener('input', function () { clearTimeout(tPrevia); tPrevia = setTimeout(previa, 350); });
  setTimeout(previa, 0);
  var figuras = []; // { id?, url, base64?, mime? }
  var cursor = null;
  var lembrarCursor = function () { cursor = { ini: enun.selectionStart, fim: enun.selectionEnd }; };
  ['keyup', 'click', 'select', 'blur', 'input'].forEach(function (ev) { enun.addEventListener(ev, lembrarCursor); });

  var inserirNoEnunciado = function (txt) {
    var v = enun.value;
    var p = cursor || { ini: v.length, fim: v.length };
    enun.value = v.slice(0, p.ini) + txt + v.slice(p.fim);
    var novo = p.ini + txt.length;
    enun.focus(); enun.setSelectionRange(novo, novo);
    cursor = { ini: novo, fim: novo };
  };
  var marcador = function (n) {
    var v = enun.value, p = cursor ? cursor.ini : v.length;
    return (p > 0 && v.charAt(p - 1) !== '\n' ? '\n' : '') + '[FIGURA ' + n + ']' + (v.charAt(p) === '\n' ? '' : '\n');
  };

  var desenharFiguras = function () {
    var box = $('#q-figs', md.el);
    if (!figuras.length) { box.innerHTML = '<p class="mut peq" style="margin:4px 0">Nenhuma figura.</p>'; return; }
    box.innerHTML = figuras.map(function (f, i) {
      var n = i + 1, marcada = new RegExp('\\[FIGURA\\s+' + n + '\\]', 'i').test(enun.value) || (n === 1 && /\[FIGURA\]/i.test(enun.value));
      return '<div class="fig-card"><img src="' + imgSrc(f.url) + '" alt="Figura ' + n + '"><div><b>Figura ' + n + '</b><br>' +
        '<span class="mut peq">' + (marcada ? 'No texto, onde está [FIGURA ' + n + ']' : 'Aparece depois do texto') + '</span><br>' +
        (marcada ? '' : '<button type="button" class="btn peq" data-ins="' + i + '">Inserir no texto</button> ') +
        '<button type="button" class="btn peq perigo" data-rem="' + i + '">Remover</button></div></div>';
    }).join('');
    $$('[data-ins]', box).forEach(function (b) {
      b.onclick = function () { inserirNoEnunciado(marcador(+b.getAttribute('data-ins') + 1)); desenharFiguras(); };
    });
    $$('[data-rem]', box).forEach(function (b) {
      b.onclick = function () {
        var i = +b.getAttribute('data-rem'), n = i + 1;
        figuras.splice(i, 1);
        // tira a marcação desta figura e renumera as seguintes
        enun.value = enun.value.replace(/\[FIGURA\]/gi, '[FIGURA 1]')
          .replace(new RegExp('\\n?\\[FIGURA\\s+' + n + '\\]\\n?', 'gi'), '\n')
          .replace(/\[FIGURA\s+(\d+)\]/gi, function (m, k) { k = +k; return '[FIGURA ' + (k > n ? k - 1 : k) + ']'; });
        desenharFiguras();
      };
    });
  };
  enun.addEventListener('input', function () { if (figuras.length) desenharFiguras(); });

  var adicionarArquivo = function (file, noTexto) {
    return lerImagem(file, 1400, 0.9).then(function (r) {
      figuras.push({ url: r.url, base64: r.base64, mime: r.mime });
      if (noTexto) inserirNoEnunciado(marcador(figuras.length));
      desenharFiguras();
      toast('Figura ' + figuras.length + ' adicionada' + (noTexto ? ' no ponto do texto.' : '.'));
    }).catch(function (er) { toast(msgErro(er), true); });
  };

  if (q.imagemId) {
    $('#q-figs', md.el).innerHTML = '<div class="carregando"><div class="giro"></div>Carregando figuras…</div>';
    call('imagemQuestao', { id: q.id }).then(function (l) {
      figuras = (l || []).filter(function (f) { return f.url; }).map(function (f) { return { id: f.id, url: f.url }; });
      desenharFiguras();
    });
  } else desenharFiguras();

  $('#q-img', md.el).onchange = function (e) {
    var fs = Array.prototype.slice.call(e.target.files);
    fs.reduce(function (p, f) { return p.then(function () { return adicionarArquivo(f, false); }); }, Promise.resolve());
    e.target.value = '';
  };

  // correta em destaque
  var marcarCorreta = function () {
    $$('.alt-lin', md.el).forEach(function (d) {
      d.classList.toggle('gab-on', !!$('input[name=q-gab]:checked', d));
    });
  };
  $$('input[name=q-gab]', md.el).forEach(function (r) { r.addEventListener('change', marcarCorreta); });
  marcarCorreta();

  var preencherAlternativas = function (alts) {
    Object.keys(alts).forEach(function (l) { var t = $('#q-alt-' + l, md.el); if (t) t.value = alts[l]; });
  };

  // colar: imagem vira figura; texto com (A)…(E) vira alternativas
  md.el.addEventListener('paste', function (e) {
    var cd = e.clipboardData; if (!cd) return;
    var texto = cd.getData('text/plain') || '';
    var arq = null;
    Array.prototype.slice.call(cd.items || []).forEach(function (it) {
      if (!arq && it.kind === 'file' && /^image\//.test(it.type)) arq = it.getAsFile();
    });
    if (arq && !texto.trim()) {
      e.preventDefault();
      if (e.target === enun) lembrarCursor();
      adicionarArquivo(arq, e.target === enun);
      return;
    }
    if (!texto) return;
    if (e.target === enun) {
      var r = separarAlternativas(texto, c.alternativas, c.alternativas.length);
      if (r) {
        e.preventDefault(); lembrarCursor();
        inserirNoEnunciado(r.antes);
        preencherAlternativas(r.alts);
        toast('Alternativas separadas automaticamente. Confira e marque a correta.');
      }
    } else if (e.target.classList && e.target.classList.contains('q-alt')) {
      var r2 = separarAlternativas(texto, c.alternativas, 2, null);
      if (r2) {
        e.preventDefault();
        if (r2.antes.trim() && !r2.alts[e.target.getAttribute('data-l')]) e.target.value = r2.antes.trim();
        preencherAlternativas(r2.alts);
        toast(Object.keys(r2.alts).length + ' alternativas preenchidas. Confira e marque a correta.');
      }
    }
  });

  $('#fq', md.el).onsubmit = function (e) {
    e.preventDefault();
    var g = $('input[name=q-gab]:checked', md.el);
    if (!g) { toast('Marque a alternativa correta.', true); return; }
    var faltando = [];
    (enun.value.match(/\[FIGURA\s*(\d*)\]/gi) || []).forEach(function (m) {
      var n = +(m.match(/\d+/) || [1])[0];
      if (n > figuras.length && faltando.indexOf(n) < 0) faltando.push(n);
    });
    if (faltando.length) { toast('O texto marca a Figura ' + faltando.join(', ') + ', mas ela não foi adicionada.', true); return; }
    var origem = lerOrigem(md.el);
    if (!origem) return;
    var alts = {};
    c.alternativas.forEach(function (l) { alts[l] = $('#q-alt-' + l, md.el).value; });
    var dados = {
      origem: origem,
      id: q.id, concurso: 'ESPCEX', disciplina: $('#q-disc', md.el).value, conteudo: $('#q-cont', md.el).value,
      habilidade: $('#q-hab', md.el).value, enunciado: enun.value, alternativas: alts,
      gabaritoProfessor: g.value,
      figuras: figuras.map(function (f) { return f.id ? { id: f.id } : { base64: f.base64, mime: f.mime }; })
    };
    ocupado($('#q-salvar', md.el), 'Salvando…', function () { return call('salvarQuestao', dados); })
      .then(function (r) {
        md.fechar();
        if (r.aviso) toast(r.aviso, true);
        else toast(r.questao.status === 'PENDENTE' ? 'Questão salva. Ela entra na próxima curadoria.' : 'Questão salva e analisada.');
        if (VIEWS.questoes.recarregar && S.rota === 'questoes') VIEWS.questoes.recarregar();
        verQuestao(r.questao, VIEWS.questoes.recarregar);
      }).catch(function () {});
  };
}

function copiar(texto, btn) {
  var ok = function () { var t = btn.textContent; btn.textContent = 'Copiado ✓'; setTimeout(function () { btn.textContent = t; }, 2000); };
  try {
    navigator.clipboard.writeText(texto).then(ok, function () { throw 0; });
  } catch (e) { toast('Selecione o texto e copie com Ctrl+C (ou toque e segure).'); }
}
