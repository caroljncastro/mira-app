        return '<option value="' + esc(o[0]) + '"' + (o[0] === p.aba ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
      }).join('') + '</select></label>' +
      '<div class="rolagem"><table class="tab"><tr><th>Parte</th><th class="num">Voltam</th><th class="num">Mudam</th><th class="num">Saem</th></tr>' +
      p.partes.map(function (x) {
        return '<tr><td>' + esc(x.nome) + (x.mantidos ? '<div class="mut peq">' + x.mantidos + (x.mantidos > 1 ? ' contas criadas depois continuam' : ' conta criada depois continua') + '</div>' : '') + '</td>' +
          '<td class="num">' + x.voltam + '</td><td class="num">' + x.alterados + '</td><td class="num">' + x.apagados + '</td></tr>';
      }).join('') + '</table></div>' +
      '<p class="mut peq">Voltam: estão na cópia e não existem mais. Mudam: existem, mas foram alterados depois da cópia. Saem: foram criados depois da cópia.</p>' +
      (p.semSenha ? '<p class="peq"><b>' + p.semSenha + (p.semSenha > 1 ? ' contas voltam sem senha' : ' conta volta sem senha') + '.</b> No fim, você envia uma senha provisória por e-mail.</p>' : '') +
      '<h3 style="margin-top:14px">Antes de continuar</h3><ul class="peq" style="padding-left:20px">' + avisos.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul>' +
      (p.podeRestaurar
        ? '<h3 style="margin-top:14px">Confirmar</h3>' +
          '<p class="peq">1. Baixe a cópia de agora. Ela é o seu "desfazer", caso precise voltar atrás.</p>' +
          '<p><button class="btn" id="r-antes">Baixar a cópia de agora</button> <span id="r-antes-ok"></span></p>' +
          '<label class="campo"><span>2. Digite RESTAURAR</span><input type="text" id="r-palavra" autocomplete="off" disabled></label>' +
          '<div style="display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap"><button class="btn fechar">Cancelar</button><button class="btn perigo" id="r-ok" disabled>Restaurar</button></div>'
        : '<div class="aviso ambar">A restauração só funciona no endereço novo do MIRA.</div>');
    $$('.fechar', corpo).forEach(function (b) { b.onclick = md.fechar; });
    $('#r-aba', corpo).onchange = function () { aba = this.value; previa(); };
    if (!p.podeRestaurar) return;
    var palavra = $('#r-palavra', corpo), ok = $('#r-ok', corpo);
    var liberar = function () { ok.disabled = !(baixou && palavra.value.trim().toUpperCase() === 'RESTAURAR'); };
    var marcarBaixou = function () {
      baixou = true; palavra.disabled = false;
      $('#r-antes-ok', corpo).innerHTML = tag({ OK: ['Baixada', 'verde'] }, 'OK');
      liberar(); palavra.focus();
    };
    if (baixou) marcarBaixou();
    $('#r-antes', corpo).onclick = function () { baixarCopia(this, marcarBaixou); };
    palavra.oninput = liberar;
    ok.onclick = function () {
      var d = { copia: copia, aba: aba, confirmacao: palavra.value };
      ocupado(ok, 'Restaurando…', function () { return call('restaurarCopia', d); }).then(feito).catch(function () {});
    };
  }
  function feito(r) {
    corpo.innerHTML = '<div class="aviso verde" style="margin-top:12px"><b>Pronto.</b> O MIRA voltou à cópia de ' + esc(dataHoraBr(r.geradoEm)) + '. As outras pessoas precisam entrar de novo.</div>' +
      '<div class="rolagem"><table class="tab"><tr><th>Parte</th><th class="num">Voltaram</th><th class="num">Mudaram</th><th class="num">Saíram</th></tr>' +
      r.partes.map(function (x) { return '<tr><td>' + esc(x.nome) + '</td><td class="num">' + x.voltam + '</td><td class="num">' + x.alterados + '</td><td class="num">' + x.apagados + '</td></tr>'; }).join('') +
      '</table></div>' +
      (r.semSenha.length
        ? '<h3 style="margin-top:14px">Contas sem senha</h3><ul class="peq" style="padding-left:20px">' +
          r.semSenha.map(function (u) { return '<li>' + esc(u.nome) + ' <span class="mut">(' + esc(u.login) + ')</span></li>'; }).join('') + '</ul>' +
          '<div id="r-senhas"><button class="btn pri" id="r-enviar">Enviar senha provisória a todos</button></div>'
        : '<div style="display:flex;justify-content:flex-end"><button class="btn pri fechar">Fechar</button></div>');
    $$('.fechar', corpo).forEach(function (b) { b.onclick = function () { md.fechar(); ir('config'); }; });
    $('.topo-j .fechar', md.el).onclick = function () { md.fechar(); ir('config'); };
    if (!r.semSenha.length) return;
    $('#r-enviar', corpo).onclick = function () {
      var ids = r.semSenha.map(function (u) { return u.id; });
      ocupado(this, 'Enviando…', function () { return call('senhasRestaurados', { ids: ids }); }).then(function (s) {
        var semEmail = s.feitos.filter(function (f) { return !f.emailEnviado; });
        $('#r-senhas', corpo).innerHTML = '<p class="peq">' + (s.feitos.length - semEmail.length) + ' senhas enviadas por e-mail (pode cair no spam).</p>' +
          (semEmail.length ? '<p class="peq">Estas não foram por e-mail. Entregue pessoalmente; elas não serão exibidas de novo:</p>' +
            tabelaSenhas(semEmail) : '');
      }).catch(function () {});
    };
  }
}

/** Configurações (no Google): copiar os dados para o Supabase e concluir a mudança */
var MIRA_NOVO = 'https://caroljncastro.github.io/mira-app/';
function cartaoMudanca(c) {
  return '<div class="card" id="mudanca"><h2>Novo servidor (mais rápido)</h2>' +
    (c.migrado
      ? '<div class="aviso verde"><b>Mudança concluída.</b> Este endereço antigo agora só mostra o caminho para o MIRA novo.</div>' +
        '<p class="peq"><a href="' + MIRA_NOVO + '" target="_blank">Abrir o MIRA novo</a></p>' +
        '<button class="btn perigo" id="mu-desfazer">Voltar a usar este endereço (emergência)</button>'
      : '<p class="peq">O MIRA novo usa um banco de dados de verdade (Supabase). As telas são as mesmas.</p>' +
        '<ol class="peq" style="padding-left:20px;margin:0 0 14px"><li><b>Copiar os dados</b>: leva usuários, questões, simulados, resultados e figuras. Só funciona num servidor novo ainda vazio, e pode repetir até concluir: cada cópia substitui a anterior.</li>' +
        '<li><b>Testar</b> o MIRA novo (entre com o mesmo e-mail e senha).</li>' +
        '<li><b>Concluir a mudança</b>: passa todos para o endereço novo e fecha a cópia de vez.</li></ol>' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="mu-copiar">Copiar os dados</button>' +
        '<a class="btn" href="' + MIRA_NOVO + 'app.html" target="_blank">Testar o MIRA novo</a>' +
        '<button class="btn pri" id="mu-concluir">Concluir a mudança</button></div><div id="mu-res"></div>') + '</div>';
}
function copiarParaSupabase(btn) {
  var res = $('#mu-res');
  var passo = function (txt) { res.innerHTML = '<div class="aviso azul" style="margin-top:12px">' + esc(txt) + '</div>'; };
  return ocupado(btn, 'Copiando…', function () {
    passo('Copiando as tabelas…');
    return call('migrarSupabase', { etapa: 'tabelas' }).then(function (r) {
      var arquivos = function (desde) {
        passo('Copiando figuras e fotos: ' + desde + ' de ' + r.arquivos + '…');
        return call('migrarSupabase', { etapa: 'arquivos', desde: desde }).then(function (a) {
          if (a.feitos < a.total) return arquivos(a.feitos);
          return { tabelas: r.contagem, arquivos: a };
        });
      };
      return arquivos(0);
    });
  }).then(function (r) {
    res.innerHTML = '<div class="aviso verde" style="margin-top:12px"><b>Dados copiados.</b> ' + Object.keys(r.tabelas).map(function (k) {
      return esc(k) + ': ' + r.tabelas[k]; }).join(' · ') + ' · arquivos: ' + r.arquivos.total + '</div>' +
      (r.arquivos.erros.length ? '<div class="aviso ambar">Arquivos não copiados: ' + r.arquivos.erros.map(esc).join('<br>') + '</div>' : '');
    return r;
  });
}
function ligarMudanca() {
  if ($('#mu-copiar')) $('#mu-copiar').onclick = function () { copiarParaSupabase(this).catch(function () {}); };
  if ($('#mu-concluir')) $('#mu-concluir').onclick = function () {
    var b = this;
    confirmar('Passar todos para o MIRA novo? Alunos e professores que abrirem o endereço antigo serão levados ao novo, e a cópia para o servidor novo fica fechada.', 'Concluir a mudança').then(function () {
      ocupado(b, 'Concluindo…', function () { return call('concluirMudanca', {}); })
        .then(function (r) { toast(r && r.aviso ? r.aviso : 'Mudança concluída. Todos já usam o MIRA novo.', !!(r && r.aviso)); ir('config'); }).catch(function () {});
    });
  };
  if ($('#mu-desfazer')) $('#mu-desfazer').onclick = function () {
    var b = this;
    confirmar('Voltar a usar o endereço antigo? Use só em emergência: o que for feito aqui não aparece no MIRA novo.', 'Voltar').then(function () {
      ocupado(b, 'Voltando…', function () { return call('concluirMudanca', { desfazer: true }); }).then(function () { ir('config'); }).catch(function () {});
    });
  };
}
</script>
