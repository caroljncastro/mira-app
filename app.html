<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MIRA</title>
  <link rel="icon" type="image/png" href="favicon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
  /* =====================================================================
     MIRA · sistema de design (regras completas em docs/design-system.md)
     Neutro primeiro; azul = ação/seleção; vermelho = marca/perigo;
     verde/âmbar/vermelho = situação. IBM Plex Sans + Archivo estreita.
     ===================================================================== */
  :root {
    --marca-900: #0B2350;
    --marca-700: #143A78;
    --marca-600: #1D4E9E;
    --marca-100: #E6EDF8;
    --marca-50: #F2F6FC;
    --acento-600: #C1272D;
    --n-900: #0F172A;
    --n-700: #334155;
    --n-500: #64748B;
    --n-400: #94A3B8;
    --n-300: #CBD5E1;
    --n-200: #E2E8F0;
    --n-100: #F1F5F9;
    --n-50: #F7F9FC;
    --ok: #15803D;     --ok-bg: #EAF7EF;
    --alerta: #B45309; --alerta-bg: #FEF6E7;
    --erro: #B91C1C;   --erro-bg: #FDECEC;

    --r-tag: 6px; --r-ctl: 8px; --r-card: 12px; --r-jan: 16px;
    --fonte: "IBM Plex Sans", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --estreita: "Archivo", "Arial Narrow", "Segoe UI", Roboto, Arial, sans-serif;
    --sombra-jan: 0 24px 60px rgba(15, 23, 42, .22), 0 2px 6px rgba(15, 23, 42, .08);
    --sombra-flut: 0 10px 28px rgba(15, 23, 42, .16);

    /* nomes antigos, usados em estilos embutidos nas telas */
    --azul: var(--marca-700); --azul-2: var(--marca-600); --azul-claro: var(--marca-100);
    --ferrete: var(--marca-700); --tinta: var(--marca-600); --garanca: var(--acento-600);
    --verm: var(--erro); --verm-claro: var(--erro-bg);
    --verde: var(--ok); --verde-claro: var(--ok-bg);
    --ambar: var(--alerta); --ambar-claro: var(--alerta-bg);
    --bg: var(--n-50); --papel: var(--n-50); --card: #fff;
    --txt: var(--n-900); --grafite: var(--n-900); --mut: var(--n-500); --nevoa: var(--n-500);
    --borda: var(--n-200); --linha: var(--n-200);
    --raio: var(--r-card); --raio-ctl: var(--r-ctl); --sombra: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--n-50); color: var(--n-900); font-family: var(--fonte);
    font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--marca-600); text-underline-offset: 2px; }
  a:hover { color: var(--marca-700); }
  h1, h2, h3 { margin: 0; line-height: 1.2; color: var(--n-900); }
  h1 { font-family: var(--estreita); font-size: 28px; font-weight: 700; font-variation-settings: "wdth" 78; letter-spacing: -.1px; }
  h2 { font-size: 17px; font-weight: 600; }
  h3 { font-size: 15px; font-weight: 600; }
  :focus-visible { outline: 2px solid var(--marca-600); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- topo ---------- */
  .topo { background: var(--marca-900); color: #fff; display: flex; align-items: center; gap: 12px;
    padding: 0 16px 0 20px; height: 56px; position: sticky; top: 0; z-index: 20; }
  .topo::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
    background: linear-gradient(90deg, var(--marca-600) 0 50%, var(--acento-600) 50% 100%); }
  .marca { display: flex; align-items: center; gap: 10px; }
  .marca .emblema { width: 32px; height: 32px; flex: none; object-fit: contain; }
  .marca b { font-family: var(--estreita); font-size: 21px; font-weight: 800; letter-spacing: 2px;
    font-variation-settings: "wdth" 72; line-height: 1; color: #fff; }
  .usuario { margin-left: auto; position: relative; }
  .usuario > button { display: flex; align-items: center; gap: 10px; background: transparent; border: 0; color: #fff;
    padding: 6px 8px 6px 6px; border-radius: var(--r-ctl); cursor: pointer; text-align: left; }
  .usuario > button:hover, .usuario.aberto > button { background: rgba(255, 255, 255, .1); }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none;
    background: #fff; color: var(--marca-700); font-weight: 700; font-size: 13px; }
  .avatar { overflow: hidden; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avatar.grande { width: 72px; height: 72px; font-size: 24px; background: var(--marca-100); }
  .usuario .nome { font-size: 14px; font-weight: 600; line-height: 1.2; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .usuario .nome small { display: block; font-weight: 400; font-size: 12px; color: rgba(255, 255, 255, .7); }
  .usuario .seta { width: 10px; height: 10px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor;
    transform: rotate(45deg) translateY(-3px); opacity: .8; margin-left: 2px; }
  .usuario-menu { position: absolute; right: 0; top: calc(100% + 6px); min-width: 210px; background: #fff; color: var(--n-900);
    border: 1px solid var(--n-200); border-radius: var(--r-card); box-shadow: var(--sombra-flut); padding: 6px; display: none; }
  .usuario.aberto .usuario-menu { display: block; }
  .usuario-menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 9px 12px;
    border-radius: var(--r-ctl); cursor: pointer; font-size: 14px; }
  .usuario-menu button:hover { background: var(--n-100); }
  .usuario-menu hr { border: 0; border-top: 1px solid var(--n-200); margin: 6px 0; }
  .usuario-menu .perigo { color: var(--acento-600); }

  /* ---------- layout ---------- */
  .casca { display: flex; min-height: calc(100vh - 56px);
    background: linear-gradient(90deg, #fff 0 247px, var(--n-200) 247px 248px, transparent 248px); }
  nav.menu { width: 248px; flex: none; background: #fff; border-right: 1px solid var(--n-200); padding: 14px 12px;
    display: flex; flex-direction: column; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; }
  nav.menu button { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: none; border: 0; padding: 7px 10px; border-radius: var(--r-ctl); cursor: pointer;
    color: var(--n-700); font-weight: 500; font-size: 14.5px; margin-bottom: 2px; }
  nav.menu .ic { width: 28px; height: 28px; flex: none; }
  nav.menu button:hover { background: var(--n-100); color: var(--n-900); }
  nav.menu button.ativo { background: var(--marca-100); color: var(--marca-700); font-weight: 600; }
  nav.menu button.ativo::before { content: ""; position: absolute; left: -12px; top: 9px; bottom: 9px; width: 3px;
    border-radius: 0 3px 3px 0; background: var(--acento-600); }
  .conteudo { flex: 1; min-width: 0; }
  main { width: 100%; padding: 28px 32px 56px; max-width: 1160px; }
  #aviso-senha { max-width: 1160px; padding: 0 32px; }
  #aviso-senha .aviso { margin: 20px 0 -8px; }
  .cab-pag { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; padding-bottom: 18px;
    border-bottom: 1px solid var(--n-200); }
  .cab-pag p { margin: 6px 0 0; color: var(--n-500); font-size: 14.5px; max-width: 72ch; }
  .cab-pag .acoes { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

  @media (max-width: 820px) {
    .topo { padding: 0 8px 0 12px; }
    .usuario .nome { display: none; }
    .casca { flex-direction: column; background: none; }
    nav.menu { width: 100%; height: auto; flex-direction: row; overflow-x: auto; padding: 6px 8px; gap: 2px;
      top: 56px; z-index: 10; border-right: 0; border-bottom: 1px solid var(--n-200); }
    nav.menu button { white-space: nowrap; width: auto; padding: 6px 10px 6px 6px; font-size: 14px; margin: 0; gap: 8px; }
    nav.menu .ic { width: 24px; height: 24px; }
    nav.menu button.ativo::before { left: 8px; right: 8px; top: auto; bottom: -6px; width: auto; height: 3px; border-radius: 3px 3px 0 0; }
    .menu-pe { display: none; }
    main { padding: 20px 16px 64px; }
    #aviso-senha { padding: 0 16px; }
    #aviso-senha .aviso { margin: 16px 0 -4px; }
    h1 { font-size: 24px; }
  }

  /* ---------- componentes ---------- */
  .card { background: #fff; border: 1px solid var(--n-200); border-radius: var(--r-card); padding: 20px; margin-bottom: 16px; }
  .card > h2, .card > h3 { margin-bottom: 12px; }
  .grade { display: grid; gap: 0; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-bottom: 16px;
    background: #fff; border: 1px solid var(--n-200); border-radius: var(--r-card); overflow: hidden; }
  .grade-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); align-items: start; }
  .kpi { padding: 16px 20px; border-right: 1px solid var(--n-200); }
  .kpi:last-child { border-right: 0; }
  .kpi small { color: var(--n-500); font-size: 13px; }
  .kpi b { display: block; font-family: var(--estreita); font-size: 36px; font-weight: 700; line-height: 1.1;
    font-variation-settings: "wdth" 72; color: var(--n-900); margin-top: 4px; font-variant-numeric: tabular-nums; }

  .btn { border: 1px solid var(--n-300); background: #fff; min-height: 38px; padding: 7px 14px; border-radius: var(--r-ctl);
    cursor: pointer; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; color: var(--n-900);
    transition: background .12s, border-color .12s; }
  .btn:hover { background: var(--n-100); }
  .btn.pri { background: var(--marca-700); border-color: var(--marca-700); color: #fff; }
  .btn.pri:hover { background: var(--marca-900); border-color: var(--marca-900); }
  .btn.perigo { color: var(--acento-600); border-color: #E7B4B6; }
  .btn.perigo:hover { background: var(--erro-bg); }
  .btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
  .btn.ok:hover { background: #116632; }
  .btn.peq { min-height: 32px; padding: 4px 11px; font-size: 13px; }
  .btn.disc { border-color: transparent; background: transparent; color: var(--marca-600); }
  .btn.disc:hover { background: var(--marca-50); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  label.campo { display: block; margin-bottom: 16px; }
  label.campo > span { display: block; font-size: 13px; font-weight: 600; color: var(--n-700); margin-bottom: 6px; }
  input[type=text], input[type=email], input[type=password], input[type=date], select, textarea {
    width: 100%; min-height: 40px; padding: 8px 12px; border: 1px solid var(--n-300); border-radius: var(--r-ctl); background: #fff; }
  input::placeholder, textarea::placeholder { color: var(--n-400); }
  input:focus, select:focus, textarea:focus { outline: 3px solid var(--marca-100); outline-offset: 0; border-color: var(--marca-600); }
  input[type=checkbox], input[type=radio] { accent-color: var(--marca-700); }
  textarea { min-height: 72px; resize: vertical; line-height: 1.5; }
  .linha { display: flex; gap: 16px; flex-wrap: wrap; }
  .linha > * { flex: 1; min-width: 160px; }

  /* etiquetas: neutras por padrão; .st = situação (pílula com ponto) */
  .tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; padding: 2px 8px;
    border-radius: var(--r-tag); background: var(--n-100); color: var(--n-700); white-space: nowrap; line-height: 1.5; }
  .tag.st { border-radius: 999px; font-weight: 600; padding: 2px 10px 2px 8px; }
  .tag.st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
  .tag.azul { background: var(--marca-100); color: var(--marca-700); }
  .tag.verde { background: var(--ok-bg); color: var(--ok); }
  .tag.verm { background: var(--erro-bg); color: var(--erro); }
  .tag.ambar { background: var(--alerta-bg); color: var(--alerta); }
  .meta { color: var(--n-500); font-size: 13.5px; }

  table.tab { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  table.tab th { text-align: left; font-size: 13px; font-weight: 600; color: var(--n-500); background: var(--n-100);
    padding: 9px 12px; border-bottom: 1px solid var(--n-200); }
  table.tab td { padding: 12px; border-bottom: 1px solid var(--n-200); vertical-align: top; }
  table.tab tr:last-child td { border-bottom: 0; }
  table.tab tr.clic { cursor: pointer; }
  table.tab tr.clic:hover td { background: var(--marca-50); }
  .card > .rolagem:first-child, .card.rolagem { padding: 0; }
  .card.rolagem > p { padding: 14px 16px 0; }
  .rolagem { overflow-x: auto; }
  .num { font-variant-numeric: tabular-nums; text-align: right; }
  .mut { color: var(--n-500); }
  .peq { font-size: 13.5px; }
  .vazio { text-align: center; color: var(--n-500); padding: 36px 16px; }
  .vazio .ic-vazio { display: block; width: 64px; height: 64px; margin: 0 auto 12px; }

  /* barras */
  .barra { display: grid; grid-template-columns: 120px 1fr 56px; align-items: center; gap: 12px; margin: 8px 0; font-size: 14px; }
  .barra .trilho { height: 8px; background: var(--n-100); border-radius: 999px; overflow: hidden; }
  .barra .enche { height: 100%; border-radius: 999px; }
  .barra .v { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--n-700); }

  /* pendências (painel) */
  .pendencias { padding: 6px 0; }
  .pendencias > h2 { padding: 14px 20px 4px; margin: 0; }
  .pend { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-top: 1px solid var(--n-200); }
  .pendencias > h2 + .pend { border-top: 0; }
  .pend .n { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; flex: none;
    font-family: var(--estreita); font-variation-settings: "wdth" 80; font-weight: 700; font-size: 16px; }
  .pend .n.ambar { background: var(--alerta-bg); color: var(--alerta); }
  .pend .n.azul { background: var(--marca-100); color: var(--marca-700); }
  .pend .n.verde { background: var(--ok-bg); color: var(--ok); }
  .pend .t { flex: 1; min-width: 0; }
  .pend .t b { display: block; font-weight: 600; }
  .pend .t span { color: var(--n-500); font-size: 13.5px; }
  .pend-ok { padding: 16px 20px; color: var(--n-500); }
  .sit-lista { display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px; }
  .sit { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0;
    border-bottom: 1px solid var(--n-200); text-decoration: none; color: inherit; }
  .sit:hover .tag { filter: brightness(.97); }
  .sit b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--n-900); }
  @media (max-width: 520px) { .sit-lista { grid-template-columns: 1fr; } }

  /* questões */
  .q-lista { background: #fff; border: 1px solid var(--n-200); border-radius: var(--r-card); overflow: hidden; margin-bottom: 16px; }
  .q-item { cursor: pointer; position: relative; margin: 0; border: 0; border-radius: 0; padding: 14px 20px;
    border-top: 1px solid var(--n-200); background: #fff; }
  .q-item:first-child { border-top: 0; }
  .q-item:hover { background: var(--marca-50); }
  .q-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  .q-meta .dir { margin-left: auto; color: var(--n-400); font-size: 12.5px; }
  .q-trecho { color: var(--n-700); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .enun { white-space: pre-wrap; }
  .alts div { padding: 8px 12px; border-radius: var(--r-ctl); margin: 6px 0; border: 1px solid var(--n-200); }
  .alts .certa { background: var(--ok-bg); border-color: #9BD3B0; font-weight: 600; }
  .alts .prof { box-shadow: inset 3px 0 0 var(--alerta); }
  .alt-marca { float: right; margin-left: 10px; font-size: 12px; font-weight: 600; color: var(--ok); }
  .gab-badge { display: inline-flex; align-items: baseline; gap: 8px; margin: 2px 0 14px; padding: 6px 12px; border-radius: var(--r-ctl);
    background: var(--ok-bg); color: var(--ok); font-size: 14px; border: 1px solid #9BD3B0; }
  .gab-badge b { font-family: var(--estreita); font-variation-settings: "wdth" 80; font-size: 20px; line-height: 1; }
  .gab-badge span { font-size: 12.5px; color: var(--n-500); }
  .tag.gab { background: var(--ok-bg); color: var(--ok); font-weight: 600; }

  /* formulário da questão */
  .dica { background: var(--n-100); border-radius: var(--r-ctl); padding: 10px 12px; margin: -6px 0 16px; color: var(--n-700); }
  .figs { display: flex; flex-direction: column; gap: 8px; }
  .fig-card { display: flex; gap: 12px; align-items: center; border: 1px solid var(--n-200); border-radius: var(--r-ctl); padding: 8px; }
  .fig-card img { width: 110px; max-height: 80px; object-fit: contain; background: #fff; border-radius: 4px; flex: none; }
  .fig-ph { margin: 10px 0; padding: 18px; text-align: center; border: 1px dashed var(--n-300); border-radius: var(--r-ctl); color: var(--n-500); font-size: 13px; }
  .alt-lin { display: flex; gap: 8px; align-items: flex-start; margin-top: 6px; border-radius: var(--r-ctl); padding: 3px; }
  .alt-gab { display: flex; align-items: center; gap: 4px; padding: 9px 4px 0; font-weight: 600; cursor: pointer; }
  .alt-ok { display: none; flex: none; align-self: center; font-size: 12px; font-weight: 600; color: var(--ok); }
  .alt-lin.gab-on { background: var(--ok-bg); box-shadow: 0 0 0 1px #9BD3B0; }
  .alt-lin.gab-on .alt-ok { display: inline-block; }
  .alt-lin.gab-on .alt-gab { color: var(--ok); }

  /* aprovação em lote */
  .lote { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    background: #fff; border: 1px solid var(--n-200); border-radius: var(--r-card); padding: 10px 12px 10px 16px; margin-bottom: 12px;
    position: sticky; top: 64px; z-index: 5; }
  .lote label { display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--n-700); font-size: 14px; }
  .lote input, .q-sel-box input { width: 18px; height: 18px; margin: 0; }
  .q-item.com-sel { padding-left: 56px; }
  .q-sel-box { position: absolute; left: 0; top: 0; bottom: 0; width: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .q-sel-box:hover { background: var(--marca-100); }

  /* seleção de alunos (cartões) */
  .alunos-sel { max-height: 50vh; overflow: auto; border: 1px solid var(--n-200); border-radius: var(--r-ctl); }
  .aluno-sel { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--n-200); cursor: pointer; }
  .aluno-sel:last-child { border-bottom: 0; }
  .aluno-sel:hover { background: var(--n-50); }
  .aluno-sel input { width: 18px; height: 18px; margin: 0; flex: none; }
  .aluno-sel small { display: block; color: var(--n-500); font-size: 12.5px; }

  /* ações do simulado: botões leves, agrupados */
  .sim-acoes { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding-top: 14px; border-top: 1px solid var(--n-200); }
  .sim-acoes .btn { background: var(--n-100); border-color: transparent; }
  .sim-acoes .btn:hover { background: var(--marca-100); color: var(--marca-700); }
  .sim-acoes select { width: auto; min-height: 32px; margin-left: auto; padding: 4px 8px; }

  /* versões */
  .sel-tag { width: auto; min-height: 0; border: 0; background: transparent; padding: 0 2px; font: inherit; font-weight: 600; color: var(--n-900); }
  .versoes { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn.versao { flex-direction: column; align-items: flex-start; gap: 0; padding: 10px 16px; min-width: 128px; }
  .btn.versao small { font-weight: 400; color: var(--n-500); font-size: 12.5px; }
  .btn.versao.on { background: var(--marca-700); border-color: var(--marca-700); color: #fff; }
  .btn.versao.on small { color: rgba(255, 255, 255, .75); }

  /* crédito (discreto) */
  .credito { font-size: 12px; color: var(--n-400); margin: 0; }

  /* relatório de curadoria */
  .diag { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 0; margin: 8px 0;
    border: 1px solid var(--n-200); border-radius: var(--r-ctl); overflow: hidden; }
  .diag > div { padding: 10px 14px; }
  .diag .d-alt { white-space: pre-wrap; }
  .diag .d-exp { background: var(--n-50); border-left: 1px solid var(--n-200); font-size: 13.5px; color: var(--n-700); }

/* MIRA no Supabase: o mesmo app, chamando a função "api" em vez do google.script.run */
(function () {
  var URL_API = "https://jgchyaoeqzcarqivfusu.supabase.co/functions/v1/api";
  window.MIRA_SUPABASE = true;
  function chamada(fn, args, ok, falha) {
    fetch(URL_API, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ fn: fn, args: args }) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (j.ok) { if (ok) ok(j.r); } else if (falha) falha(new Error(j.erro)); },
        function () { if (falha) falha(new Error('Sem conexão com o servidor do MIRA. Confira a internet e tente de novo.')); });
  }
  function Executor(ok, falha) { this.ok = ok; this.falha = falha; }
  Executor.prototype.withSuccessHandler = function (f) { return new Executor(f, this.falha); };
  Executor.prototype.withFailureHandler = function (f) { return new Executor(this.ok, f); };
  ['api', 'login', 'logout', 'pedirAcesso'].forEach(function (n) {
    Executor.prototype[n] = function () { chamada(n, Array.prototype.slice.call(arguments), this.ok, this.falha); };
  });
  window.google = { script: { run: new Executor(null, null) } };
})();

  <script>
/* =====================================================================
   MIRA — Leitura óptica do cartão-resposta no próprio aparelho (sem custo)
   1. encontra os 4 quadrados pretos dos cantos (e a marca de orientação);
   2. calcula a perspectiva da foto (homografia) a partir deles;
   3. mede, em cada bolha, o quanto o miolo está mais escuro que o papel em volta.
   A geometria (em mm) vem do servidor: a mesma usada para imprimir o cartão.
   ===================================================================== */
var OMR = (function () {
  var LIMIAR_MARCA = 0.30;   // miolo pelo menos 30% mais escuro que o entorno = marcada
  var LIMIAR_DUVIDA = 0.17;  // entre 17% e 30% = marca fraca, pede conferência

  function carregar(fonte) {
    return new Promise(function (ok, falha) {
      var img = new Image();
      img.onload = function () { ok(img); };
      img.onerror = function () { falha(new Error('Não foi possível abrir a foto.')); };
      img.src = typeof fonte === 'string' ? fonte : URL.createObjectURL(fonte);
    });
  }

  function cinza(img, maxLado) {
    var f = Math.min(1, maxLado / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
    var w = Math.round((img.naturalWidth || img.width) * f), h = Math.round((img.naturalHeight || img.height) * f);
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
    var d = ctx.getImageData(0, 0, w, h).data, g = new Float32Array(w * h);
    for (var i = 0, j = 0; i < g.length; i++, j += 4) g[i] = 0.299 * d[j] + 0.587 * d[j + 1] + 0.114 * d[j + 2];
    return { w: w, h: h, g: g, canvas: c };
  }

  /** escuro = mais escuro que a média da vizinhança (resiste a sombra e luz desigual) */
  function binarizar(G, janela, k) {
    var w = G.w, h = G.h, W = w + 1, I = new Float64Array(W * (h + 1));
    for (var y = 0; y < h; y++) {
      var s = 0;
      for (var x = 0; x < w; x++) { s += G.g[y * w + x]; I[(y + 1) * W + x + 1] = I[y * W + x + 1] + s; }
    }
    var r = janela >> 1, b = new Uint8Array(w * h);
    for (y = 0; y < h; y++) {
      var y0 = Math.max(0, y - r), y1 = Math.min(h, y + r + 1);
      for (x = 0; x < w; x++) {
        var x0 = Math.max(0, x - r), x1 = Math.min(w, x + r + 1);

        var media = soma / ((x1 - x0) * (y1 - y0));

        for (var v = 0; v < 4; v++) {

        }

    var cand = componentes(bin, S.w, S.h).filter(function (c) {
      var lado = Math.max(c.bw, c.bh), asp = c.bw / c.bh;
      return lado >= minDim * 0.008 && lado <= minDim * 0.13 && asp > 0.6 && asp < 1.65 && c.area / (c.bw * c.bh) > 0.6;
    }).sort(function (a, b) { return b.area - a.area; }).slice(0, 16);
    if (cand.length < 4) return null;

    var M = L.marcadores, esperado = (M[1][0] - M[0][0]) / (M[3][1] - M[0][1]);
    var lista = [];
    for (var a = 0; a < cand.length; a++) for (var b = a + 1; b < cand.length; b++)
      for (var c = b + 1; c < cand.length; c++) for (var d = c + 1; d < cand.length; d++) {
        var g = [cand[a], cand[b], cand[c], cand[d]];
        var areas = g.map(function (x) { return x.area; });
        if (Math.max.apply(null, areas) / Math.min.apply(null, areas) > 3) continue;
        var mx = (g[0].cx + g[1].cx + g[2].cx + g[3].cx) / 4, my = (g[0].cy + g[1].cy + g[2].cy + g[3].cy) / 4;
        g.sort(function (p, q) { return Math.atan2(p.cy - my, p.cx - mx) - Math.atan2(q.cy - my, q.cx - mx); });
        var pts = g.map(function (x) { return [x.cx, x.cy]; });
        // área do quadrilátero (fórmula do laço)
        var area = 0; for (var i = 0; i < 4; i++) { var p1 = pts[i], p2 = pts[(i + 1) % 4]; area += p1[0] * p2[1] - p2[0] * p1[1]; }
        if (Math.abs(area) / 2 < 0.04 * S.w * S.h) continue;
        for (var rot = 0; rot < 4; rot++) {
          var q = [pts[rot % 4], pts[(rot + 1) % 4], pts[(rot + 2) % 4], pts[(rot + 3) % 4]];
          var topo = dist(q[0], q[1]), dir = dist(q[1], q[2]), base = dist(q[2], q[3]), esq = dist(q[3], q[0]);
          var razao = (topo + base) / (esq + dir), erro = Math.abs(razao / esperado - 1);
          if (erro > 0.3 || Math.abs(topo / base - 1) > 0.45 || Math.abs(esq / dir - 1) > 0.45) continue;
          var H = homografia(M, q); if (!H) continue;
          // cada marcador precisa ter o tamanho esperado de um quadrado de 8 mm naquele ponto da foto
          // (descarta bolhas preenchidas e manchas que caem por acaso na posição de um canto)
          var gq = [g[rot % 4], g[(rot + 1) % 4], g[(rot + 2) % 4], g[(rot + 3) % 4]], erroTam = 0, tamOk = true;
          for (var z = 0; z < 4; z++) {
            var esperadoPx = dist(ponto(H, M[z][0] - L.lado / 2, M[z][1]), ponto(H, M[z][0] + L.lado / 2, M[z][1]));
            var lido = Math.sqrt(gq[z].area);
            var rz = lido / esperadoPx;
            if (rz < 0.6 || rz > 1.5) { tamOk = false; break; }
            erroTam += Math.abs(rz - 1);
          }
          if (!tamOk) continue;
          var esc = dist(ponto(H, 0, 0), ponto(H, 1, 0));
          var o = ponto(H, L.orientacao[0], L.orientacao[1]), ref = ponto(H, L.orientacao[0], 9);
          var escOri = 1 - media(S, o[0], o[1], 0, esc * 1.3) / Math.max(1, media(S, ref[0], ref[1], 0, esc * 1.3));
          var nota = erro + erroTam / 4 - (escOri > 0.3 ? 1 : 0);
          lista.push({ nota: nota, q: q, orientado: escOri > 0.3 });
        }
      }
    return lista.sort(function (x, y) { return x.nota - y.nota; }).slice(0, 6);
  }

  /**
   * Confere o enquadramento: com a perspectiva certa, o contorno impresso de cada bolha
   * fica mais escuro que o papel logo em volta. Devolve a fração de bolhas que batem (0 a 1).
   */
  function alinhamento(T, H, L) {
    var ok = 0, n = 0;
    for (var i = 0; i < L.bolhas.length; i += 2) {
      var b = L.bolhas[i], c = ponto(H, b.x, b.y), rp = dist(c, ponto(H, b.x + L.raio, b.y));
      var contorno = media(T, c[0], c[1], rp * 0.85, rp * 1.12), volta = media(T, c[0], c[1], rp * 1.35, rp * 1.75);
      n++; if (contorno < volta * 0.93) ok++;
    }
    return n ? ok / n : 0;
  }

  /** Lê o cartão. fonte: File, Blob ou URL de imagem. L: layout do servidor. */
  function ler(fonte, L) {
    return carregar(fonte).then(function (img) {
      var T = cinza(img, 1700);         // imagem de trabalho (leitura das bolhas)
      var S = cinza(img, 1100);         // imagem pequena (busca dos marcadores)
      var f = T.w / S.w, m = null, H = null, melhorAl = 0;
      acharMarcadores(S, L).forEach(function (cand) {
        var Hc = homografia(L.marcadores, cand.q.map(function (p) { return [p[0] * f, p[1] * f]; }));
        var al = Hc ? alinhamento(T, Hc, L) : 0;
        if (al > melhorAl) { melhorAl = al; m = cand; H = Hc; }
      });
      if (!m || melhorAl < 0.6) return { ok: false, alinhamento: melhorAl, erro: 'Não consegui enquadrar o cartão com segurança. Fotografe o cartão inteiro, de cima, com boa luz, sem sombra forte e com os quatro quadrados pretos visíveis.' };

      var porQ = {};
      L.bolhas.forEach(function (b) {
        var c = ponto(H, b.x, b.y), rp = dist(c, ponto(H, b.x + L.raio, b.y));
        var miolo = media(T, c[0], c[1], 0, rp * 0.55), volta = media(T, c[0], c[1], rp * 1.35, rp * 1.75);
        var v = 1 - miolo / Math.max(volta, 1);
        (porQ[b.n] = porQ[b.n] || []).push({ l: b.l, v: v, c: c, r: rp });
      });

      var respostas = {}, duvidas = [];
      Object.keys(porQ).forEach(function (n) {
        var bs = porQ[n].slice().sort(function (a, b) { return b.v - a.v; });
        var v1 = bs[0].v, v2 = bs[1] ? bs[1].v : 0, r = '', duv = false;
        if (v1 < LIMIAR_DUVIDA) r = '';
        else if (v1 < LIMIAR_MARCA) { r = ''; duv = true; }
        else if (v2 >= LIMIAR_MARCA) { r = v2 > 0.6 * v1 ? 'X' : bs[0].l; duv = true; }
        else { r = bs[0].l; duv = v2 >= LIMIAR_DUVIDA; }
        respostas[n] = r;
        if (duv) duvidas.push(+n);
      });

      // imagem de conferência: o que foi lido, desenhado sobre a foto
      var fv = Math.min(1, 900 / T.w), cv = document.createElement('canvas');
      cv.width = Math.round(T.w * fv); cv.height = Math.round(T.h * fv);
      var ctx = cv.getContext('2d');
      ctx.drawImage(T.canvas, 0, 0, cv.width, cv.height);
      ctx.strokeStyle = '#2f6fd6'; ctx.lineWidth = 2; ctx.beginPath();
      m.q.forEach(function (p, i) { var x = p[0] * f * fv, y = p[1] * f * fv; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
      ctx.closePath(); ctx.stroke();
      Object.keys(porQ).forEach(function (n) {
        porQ[n].forEach(function (b) {
          var x = b.c[0] * fv, y = b.c[1] * fv, r = b.r * fv * 1.25;
          if (respostas[n] === b.l || (respostas[n] === 'X' && b.v >= LIMIAR_MARCA)) {
            ctx.fillStyle = respostas[n] === 'X' ? 'rgba(224,36,47,.45)' : 'rgba(31,122,77,.5)';
            ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
          }
          if (duvidas.indexOf(+n) >= 0 && b.v >= LIMIAR_DUVIDA) {
            ctx.strokeStyle = '#e09b00'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x, y, r + 2, 0, 7); ctx.stroke();
          }
        });
      });
      return {
        ok: true, alinhamento: melhorAl, respostas: respostas, duvidas: duvidas.sort(function (a, b) { return a - b; }),
        orientado: m.orientado, conferencia: cv.toDataURL('image/jpeg', 0.8)
      };
    });
  }

  return { ler: ler, _homografia: homografia, _ponto: ponto };
})();
</script>

var LEITURAS = { me: 45, concursos: 86400, listarSimulados: 45, listarUsuarios: 45, listarQuestoes: 45, resultados: 45,

  layoutCartao: 600, configuracao: 45 };

  var k = acao + '|' + JSON.stringify(dados || {}), g = GUARDADO[k];
  if (g && Date.now() - g.em < seg * 1000) return g.p.then(function (r) { return JSON.parse(JSON.stringify(r)); });

// ícone de cada tela (Icones.html)
var ICONE_ROTA = {
  painel: 'desempenho', questoes: 'gabarito', simulados: 'simulados', resultados: 'correcao', turmas: 'relatorio',
  usuarios: 'conquistas', config: 'configuracoes', conta: 'perfil', meus: 'simulados', meusres: 'desempenho',
  relatorio: 'plano-estudos', enviar: 'correcao', estrategias: 'plano-estudos'
};
function iniciais(nome) {
  var p = String(nome || '').trim().split(/\s+/);
  return ((p[0] || '').charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : '')).toUpperCase();
}
/** Círculo do usuário: a foto, se houver; senão, as iniciais */
function avatar(u, classe) {
  return '<span class="avatar' + (classe ? ' ' + classe : '') + '">' + (u.fotoUrl ? '<img src="' + u.fotoUrl + '" alt="">' : esc(iniciais(u.nome))) + '</span>';
}
function icone(nome, classe) {
  var src = typeof ICONES !== 'undefined' && ICONES[nome];
  return src ? '<img class="' + (classe || 'ic') + '" src="' + src + '" alt="" aria-hidden="true">' : '';
}
var PERFIL_TXT = { ADM: 'Administração', PROFESSOR: 'Professor(a)', ALUNO: 'Aluno(a)' };

function iniciar() {
  return Promise.all([call('me'), call('concursos')]).then(function (r) {
    S.user = r[0]; S.conc = r[1];
    $('#app').innerHTML =
      '<header class="topo"><div class="marca"><img class="emblema" src="' + LOGO_EMBLEMA_BRANCO + '" alt=""><b>MIRA</b></div>' +
      '<div class="usuario" id="usuario"><button aria-haspopup="true" aria-expanded="false">' + avatar(S.user) +
      '<span class="nome">' + esc(S.user.nome) + '<small>' + PERFIL_TXT[S.user.perfil] + '</small></span><span class="seta"></span></button>' +
      '<div class="usuario-menu" role="menu"><button data-u="conta">Minha conta</button><hr><button data-u="sair" class="perigo">Sair</button></div></div></header>' +
      '<div class="casca"><nav class="menu" id="menu"></nav><div class="conteudo"><div id="aviso-senha"></div><main id="main"></main></div></div>';
    var um = $('#usuario');
    $('button', um).onclick = function (e) {
      e.stopPropagation();
      var ab = um.classList.toggle('aberto'); this.setAttribute('aria-expanded', ab ? 'true' : 'false');
    };
    document.addEventListener('click', function () { um.classList.remove('aberto'); });
    $$('[data-u]', um).forEach(function (b) {
      b.onclick = function () { um.classList.remove('aberto'); if (b.getAttribute('data-u') === 'sair') sair(false); else ir('conta'); };
    });
    avisoSenha();
    ir(MENUS[S.user.perfil][0][0]);
  });
}

/** Senha provisória: o usuário navega normalmente, mas vê a sugestão de criar a própria senha */
function avisoSenha() {
  var box = $('#aviso-senha'); if (!box) return;
  var adiado = false;
  try { adiado = sessionStorage.getItem('mira_senha_depois') === S.user.id; } catch (e) { }
  if (!S.user.trocarSenha || adiado || S.rota === 'conta') { box.innerHTML = ''; return; }
  box.innerHTML = '<div class="aviso azul aviso-senha nao-imprimir"><div><b>Você está usando uma senha provisória.</b> ' +
    'Para sua segurança, crie uma senha só sua.</div><div class="acoes"><button class="btn peq pri" id="as-criar">Criar minha senha</button>' +
    '<button class="btn peq disc" id="as-depois">Agora não</button></div></div>';
  $('#as-criar').onclick = function () { ir('conta'); };
  $('#as-depois').onclick = function () {
    try { sessionStorage.setItem('mira_senha_depois', S.user.id); } catch (e) { }
    box.innerHTML = '';
  };
}

function ir(rota, params) {
  S.rota = rota; S.params = params || {};
  var menu = MENUS[S.user.perfil];
  $('#menu').innerHTML = menu.map(function (m) {
    var ativo = m[0] === rota || (rota === 'relatorio' && (m[0] === 'resultados' || (S.user.perfil === 'ALUNO' && m[0] === 'painel'))) ||
      (rota === 'enviar' && (m[0] === 'meus' || m[0] === 'simulados'));
    return '<button data-r="' + m[0] + '" class="' + (ativo ? 'ativo' : '') + '">' + icone(ICONE_ROTA[m[0]]) + '<span>' + esc(m[1]) + '</span></button>';
  }).join('');
  $$('#menu button').forEach(function (b) { b.onclick = function () { ir(b.getAttribute('data-r')); }; });
  avisoSenha();
  var main = $('#main');
  window.scrollTo(0, 0);
  Promise.resolve().then(function () { return VIEWS[rota](main, S.params); })
    .catch(function (e) { main.innerHTML = '<div class="aviso verm">' + esc(msgErro(e)) + '</div>'; });
}

function cabPag(titulo, sub, acoes) {
  return '<div class="cab-pag"><div><h1>' + esc(titulo) + '</h1>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>' +
    (acoes ? '<div class="acoes nao-imprimir">' + acoes + '</div>' : '') + '</div>';
}

    h += '<div class="grade-2"><div class="card"><h2>Banco pronto para simulados</h2>' +

    conc('ESPCEX').provas.forEach(function (p) {
      h += '<h3 class="mut" style="margin:16px 0 4px;font-size:13px">' + esc(p.titulo) + '</h3>';
      p.disciplinas.forEach(function (x) {
        var tem = d.bancoPorDisciplina[x[0]] || 0;

      });

    h += '</div><div><div class="card"><h2>Questões por situação</h2><div class="sit-lista">' +
      Object.keys(STATUS_Q).filter(function (k) {
        return ['CURADA', 'REVISAR'].indexOf(k) < 0 || d.questoesPorStatus[k]; // estados antigos só se houver
      }).map(function (k) {
        return '<a href="#" class="sit" data-st="' + k + '">' + tag(STATUS_Q, k) + '<b>' + (d.questoesPorStatus[k] || 0) + '</b></a>';
      }).join('') +

      barraLote(qs);
    };

        marcadas = {};

    call('listarQuestoes', { status: $('#f-status').value, disciplina: $('#f-disc').value }).then(function (qs) {

        var sel = adm && APROVAVEIS.indexOf(q.status) >= 0;
        return '<div class="card q-item' + (sel ? ' com-sel' : '') + '" data-i="' + i + '" data-id="' + esc(q.id) + '">' +

          ((q.gabaritoFinal || q.gabaritoProfessor) ? '<span class="tag gab">Gabarito ' + esc(q.gabaritoFinal || q.gabaritoProfessor) + '</span>' : '') +
          '<span class="meta">' + esc(q.disciplina) + (q.conteudo ? ' · ' + esc(q.conteudo) : '') +
          (q.curadoria && q.curadoria.dificuldade ? ' · ' + esc(q.curadoria.dificuldade) : '') + (q.imagemId ? ' · com figura' : '') + '</span>' +
          '<span class="dir">' + (adm ? esc(q.autorNome) + ' · ' : '') + dataBr(q.atualizadoEm) + '</span></div>' +
          '<div class="q-trecho">' + esc(semFiguras(q.enunciado)) + '</div></div>';
      }).join('') + '</div>';
      $$('.q-item', l).forEach(function (c) {
        c.onclick = function (e) {
          if (e.target.closest('.q-sel-box')) return;
          verQuestao(qs[+c.getAttribute('data-i')], function (mud) { atualizarItem(c, mud); });
        };
      });
      $$('.q-sel', l).forEach(function (c) {
        c.onchange = function () {
          var id = c.getAttribute('data-id');
          if (c.checked) marcadas[id] = true; else delete marcadas[id];
          barraLote(qs);
        };

      barraLote(qs);
    }).catch(function (e) { l.innerHTML = '<div class="aviso verm">' + esc(msgErro(e)) + '</div>'; });
  };
  /** Atualiza só o item da lista (sem recarregar tudo); sem informação, recarrega. */
  var atualizarItem = function (card, mud) {
    if (!mud || !mud.status || !card) { carregar(); return; }
    var t = $('.q-meta .tag', card);
    if (t) t.outerHTML = tag(STATUS_Q, mud.status);
    var sel = $('.q-sel-box', card);
    if (sel && APROVAVEIS.indexOf(mud.status) < 0) {
      sel.remove(); card.classList.remove('com-sel'); delete marcadas[card.getAttribute('data-id')];
      var q = ultimas.filter(function (x) { return x.id === card.getAttribute('data-id'); })[0];
      if (q) q.status = mud.status;
      barraLote(ultimas);
    }
  };
  $('#f-status').onchange = carregar; $('#f-disc').onchange = carregar;
  VIEWS.questoes.recarregar = carregar;
  carregar();
};

// ---------------------------------------------------------------- figuras no enunciado
/** Enunciado com as figuras no lugar de [FIGURA n]; as não marcadas vão para o fim.
 *  urls: lista na ordem das figuras (null = ainda carregando); total: quantas figuras a questão tem. */
function enunciadoHtml(texto, urls, total, classe) {
  texto = String(texto || '').replace(/\[FIGURA\]/gi, '[FIGURA 1]');
  urls = urls || [];
  total = Math.max(total || 0, urls.length);
  var usadas = {}, h = '';
  var fig = function (n) {
    usadas[n] = true;
    return urls[n] ? '<img class="figura" src="' + urls[n] + '" alt="Figura ' + (n + 1) + '">'
      : '<div class="fig-ph">Figura ' + (n + 1) + (n < total ? ' (carregando…)' : ' (não encontrada)') + '</div>';
  };
  String(texto).split(/\[FIGURA\s+(\d+)\]/i).forEach(function (p, i) {
    if (i % 2 === 0) { p = p.replace(/^\n+|\n+$/g, ''); if (p.trim()) h += '<div class="' + (classe || 'enun') + '">' + esc(p) + '</div>'; }
    else h += fig(Number(p) - 1);
  });
  for (var n = 0; n < total; n++) if (!usadas[n]) h += fig(n);
  return h;
}
/** Texto sem as marcações de figura (para listas e relatórios sem imagem) */
function semFiguras(t) { return String(t || '').replace(/\[FIGURA\s*(\d*)\]/gi, function (m, n) { return '(figura ' + (n || 1) + ')'; }); }

// ---------------------------------------------------------------- colar alternativas
/** Procura as marcações (A) … (E) num texto colado.
 *  Aceita (A), [A], A), a), A. ou A - no começo da linha, e (A) ou [A] no meio da linha.
 *  Devolve { antes, alts } ou null. minimo: quantas letras seguidas, a partir da primeira, precisam aparecer. */
function separarAlternativas(texto, letras, minimo, primeira) {
  // primeiro só marcações no começo da linha (mais seguro); depois aceita também (A) no meio da linha
  return separarAlternativas_(texto, letras, minimo, primeira, false) || separarAlternativas_(texto, letras, minimo, primeira, true);
}
function separarAlternativas_(texto, letras, minimo, primeira, aceitaMeio) {
  texto = String(texto || '').replace(/\r/g, '');
  var ini = primeira ? letras.indexOf(primeira) : 0;
  var achados = [], pos = 0;
  for (var k = ini; k < letras.length; k++) {
    var L = letras[k];
    var reLinha = new RegExp('(^|\\n)[ \\t]*[\\(\\[]?' + L + '[\\)\\]\\.:–-][ \\t]*', 'gi');
    var reMeio = new RegExp('(^|\\s)[\\(\\[]' + L + '[\\)\\]][ \\t]*', 'gi');
    var melhor = null;
    (aceitaMeio ? [reLinha, reMeio] : [reLinha]).forEach(function (re) {
      re.lastIndex = pos;
      var m = re.exec(texto);
      if (m && (!melhor || m.index < melhor.index)) melhor = { index: m.index + m[1].length, fim: m.index + m[0].length };
    });
    if (!melhor) break;
    achados.push({ letra: L, index: melhor.index, fim: melhor.fim });
    pos = melhor.fim;
  }
  if (achados.length < minimo) return null;
  var alts = {};
  achados.forEach(function (a, i) {
    var fim = i + 1 < achados.length ? achados[i + 1].index : texto.length;
    alts[a.letra] = texto.slice(a.fim, fim).replace(/\s+/g, ' ').trim();
  });
  return { antes: texto.slice(0, achados[0].index).replace(/\s+$/, ''), alts: alts };
}

// ---------------------------------------------------------------- formulário da questão
function formQuestao(q) {
  var c = conc('ESPCEX');
  var discs = disciplinasDe('ESPCEX');
  if (S.user.perfil === 'PROFESSOR' && S.user.disciplinas) {
    var minhas = csv(S.user.disciplinas);
    discs = discs.filter(function (d) { return minhas.indexOf(d) >= 0; });
  }
  q = q || {};
  var alt = q.alternativas || {};
  var md = modal(topoModal(q.id ? 'Editar questão ' + q.id : 'Nova questão') +
    '<form id="fq">' +
    '<div class="linha"><label class="campo"><span>Concurso</span><select disabled><option>' + esc(c.nome) + '</option></select></label>' +
    '<label class="campo"><span>Disciplina *</span><select id="q-disc" required>' +
    discs.map(function (d) { return '<option' + (d === q.disciplina ? ' selected' : '') + '>' + esc(d) + '</option>'; }).join('') + '</select></label></div>' +
    '<div class="linha"><label class="campo"><span>Conteúdo do edital</span><input type="text" id="q-cont" placeholder="Ex.: Cinemática – MRUV" value="' + esc(q.conteudo) + '"></label>' +
    '<label class="campo"><span>Habilidade (opcional)</span><input type="text" id="q-hab" placeholder="Ex.: interpretar gráficos" value="' + esc(q.habilidade) + '"></label></div>' +
    '<label class="campo"><span>Enunciado *</span><textarea id="q-enun" rows="8" required>' + esc(q.enunciado) + '</textarea></label>' +
    '<div class="dica peq"><b>Dicas:</b> para pôr uma figura no meio do texto, clique no ponto do enunciado e cole a imagem com <b>Ctrl+V</b> ' +
    '(ou use "Adicionar figura" e depois "Inserir no texto"). Se colar a questão inteira, com as alternativas, o MIRA separa as alternativas sozinho.</div>' +
    '<div class="campo"><span class="mut peq" style="font-weight:600">Figuras</span>' +
    '<div id="q-figs" class="figs"></div>' +
    '<label class="btn peq" style="cursor:pointer;display:inline-flex;margin-top:6px"><input type="file" id="q-img" accept="image/*" multiple style="display:none">+ Adicionar figura</label></div>' +
    '<div class="campo"><span class="mut peq" style="font-weight:600">Alternativas * — marque a correta</span>' +
    '<p class="mut peq" style="margin:2px 0 4px">Pode colar todas de uma vez no campo (A): o MIRA separa em A, B, C, D e E.</p>' +
    c.alternativas.map(function (l) {
      return '<div class="alt-lin" data-l="' + l + '">' +
        '<label class="alt-gab"><input type="radio" name="q-gab" value="' + l + '"' + (q.gabaritoProfessor === l ? ' checked' : '') + '> ' + l + '</label>' +
        '<textarea id="q-alt-' + l + '" class="q-alt" data-l="' + l + '" rows="1" style="min-height:40px" required>' + esc(alt[l]) + '</textarea>' +
        '<span class="alt-ok">✔ correta</span></div>';
    }).join('') + '</div>' +
    '<div class="aviso azul peq">Depois de salva, a questão passa pela curadoria: resolução, conferência do gabarito e o erro de raciocínio por trás de cada alternativa incorreta. Capriche nas alternativas erradas: elas é que revelam as dificuldades dos alunos.</div>' +
    '<div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn fechar">Cancelar</button>' +
    '<button class="btn pri" id="q-salvar">Salvar questão</button></div></form>', true);

  var enun = $('#q-enun', md.el);
  var figuras = []; // { id?, url, base64?, mime? }
  var cursor = null;
  var lembrarCursor = function () { cursor = { ini: enun.selectionStart, fim: enun.selectionEnd }; };
  ['keyup', 'click', 'select', 'blur', 'input'].forEach(function (ev) { enun.addEventListener(ev, lembrarCursor); });

  var inserirNoEnunciado = function (txt) {
    var v = enun.value;
    var p = cursor || { ini: v.length, fim: v.length };
    enun.value = v.slice(0, p.ini) + txt + v.slice(p.fim);
    var novo = p.ini + txt.length;
    enun.focus(); enun.setSelectionRange(novo, novo);
    cursor = { ini: novo, fim: novo };
  };
  var marcador = function (n) {
    var v = enun.value, p = cursor ? cursor.ini : v.length;
    return (p > 0 && v.charAt(p - 1) !== '\n' ? '\n' : '') + '[FIGURA ' + n + ']' + (v.charAt(p) === '\n' ? '' : '\n');
  };

  var desenharFiguras = function () {
    var box = $('#q-figs', md.el);
    if (!figuras.length) { box.innerHTML = '<p class="mut peq" style="margin:4px 0">Nenhuma figura.</p>'; return; }
    box.innerHTML = figuras.map(function (f, i) {
      var n = i + 1, marcada = new RegExp('\\[FIGURA\\s+' + n + '\\]', 'i').test(enun.value) || (n === 1 && /\[FIGURA\]/i.test(enun.value));
      return '<div class="fig-card"><img src="' + f.url + '" alt="Figura ' + n + '"><div><b>Figura ' + n + '</b><br>' +
        '<span class="mut peq">' + (marcada ? 'No texto, onde está [FIGURA ' + n + ']' : 'Aparece depois do texto') + '</span><br>' +
        (marcada ? '' : '<button type="button" class="btn peq" data-ins="' + i + '">Inserir no texto</button> ') +
        '<button type="button" class="btn peq perigo" data-rem="' + i + '">Remover</button></div></div>';
    }).join('');
    $$('[data-ins]', box).forEach(function (b) {
      b.onclick = function () { inserirNoEnunciado(marcador(+b.getAttribute('data-ins') + 1)); desenharFiguras(); };
    });
    $$('[data-rem]', box).forEach(function (b) {
      b.onclick = function () {
        var i = +b.getAttribute('data-rem'), n = i + 1;
        figuras.splice(i, 1);
        // tira a marcação desta figura e renumera as seguintes
        enun.value = enun.value.replace(/\[FIGURA\]/gi, '[FIGURA 1]')
          .replace(new RegExp('\\n?\\[FIGURA\\s+' + n + '\\]\\n?', 'gi'), '\n')
          .replace(/\[FIGURA\s+(\d+)\]/gi, function (m, k) { k = +k; return '[FIGURA ' + (k > n ? k - 1 : k) + ']'; });
        desenharFiguras();
      };
    });
  };
  enun.addEventListener('input', function () { if (figuras.length) desenharFiguras(); });

  var adicionarArquivo = function (file, noTexto) {
    return lerImagem(file, 1400, 0.9).then(function (r) {
      figuras.push({ url: r.url, base64: r.base64, mime: r.mime });
      if (noTexto) inserirNoEnunciado(marcador(figuras.length));
      desenharFiguras();
      toast('Figura ' + figuras.length + ' adicionada' + (noTexto ? ' no ponto do texto.' : '.'));
    }).catch(function (er) { toast(msgErro(er), true); });
  };

  if (q.imagemId) {
    $('#q-figs', md.el).innerHTML = '<div class="carregando"><div class="giro"></div>Carregando figuras…</div>';
    call('imagemQuestao', { id: q.id }).then(function (l) {
      figuras = (l || []).filter(function (f) { return f.url; }).map(function (f) { return { id: f.id, url: f.url }; });
      desenharFiguras();
    });
  } else desenharFiguras();

  $('#q-img', md.el).onchange = function (e) {
    var fs = Array.prototype.slice.call(e.target.files);
    fs.reduce(function (p, f) { return p.then(function () { return adicionarArquivo(f, false); }); }, Promise.resolve());
    e.target.value = '';
  };

  // correta em destaque
  var marcarCorreta = function () {
    $$('.alt-lin', md.el).forEach(function (d) {
      d.classList.toggle('gab-on', !!$('input[name=q-gab]:checked', d));
    });
  };
  $$('input[name=q-gab]', md.el).forEach(function (r) { r.addEventListener('change', marcarCorreta); });
  marcarCorreta();

  var preencherAlternativas = function (alts) {
    Object.keys(alts).forEach(function (l) { var t = $('#q-alt-' + l, md.el); if (t) t.value = alts[l]; });
  };

  // colar: imagem vira figura; texto com (A)…(E) vira alternativas
  md.el.addEventListener('paste', function (e) {
    var cd = e.clipboardData; if (!cd) return;
    var texto = cd.getData('text/plain') || '';
    var arq = null;
    Array.prototype.slice.call(cd.items || []).forEach(function (it) {
      if (!arq && it.kind === 'file' && /^image\//.test(it.type)) arq = it.getAsFile();
    });
    if (arq && !texto.trim()) {
      e.preventDefault();
      if (e.target === enun) lembrarCursor();
      adicionarArquivo(arq, e.target === enun);
      return;
    }
    if (!texto) return;
    if (e.target === enun) {
      var r = separarAlternativas(texto, c.alternativas, c.alternativas.length);
      if (r) {
        e.preventDefault(); lembrarCursor();
        inserirNoEnunciado(r.antes);
        preencherAlternativas(r.alts);
        toast('Alternativas separadas automaticamente. Confira e marque a correta.');
      }
    } else if (e.target.classList && e.target.classList.contains('q-alt')) {
      var r2 = separarAlternativas(texto, c.alternativas, 2, null);
      if (r2) {
        e.preventDefault();
        if (r2.antes.trim() && !r2.alts[e.target.getAttribute('data-l')]) e.target.value = r2.antes.trim();
        preencherAlternativas(r2.alts);
        toast(Object.keys(r2.alts).length + ' alternativas preenchidas. Confira e marque a correta.');
      }
    }
  });

  $('#fq', md.el).onsubmit = function (e) {
    e.preventDefault();
    var g = $('input[name=q-gab]:checked', md.el);
    if (!g) { toast('Marque a alternativa correta.', true); return; }
    var faltando = [];
    (enun.value.match(/\[FIGURA\s*(\d*)\]/gi) || []).forEach(function (m) {
      var n = +(m.match(/\d+/) || [1])[0];
      if (n > figuras.length && faltando.indexOf(n) < 0) faltando.push(n);
    });
    if (faltando.length) { toast('O texto marca a Figura ' + faltando.join(', ') + ', mas ela não foi adicionada.', true); return; }
    var alts = {};
    c.alternativas.forEach(function (l) { alts[l] = $('#q-alt-' + l, md.el).value; });
    var dados = {
      id: q.id, concurso: 'ESPCEX', disciplina: $('#q-disc', md.el).value, conteudo: $('#q-cont', md.el).value,
      habilidade: $('#q-hab', md.el).value, enunciado: enun.value, alternativas: alts,
      gabaritoProfessor: g.value,
      figuras: figuras.map(function (f) { return f.id ? { id: f.id } : { base64: f.base64, mime: f.mime }; })
    };
    ocupado($('#q-salvar', md.el), 'Salvando…', function () { return call('salvarQuestao', dados); })
      .then(function (r) {
        md.fechar();
        if (r.aviso) toast(r.aviso, true);
        else toast(r.questao.status === 'PENDENTE' ? 'Questão salva. Ela entra na próxima curadoria.' : 'Questão salva e analisada.');
        if (VIEWS.questoes.recarregar && S.rota === 'questoes') VIEWS.questoes.recarregar();
        verQuestao(r.questao, VIEWS.questoes.recarregar);
      }).catch(function () {});
  };
}

function copiar(texto, btn) {
  var ok = function () { var t = btn.textContent; btn.textContent = 'Copiado ✓'; setTimeout(function () { btn.textContent = t; }, 2000); };
  try {
    navigator.clipboard.writeText(texto).then(ok, function () { throw 0; });
  } catch (e) { toast('Selecione o texto e copie com Ctrl+C (ou toque e segure).'); }
}

function exportarLote() {
  var md = modal(topoModal('Exportar lote para curadoria') +
    '<p class="peq">Gera um texto com as questões que aguardam curadoria, já com as instruções. ' +
    'Cole no chat do Claude, receba a resposta e use <b>Importar curadoria</b>.</p>' +
    '<div class="linha"><label class="campo"><span>Quantidade por lote</span><select id="lt-n"><option>10</option><option selected>15</option><option>20</option><option>30</option></select></label>' +
    '<label class="campo" style="display:flex;align-items:flex-end;gap:8px"><input type="checkbox" id="lt-rev" style="width:auto"> <span style="margin:0;font-weight:400">Incluir as marcadas "Revisar"</span></label></div>' +
    '<button class="btn pri" id="lt-ger">Gerar lote</button><div id="lt-res"></div>', true);
  $('#lt-ger', md.el).onclick = function () {
    ocupado(this, 'Gerando…', function () { return call('exportarLote', { limite: $('#lt-n', md.el).value, incluirRevisar: $('#lt-rev', md.el).checked }); })

        var alvo = $('#lt-res', md.el);

        alvo.innerHTML = '<div class="aviso azul" style="margin-top:12px">' + r.quantidade + ' de ' + r.total + ' questão(ões) pendentes neste lote.</div>' +
          (r.figuras.length ? '<div class="aviso ambar"><b>Questões com figura:</b> baixe e anexe junto no chat. ' + r.figuras.map(function (f) {
            return '<a href="' + esc(f.url) + '" target="_blank">' + esc(f.id) + '</a>';
          }).join(' · ') + '</div>' : '') +
          '<textarea id="lt-txt" rows="12" readonly style="font-family:monospace;font-size:12px">' + esc(r.texto) + '</textarea>' +
          '<div style="display:flex;justify-content:flex-end;margin-top:8px"><button class="btn pri" id="lt-cp">Copiar texto</button></div>';
        $('#lt-txt', md.el).onclick = function () { this.select(); };
        $('#lt-cp', md.el).onclick = function () { $('#lt-txt', md.el).select(); copiar(r.texto, this); };
      }).catch(function () {});
  };
}

function importarCuradoria() {

    '<textarea id="ic-txt" rows="12" style="font-family:monospace;font-size:12px" placeholder="[{&quot;id&quot;:&quot;Q…&quot;, …}]"></textarea>' +

  $('#ic-ok', md.el).onclick = function () {

      $('#ic-res', md.el).innerHTML =
